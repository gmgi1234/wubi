<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>词组练习 · 五笔编码练习 · 五笔字根</title>
<meta name="description" content="五笔词组编码练习：看词打码，自动判定对错，支持三版编码、错题本与计时统计。">
<style>
 :root { --ink:#2a2320; --muted:#8a7b6c; --line:#e6dcc9; --bg:#fbf7ef; --accent:#a33c2f; --paper:#fffdf8; --ok:#2e7d32; --bad:#c0392b; }
 * { box-sizing: border-box; }
 body { margin:0; background:var(--bg); color:var(--ink); font-family:'KaiTi','楷体','STKaiti',serif; line-height:1.7; }
 header { border-bottom:1px solid var(--line); padding:12px 20px; display:flex; justify-content:space-between; align-items:center; font-size:15px; }
 header a { color:var(--muted); text-decoration:none; }
 main { max-width:820px; margin:20px auto 0; background:var(--paper); box-shadow:0 0 0 1px var(--line); border-radius:16px; padding:26px 24px 40px; }
 h1 { font-size:28px; margin:0 0 4px; }
 .sub { color:var(--muted); margin-bottom:20px; }
 .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:10px 0; }
 .lab { color:var(--muted); width:72px; font-size:15px; }
 .chip { border:1px solid var(--line); border-radius:999px; padding:6px 14px; background:#fff; cursor:pointer; font-family:inherit; font-size:15px; color:var(--ink); }
 .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
 .start { display:block; margin:26px auto 0; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px 40px; font-size:18px; font-family:inherit; cursor:pointer; }
 .statbar { display:flex; gap:18px; color:var(--muted); font-size:14px; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); padding:8px 0; margin-bottom:18px; }
 .statbar b { color:var(--ink); font-weight:normal; }
 .word { font-size:64px; text-align:center; letter-spacing:6px; margin:10px 0 6px; }
 .hint { text-align:center; color:var(--muted); font-size:18px; min-height:30px; }
 .hint .code { font-family:ui-monospace,Consolas,monospace; letter-spacing:4px; color:var(--accent); }
 .answer { display:flex; justify-content:center; gap:8px; margin:16px 0 6px; }
 .box { width:54px; height:64px; border:1px solid var(--line); border-radius:10px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:30px; font-family:ui-monospace,Consolas,monospace; }
 .box.cur { border-color:var(--accent); }
 .box.ok { border-color:var(--ok); color:var(--ok); }
 .box.bad { border-color:var(--bad); color:var(--bad); }
 .msg { text-align:center; font-size:18px; min-height:28px; }
 .msg.ok { color:var(--ok); }
 .msg.bad { color:var(--bad); }
 .actions { display:flex; justify-content:center; gap:12px; margin-top:22px; }
 .actions button { font-family:inherit; font-size:15px; padding:8px 18px; border-radius:9px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink); }
 .actions button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
 .result { text-align:center; }
 .big { font-size:46px; color:var(--accent); }
 table { width:100%; border-collapse:collapse; margin-top:14px; font-size:15px; }
 td, th { border-bottom:1px solid var(--line); padding:8px 6px; text-align:left; }
 th { color:var(--muted); font-weight:normal; }
 .empty { color:var(--muted); text-align:center; padding:20px; }
 .hidden { display:none !important; }
 input.secret { position:absolute; opacity:0; pointer-events:none; }
 footer { text-align:center; color:var(--muted); font-size:13px; padding:18px; }
</style>
</head><body>
<header><a href="./">五笔字根 · 笔画着色</a><span><a href="char/">全部单字</a>　<a href="ci/">全部词组</a>　<a href="./">回首页</a></span></header>
<main>
  <!-- 设置 -->
  <section id="setup">
    <h1>词组练习</h1>
    <div class="sub">看词打码，打完 4 位自动判定</div>

    <div class="row"><span class="lab">字数</span>
      <button class="chip on" data-len="2">双字词</button>
      <button class="chip" data-len="3">三字词</button>
      <button class="chip" data-len="4">四字词</button>
      <button class="chip" data-len="5">五字词</button>
      <button class="chip" data-len="6">六字以上</button>
    </div>

    <div class="row"><span class="lab">版本</span>
      <button class="chip on" data-ver="6">新世纪</button>
      <button class="chip" data-ver="8">86 版</button>
      <button class="chip" data-ver="9">98 版</button>
    </div>

    <div class="row"><span class="lab">难度</span>
      <button class="chip on" data-hint="2">显示字根 + 编码</button>
      <button class="chip" data-hint="1">只显示字根</button>
      <button class="chip" data-hint="0">不看提示</button>
    </div>

    <div class="row"><span class="lab">题量</span>
      <button class="chip on" data-count="10">10 题</button>
      <button class="chip" data-count="20">20 题</button>
      <button class="chip" data-count="50">50 题</button>
      <button class="chip" data-count="0">不限</button>
    </div>

    <div class="row"><span class="lab">统计</span>
      <button class="chip on" id="statToggle">计时与统计：开</button>
    </div>

    <button class="start" id="startBtn">开始练习</button>

    <div class="row" style="margin-top:26px"><span class="lab">错题本</span>
      <span id="wrongCount" class="sub" style="margin:0">—</span>
      <button class="chip" id="practiceWrong">练错题</button>
      <button class="chip" id="clearWrong">清空</button>
    </div>
  </section>

  <!-- 练习 -->
  <section id="play" class="hidden">
    <div class="statbar" id="statbar">
      <span>第 <b id="qIndex">1</b> / <b id="qTotal">10</b> 题</span>
      <span>正确 <b id="qRight">0</b></span>
      <span>连击 <b id="qStreak">0</b></span>
      <span>用时 <b id="qTime">0s</b></span>
    </div>
    <div class="word" id="word">—</div>
    <div class="hint" id="hint"></div>
    <div class="answer" id="answer"></div>
    <div class="msg" id="msg">输入 4 位编码</div>
    <div class="actions">
      <button id="skipBtn">跳过（看答案）</button>
      <button id="endBtn">结束本轮</button>
    </div>
    <input class="secret" id="secret" autocomplete="off" autocapitalize="off" spellcheck="false">
  </section>

  <!-- 结果 -->
  <section id="result" class="hidden">
    <div class="result">
      <h1>本轮结束</h1>
      <div class="big" id="acc">0%</div>
      <div class="sub" id="summary">—</div>
    </div>
    <h2 style="font-size:18px;margin-top:20px">错词</h2>
    <div id="wrongList"></div>
    <div class="actions">
      <button class="primary" id="againBtn">再来一轮</button>
      <button id="retryWrongBtn">只练错题</button>
      <button id="homeBtn">回设置</button>
    </div>
  </section>
</main>
<footer>数据来源：Rime 五笔码表 · 五笔大一统方案</footer>

<script>
(function () {
  var state = {
    len: 2, ver: '6', hint: 2, count: 10, stats: true,
    pool: [], idx: 0, right: 0, streak: 0, best: 0, startAt: 0,
    wrong: [], mode: 'normal', input: '', locked: false
  };

  var $ = function (id) { return document.getElementById(id); };
  var LS_WRONG = 'wubi_wrong_words_v1';

  // ---------- 错题本 ----------
  function loadWrong() {
    try { return JSON.parse(localStorage.getItem(LS_WRONG) || '[]'); } catch (e) { return []; }
  }
  function saveWrong(list) {
    try { localStorage.setItem(LS_WRONG, JSON.stringify(list.slice(0, 500))); } catch (e) {}
  }
  function addWrong(word) {
    var list = loadWrong();
    if (!list.some(function (x) { return x.w === word.w; })) {
      list.unshift({ w: word.w, len: word.len, t: Date.now() });
      saveWrong(list);
    }
  }
  function refreshWrongCount() {
    var n = loadWrong().length;
    $('wrongCount').textContent = n ? (n + ' 个错词') : '暂无错词';
  }

  // ---------- 选项 ----------
  document.querySelectorAll('[data-len]').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('[data-len]').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on'); state.len = Number(b.dataset.len);
    };
  });
  document.querySelectorAll('[data-ver]').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('[data-ver]').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on'); state.ver = b.dataset.ver;
    };
  });
  document.querySelectorAll('[data-hint]').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('[data-hint]').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on'); state.hint = Number(b.dataset.hint);
    };
  });
  document.querySelectorAll('[data-count]').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('[data-count]').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on'); state.count = Number(b.dataset.count);
    };
  });
  $('statToggle').onclick = function () {
    state.stats = !state.stats;
    this.textContent = '计时与统计：' + (state.stats ? '开' : '关');
    this.classList.toggle('on', state.stats);
  };

  // ---------- 数据 ----------
  function loadData(len, cb) {
    var key = 'PRACTICE_' + len;
    if (window[key]) { cb(window[key]); return; }
    var s = document.createElement('script');
    s.src = 'data/practice-' + len + '.js';
    s.onload = function () { cb(window[key] || []); };
    s.onerror = function () { cb([]); };
    document.head.appendChild(s);
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function rowToWord(r, len) {
    return { w: r[0], c6: r[1], c86: r[2], c98: r[3], r6: r[4], r86: r[5], r98: r[6], len: len };
  }

  function codeOf(word) { return state.ver === '86' ? word.c86 : state.ver === '98' ? word.c98 : word.c6; }
  function rootsOf(word) { return state.ver === '86' ? word.r86 : state.ver === '98' ? word.r98 : word.r6; }

  // ---------- 开始 ----------
  function begin(words) {
    state.pool = words;
    state.idx = 0; state.right = 0; state.streak = 0; state.best = 0;
    state.startAt = Date.now(); state.wrong = []; state.input = ''; state.locked = false;
    $('setup').classList.add('hidden');
    $('result').classList.add('hidden');
    $('play').classList.remove('hidden');
    $('statbar').classList.toggle('hidden', !state.stats);
    $('qTotal').textContent = words.length;
    nextQuestion();
    tick();
  }

  function startNormal() {
    loadData(state.len, function (rows) {
      if (!rows.length) { alert('这一分类没有数据'); return; }
      var pool = shuffle(rows.map(function (r) { return rowToWord(r, state.len); }));
      if (state.count > 0) pool = pool.slice(0, state.count);
      begin(pool);
    });
  }

  function startWrong() {
    var list = loadWrong();
    if (!list.length) { alert('错题本还是空的'); return; }
    var byLen = {};
    list.forEach(function (x) { (byLen[x.len] = byLen[x.len] || []).push(x.w); });
    var lens = Object.keys(byLen);
    var pending = lens.length, out = [];
    lens.forEach(function (L) {
      loadData(L, function (rows) {
        var wanted = {}; byLen[L].forEach(function (w) { wanted[w] = 1; });
        rows.forEach(function (r) { if (wanted[r[0]]) out.push(rowToWord(r, Number(L))); });
        pending -= 1;
        if (pending === 0) {
          if (!out.length) { alert('错题无法匹配到题库'); return; }
          begin(shuffle(out));
        }
      });
    });
  }

  // ---------- 出题与判定 ----------
  function nextQuestion() {
    if (state.idx >= state.pool.length) { return finish(); }
    var w = state.pool[state.idx];
    state.locked = false;
    state.input = '';
    $('qIndex').textContent = state.idx + 1;
    $('qRight').textContent = state.right;
    $('qStreak').textContent = state.streak;
    $('word').textContent = w.w;
    $('msg').textContent = '输入 4 位编码';
    $('msg').className = 'msg';

    var hint = '';
    if (state.hint === 2) hint = '<div>' + rootsOf(w) + '（字根）</div><div class="code">' + codeOf(w).toUpperCase() + '</div>';
    else if (state.hint === 1) hint = '<div>' + rootsOf(w) + '（字根）</div>';
    $('hint').innerHTML = hint;

    renderBoxes('');
    $('secret').focus();
  }

  function renderBoxes(val, mark) {
    var box = '';
    var code = state.pool[state.idx] ? codeOf(state.pool[state.idx]) : '';
    for (var i = 0; i < 4; i++) {
      var cls = 'box';
      if (i === val.length && !mark) cls += ' cur';
      if (mark === 'ok') cls += ' ok';
      if (mark === 'bad') cls += ' bad';
      box += '<div class="' + cls + '">' + (val[i] ? val[i].toUpperCase() : '') + '</div>';
    }
    $('answer').innerHTML = box;
  }

  function judge() {
    var w = state.pool[state.idx];
    var code = codeOf(w).toLowerCase();
    var typed = state.input.toLowerCase();
    state.locked = true;
    if (typed === code) {
      state.right += 1;
      state.streak += 1;
      state.best = Math.max(state.best, state.streak);
      renderBoxes(typed, 'ok');
      $('msg').textContent = '✓ 正确';
      $('msg').className = 'msg ok';
      $('qRight').textContent = state.right;
      $('qStreak').textContent = state.streak;
      setTimeout(function () { state.idx += 1; nextQuestion(); }, 700);
    } else {
      state.streak = 0;
      renderBoxes(typed, 'bad');
      $('qStreak').textContent = 0;
      var pos = 0;
      while (pos < 4 && typed[pos] === code[pos]) pos += 1;
      $('msg').innerHTML = '✗ 正确是 <span class="code">' + code.toUpperCase() + '</span>，第 ' + (pos + 1) + ' 位错了';
      $('msg').className = 'msg bad';
      state.wrong.push({ w: w.w, code: code, typed: typed, len: w.len });
      addWrong(w);
    }
  }

  function tick() {
    if ($('play').classList.contains('hidden')) return;
    if (state.stats) {
      $('qTime').textContent = Math.round((Date.now() - state.startAt) / 1000) + 's';
    }
    setTimeout(tick, 500);
  }

  // ---------- 输入 ----------
  $('secret').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); return; }
    if (e.key === 'Backspace') {
      e.preventDefault();
      if (!state.locked) { state.input = state.input.slice(0, -1); renderBoxes(state.input); }
      return;
    }
    if (e.key === ' ') {
      e.preventDefault();
      if (state.locked) { state.idx += 1; nextQuestion(); }
      return;
    }
    if (/^[a-zA-Z]$/.test(e.key)) {
      e.preventDefault();
      if (state.locked) return;
      if (state.input.length >= 4) return;
      state.input += e.key.toLowerCase();
      renderBoxes(state.input);
      if (state.input.length === 4) judge();
    }
  });

  // 点哪里都能聚焦到隐形输入
  $('play').addEventListener('click', function () { $('secret').focus(); });

  $('skipBtn').onclick = function () {
    if (!state.locked) {
      var w = state.pool[state.idx];
      state.locked = true;
      state.streak = 0;
      $('qStreak').textContent = 0;
      $('msg').innerHTML = '答案 <span class="code">' + codeOf(w).toUpperCase() + '</span>（可跳过）';
      $('msg').className = 'msg';
      state.wrong.push({ w: w.w, code: codeOf(w), typed: '', len: w.len });
      addWrong(w);
    } else {
      state.idx += 1; nextQuestion();
    }
  };
  $('endBtn').onclick = function () { finish(); };

  // ---------- 结算 ----------
  function finish() {
    $('play').classList.add('hidden');
    $('result').classList.remove('hidden');
    var done = state.idx + (state.locked ? 1 : 0);
    if (done > state.pool.length) done = state.pool.length;
    var total = Math.max(done, 1);
    var acc = Math.round((state.right / total) * 100);
    $('acc').textContent = acc + '%';
    $('summary').textContent = '共 ' + done + ' 题 · 正确 ' + state.right + ' 题 · 最高连击 ' + state.best +
      (state.stats ? ' · 用时 ' + Math.round((Date.now() - state.startAt) / 1000) + ' 秒' : '');

    var rows = state.wrong.length
      ? '<table><tr><th>词组</th><th>正确编码</th><th>你的输入</th></tr>' +
        state.wrong.map(function (x) {
          return '<tr><td>' + x.w + '</td><td>' + x.code.toUpperCase() + '</td><td>' + (x.typed ? x.typed.toUpperCase() : '跳过') + '</td></tr>';
        }).join('') + '</table>'
      : '<div class="empty">全对，没有错词 👍</div>';
    $('wrongList').innerHTML = rows;
    refreshWrongCount();
  }

  $('againBtn').onclick = function () { startNormal(); };
  $('retryWrongBtn').onclick = function () { startWrong(); };
  $('homeBtn').onclick = function () {
    $('result').classList.add('hidden');
    $('play').classList.add('hidden');
    $('setup').classList.remove('hidden');
    refreshWrongCount();
  };

  $('startBtn').onclick = startNormal;
  $('practiceWrong').onclick = startWrong;
  $('clearWrong').onclick = function () {
    if (confirm('清空错题本？')) { saveWrong([]); refreshWrongCount(); }
  };

  refreshWrongCount();
})();
</script>
</body></html>
