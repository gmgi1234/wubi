<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>词组练习 · 五笔编码练习 · 五笔字根</title>
<meta name="description" content="五笔词组编码练习：看词打码，编码按位着色，自动判定对错，支持三版编码、错题本与计时统计。">
<style>
 :root { --ink:#2a2320; --muted:#8a7b6c; --line:#e6dcc9; --bg:#fbf7ef; --accent:#a33c2f; --paper:#fffdf8; --ok:#2e7d32; --bad:#c0392b; }
 * { box-sizing: border-box; }
 body { margin:0; background:var(--bg); color:var(--ink); font-family:'KaiTi','楷体','STKaiti',serif; line-height:1.7; }
 header { border-bottom:1px solid var(--line); padding:12px 20px; display:flex; justify-content:space-between; align-items:center; font-size:15px; }
 header a { color:var(--muted); text-decoration:none; }
 main { max-width:860px; margin:20px auto 0; background:var(--paper); box-shadow:0 0 0 1px var(--line); border-radius:16px; padding:22px 24px 34px; }
 h1 { font-size:26px; margin:0 0 2px; }
 .sub { color:var(--muted); margin-bottom:14px; font-size:15px; }
 .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
 .lab { color:var(--muted); width:56px; font-size:14px; }
 .chip { border:1px solid var(--line); border-radius:999px; padding:5px 13px; background:#fff; cursor:pointer; font-family:inherit; font-size:14px; color:var(--ink); }
 .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
 hr { border:0; border-top:1px dashed var(--line); margin:16px 0; }
 .statbar { display:flex; gap:18px; color:var(--muted); font-size:14px; padding:4px 0; }
 .statbar b { color:var(--ink); font-weight:normal; }
 .word { font-size:62px; text-align:center; letter-spacing:6px; margin:8px 0 2px; }
 .roots { text-align:center; font-size:20px; min-height:28px; }
 .roots .plus { color:var(--muted); font-size:14px; }
 .code-line { text-align:center; font-family:ui-monospace,Consolas,monospace; font-size:26px; letter-spacing:8px; min-height:34px; margin:2px 0 4px; }
 .answer { display:flex; justify-content:center; gap:8px; margin:10px 0 4px; }
 .box { width:52px; height:62px; border:1px solid var(--line); border-radius:10px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; font-family:ui-monospace,Consolas,monospace; }
 .box.cur { border-color:var(--accent); }
 .box.ok { border-color:var(--ok); color:var(--ok); }
 .box.bad { border-color:var(--bad); color:var(--bad); }
 .msg { text-align:center; font-size:17px; min-height:26px; }
 .msg.ok { color:var(--ok); }
 .msg.bad { color:var(--bad); }
 .actions { display:flex; justify-content:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
 .actions button { font-family:inherit; font-size:15px; padding:7px 16px; border-radius:9px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink); }
 .actions button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
 .result { text-align:center; }
 .big { font-size:44px; color:var(--accent); }
 table { width:100%; border-collapse:collapse; margin-top:10px; font-size:15px; }
 td, th { border-bottom:1px solid var(--line); padding:7px 6px; text-align:left; }
 th { color:var(--muted); font-weight:normal; }
 .empty { color:var(--muted); text-align:center; padding:16px; }
 .hidden { display:none !important; }
 input.secret { position:absolute; opacity:0; pointer-events:none; }
 footer { text-align:center; color:var(--muted); font-size:13px; padding:16px; }

 .layout { display:flex; align-items:flex-start; max-width:1180px; margin:0 auto; }
 aside { width:252px; flex:0 0 252px; position:sticky; top:0; align-self:flex-start; padding:20px 16px 24px 20px; border-right:1px solid var(--line); min-height:calc(100vh - 52px); }
 aside.hidden { display:none; }
 .side-head { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:14px; margin-bottom:12px; }
 .side-head button { border:1px solid var(--line); background:#fff; border-radius:7px; width:26px; height:26px; cursor:pointer; color:var(--muted); font-size:15px; line-height:1; }
 .side-body .bar { display:flex; flex-direction:column; align-items:flex-start; gap:6px; margin:12px 0; }
 .side-body .lab { width:auto; font-size:13px; margin-bottom:2px; }
 .side-body .chips { display:flex; flex-wrap:wrap; gap:6px; }
 .side-body .chip { font-size:13px; padding:4px 10px; }
 .side-body hr { margin:14px 0; width:100%; }
 .side-body .wrongbox { font-size:13px; color:var(--muted); }
 #openSide { position:fixed; left:10px; top:64px; z-index:40; border:1px solid var(--line); background:#fffdf8; border-radius:8px; padding:6px 10px; cursor:pointer; font-family:inherit; font-size:14px; color:var(--accent); }
 main { flex:1; min-width:0; max-width:820px; margin:20px auto; }
 @media (max-width:860px) {
   aside { position:fixed; left:0; top:0; bottom:0; z-index:60; background:var(--paper); box-shadow:6px 0 24px rgba(0,0,0,.12); overflow:auto; }
   aside.hidden { display:none; }
 }
</style>
</head><body>
<header><a href="./">五笔字根 · 笔画着色</a><span><a href="char/">全部单字</a>　<a href="ci/">全部词组</a>　<a href="./">回首页</a></span></header>
<div class="layout">
<aside id="sidebar">
  <div class="side-head"><span>练习设置</span><button id="collapseBtn" title="收起">×</button></div>
  <div class="side-body">
  <h1 style="font-size:20px;margin:0 0 2px">词组练习</h1>
  <div class="sub">看词打码，编码按位着色（红→橙→绿→蓝），打完 4 位自动判定</div>

  <!-- 选择区（练习中也能直接点） -->
  <div class="bar"><span class="lab">字数</span>
    <button class="chip on" data-len="2">双字词</button>
    <button class="chip" data-len="3">三字词</button>
    <button class="chip" data-len="4">四字词</button>
    <button class="chip" data-len="5">五字词</button>
    <button class="chip" data-len="6">六字以上</button>
  </div>
  <div class="bar"><span class="lab">版本</span>
    <button class="chip on" data-ver="6">新世纪</button>
    <button class="chip" data-ver="8">86 版</button>
    <button class="chip" data-ver="9">98 版</button>
  </div>
  <div class="bar"><span class="lab">题量</span>
    <button class="chip on" data-count="10">10 题</button>
    <button class="chip" data-count="20">20 题</button>
    <button class="chip" data-count="50">50 题</button>
    <button class="chip" data-count="0">不限</button>
  </div>
  <div class="bar"><span class="lab">提示</span>
    <button class="chip on" data-hint="2">字根 + 编码</button>
    <button class="chip" data-hint="1">只显示字根</button>
    <button class="chip" data-hint="0">不看提示</button>
    <button class="chip on" id="statToggle">计时统计：开</button>
  </div>

  </div>
</aside>
<button id="openSide" class="hidden" title="展开设置">设置</button>
<main>

  <!-- 练习区 -->
  <div id="play">
    <div class="statbar">
      <span>第 <b id="qIndex">1</b> / <b id="qTotal">10</b> 题</span>
      <span>正确 <b id="qRight">0</b></span>
      <span>连击 <b id="qStreak">0</b></span>
      <span>用时 <b id="qTime">0s</b></span>
      <span style="margin-left:auto">错题本 <b id="wrongCount">0</b></span>
    </div>
    <div class="word" id="word">—</div>
    <div class="roots" id="roots"></div>
    <div class="code-line" id="codeLine"></div>
    <div class="answer" id="answer"></div>
    <div class="msg" id="msg">输入 4 位编码</div>
    <div class="actions">
      <button id="skipBtn">跳过（看答案）</button>
      <button id="endBtn">结束本轮</button>
      <button id="practiceWrong">练错题</button>
      <button id="clearWrong">清空错题</button>
    </div>
    <input class="secret" id="secret" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>

  <!-- 结算区 -->
  <div id="result" class="hidden">
    <div class="result">
      <div class="big" id="acc">0%</div>
      <div class="sub" id="summary">—</div>
    </div>
    <h2 style="font-size:17px;margin-top:14px">错词</h2>
    <div id="wrongList"></div>
    <div class="actions">
      <button class="primary" id="againBtn">再来一轮</button>
      <button id="retryWrongBtn">只练错题</button>
    </div>
  </div>
</main>
</div>
<footer>数据来源：Rime 五笔码表 · 五笔大一统方案</footer>

<script>
(function () {
  var PALETTE = ['#E74C3C', '#FF9800', '#27AE60', '#2980B9'];
  var state = { len: 2, ver: '6', hint: 2, count: 10, stats: true, pool: [], idx: 0, right: 0, streak: 0, best: 0, startAt: 0, wrong: [], input: '', locked: false, running: false };
  var $ = function (id) { return document.getElementById(id); };
  var LS_WRONG = 'wubi_wrong_words_v1';

  function loadWrong() { try { return JSON.parse(localStorage.getItem(LS_WRONG) || '[]'); } catch (e) { return []; } }
  function saveWrong(list) { try { localStorage.setItem(LS_WRONG, JSON.stringify(list.slice(0, 500))); } catch (e) {} }
  function addWrong(w) {
    var list = loadWrong();
    if (!list.some(function (x) { return x.w === w.w; })) { list.unshift({ w: w.w, len: w.len, t: Date.now() }); saveWrong(list); }
  }
  function refreshWrongCount() { $('wrongCount').textContent = loadWrong().length; }

  // 选项点击
  document.querySelectorAll('[data-len]').forEach(function (b) {
    b.onclick = function () { document.querySelectorAll('[data-len]').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); state.len = Number(b.dataset.len); restart(); };
  });
  document.querySelectorAll('[data-ver]').forEach(function (b) {
    b.onclick = function () { document.querySelectorAll('[data-ver]').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); state.ver = b.dataset.ver; redrawQuestion(); };
  });
  document.querySelectorAll('[data-count]').forEach(function (b) {
    b.onclick = function () { document.querySelectorAll('[data-count]').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); state.count = Number(b.dataset.count); restart(); };
  });
  document.querySelectorAll('[data-hint]').forEach(function (b) {
    b.onclick = function () { document.querySelectorAll('[data-hint]').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); state.hint = Number(b.dataset.hint); redrawQuestion(); };
  });
  $('statToggle').onclick = function () {
    state.stats = !state.stats;
    this.textContent = '计时统计：' + (state.stats ? '开' : '关');
    this.classList.toggle('on', state.stats);
  };

  function codeOf(w) { return state.ver === '86' ? w.c86 : state.ver === '98' ? w.c98 : w.c6; }
  function rootsOf(w) { return state.ver === '86' ? w.r86 : state.ver === '98' ? w.r98 : w.r6; }

  function coloredCode(code) {
    return code.split('').map(function (L, i) { return '<span style="color:' + PALETTE[i % 4] + '">' + L.toUpperCase() + '</span>'; }).join('');
  }
  function coloredRoots(roots) {
    return roots.split(' ').map(function (r, i) { return '<span style="color:' + PALETTE[i % 4] + '">' + r + '</span>'; }).join('<span class="plus"> + </span>');
  }

  function loadData(len, cb) {
    var key = 'PRACTICE_' + len;
    if (window[key]) { cb(window[key]); return; }
    var s = document.createElement('script');
    s.src = 'data/practice-' + len + '.js';
    s.onload = function () { cb(window[key] || []); };
    s.onerror = function () { cb([]); };
    document.head.appendChild(s);
  }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function rowToWord(r, len) { return { w: r[0], c6: r[1], c86: r[2], c98: r[3], r6: r[4], r86: r[5], r98: r[6], len: len }; }

  function restart() {
    loadData(state.len, function (rows) {
      if (!rows.length) { $('word').textContent = '（该分类暂无数据）'; return; }
      var pool = shuffle(rows.map(function (r) { return rowToWord(r, state.len); }));
      if (state.count > 0) pool = pool.slice(0, state.count);
      state.pool = pool; state.idx = 0; state.right = 0; state.streak = 0; state.best = 0;
      state.wrong = []; state.startAt = Date.now(); state.running = true;
      $('result').classList.add('hidden');
      $('play').classList.remove('hidden');
      $('qTotal').textContent = pool.length;
      nextQuestion();
    });
  }

  function startWrong() {
    var list = loadWrong();
    if (!list.length) { alert('错题本还是空的'); return; }
    var byLen = {};
    list.forEach(function (x) { (byLen[x.len] = byLen[x.len] || []).push(x.w); });
    var lens = Object.keys(byLen), pending = lens.length, out = [];
    lens.forEach(function (L) {
      loadData(L, function (rows) {
        var wanted = {}; byLen[L].forEach(function (w) { wanted[w] = 1; });
        rows.forEach(function (r) { if (wanted[r[0]]) out.push(rowToWord(r, Number(L))); });
        pending -= 1;
        if (pending === 0) {
          if (!out.length) { alert('错题无法匹配到题库'); return; }
          state.pool = shuffle(out); state.idx = 0; state.right = 0; state.streak = 0; state.best = 0;
          state.wrong = []; state.startAt = Date.now(); state.running = true;
          $('result').classList.add('hidden'); $('play').classList.remove('hidden');
          $('qTotal').textContent = state.pool.length;
          nextQuestion();
        }
      });
    });
  }

  function redrawQuestion() {
    if (!state.running || !state.pool.length) return;
    var w = state.pool[state.idx];
    if (!w) return;
    $('word').textContent = w.w;
    $('roots').innerHTML = state.hint >= 1 ? coloredRoots(rootsOf(w)) : '';
    $('codeLine').innerHTML = state.hint === 2 ? coloredCode(codeOf(w)) : '';
  }

  function nextQuestion() {
    if (state.idx >= state.pool.length) return finish();
    state.locked = false; state.input = '';
    $('qIndex').textContent = state.idx + 1;
    $('qRight').textContent = state.right;
    $('qStreak').textContent = state.streak;
    $('msg').textContent = '输入 4 位编码';
    $('msg').className = 'msg';
    redrawQuestion();
    renderBoxes('');
    $('secret').focus();
  }

  function renderBoxes(val, mark) {
    var html = '';
    for (var i = 0; i < 4; i++) {
      var cls = 'box';
      if (i === val.length && !mark) cls += ' cur';
      if (mark === 'ok') cls += ' ok';
      if (mark === 'bad') cls += ' bad';
      html += '<div class="' + cls + '">' + (val[i] ? val[i].toUpperCase() : '') + '</div>';
    }
    $('answer').innerHTML = html;
  }

  function judge() {
    var w = state.pool[state.idx];
    var code = codeOf(w).toLowerCase();
    var typed = state.input.toLowerCase();
    state.locked = true;
    if (typed === code) {
      state.right += 1; state.streak += 1; state.best = Math.max(state.best, state.streak);
      renderBoxes(typed, 'ok');
      $('msg').textContent = '✓ 正确';
      $('msg').className = 'msg ok';
      $('qRight').textContent = state.right;
      $('qStreak').textContent = state.streak;
      setTimeout(function () { state.idx += 1; nextQuestion(); }, 650);
    } else {
      state.streak = 0;
      renderBoxes(typed, 'bad');
      $('qStreak').textContent = 0;
      var pos = 0;
      while (pos < 4 && typed[pos] === code[pos]) pos += 1;
      $('msg').innerHTML = '✗ 正确是 ' + coloredCode(code) + '，第 ' + (pos + 1) + ' 位错了';
      $('msg').className = 'msg bad';
      state.wrong.push({ w: w.w, code: code, typed: typed, len: w.len });
      addWrong(w); refreshWrongCount();
    }
  }

  setInterval(function () {
    if (state.stats && state.running) $('qTime').textContent = Math.round((Date.now() - state.startAt) / 1000) + 's';
  }, 500);

  $('secret').addEventListener('keydown', function (e) {
    if (e.key === 'Backspace') { e.preventDefault(); if (!state.locked) { state.input = state.input.slice(0, -1); renderBoxes(state.input); } return; }
    if (e.key === ' ') { e.preventDefault(); if (state.locked) { state.idx += 1; nextQuestion(); } return; }
    if (/^[a-zA-Z]$/.test(e.key)) {
      e.preventDefault();
      if (state.locked || state.input.length >= 4) return;
      state.input += e.key.toLowerCase();
      renderBoxes(state.input);
      if (state.input.length === 4) judge();
    }
  });
  $('play').addEventListener('click', function () { $('secret').focus(); });

  $('skipBtn').onclick = function () {
    if (!state.locked) {
      var w = state.pool[state.idx];
      state.locked = true; state.streak = 0;
      $('qStreak').textContent = 0;
      $('msg').innerHTML = '答案 ' + coloredCode(codeOf(w)) + '（按空格继续）';
      $('msg').className = 'msg';
      state.wrong.push({ w: w.w, code: codeOf(w), typed: '', len: w.len });
      addWrong(w); refreshWrongCount();
    } else { state.idx += 1; nextQuestion(); }
  };
  $('endBtn').onclick = function () { finish(); };
  $('againBtn').onclick = function () { restart(); };
  $('retryWrongBtn').onclick = function () { startWrong(); };
  $('practiceWrong').onclick = startWrong;
  $('clearWrong').onclick = function () { if (confirm('清空错题本？')) { saveWrong([]); refreshWrongCount(); } };

  function finish() {
    state.running = false;
    $('play').classList.add('hidden');
    $('result').classList.remove('hidden');
    var done = Math.min(state.idx + (state.locked ? 1 : 0), state.pool.length) || 1;
    var total = Math.max(done, 1);
    $('acc').textContent = Math.round((state.right / total) * 100) + '%';
    $('summary').textContent = '共 ' + done + ' 题 · 正确 ' + state.right + ' 题 · 最高连击 ' + state.best +
      (state.stats ? ' · 用时 ' + Math.round((Date.now() - state.startAt) / 1000) + ' 秒' : '');
    $('wrongList').innerHTML = state.wrong.length
      ? '<table><tr><th>词组</th><th>正确编码</th><th>你的输入</th></tr>' + state.wrong.map(function (x) {
          return '<tr><td>' + x.w + '</td><td>' + coloredCode(x.code) + '</td><td>' + (x.typed ? x.typed.toUpperCase() : '跳过') + '</td></tr>';
        }).join('') + '</table>'
      : '<div class="empty">全对，没有错词 👍</div>';
    refreshWrongCount();
  }

  refreshWrongCount();
  restart();

  // 侧边栏折叠
  var LS_SIDE = 'wubi_practice_sidebar';
  function applySide(open) {
    document.getElementById('sidebar').classList.toggle('hidden', !open);
    document.getElementById('openSide').classList.toggle('hidden', open);
    try { localStorage.setItem(LS_SIDE, open ? '1' : '0'); } catch (e) {}
  }
  document.getElementById('collapseBtn').onclick = function () { applySide(false); };
  document.getElementById('openSide').onclick = function () { applySide(true); };
  var saved = null;
  try { saved = localStorage.getItem(LS_SIDE); } catch (e) {}
  applySide(saved !== '0');
})();
</script>
</body></html>
