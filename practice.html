<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>词组练习 · 五笔词组打字练习 · 五笔字根</title>
<meta name="description" content="五笔词组练习：显示词组与彩色字根，直接打词组，输入正确自动跳下一题，支持错题本与计时统计。">
<style>
 :root { --ink:#2a2320; --muted:#8a7b6c; --line:#e6dcc9; --bg:#fbf7ef; --accent:#a33c2f; --paper:#fffdf8; --ok:#2e7d32; --bad:#c0392b; }
 * { box-sizing: border-box; }
 body { margin:0; background:var(--bg); color:var(--ink); font-family:'KaiTi','楷体','STKaiti',serif; line-height:1.7; }
 header { border-bottom:1px solid var(--line); padding:12px 20px; display:flex; justify-content:space-between; align-items:center; font-size:15px; }
 header a { color:var(--muted); text-decoration:none; }
 .layout { display:flex; align-items:flex-start; width:100%; margin:0; }
 aside { width:252px; flex:0 0 252px; position:sticky; top:0; align-self:flex-start; padding:20px 16px 24px 20px; border-right:1px solid var(--line); min-height:calc(100vh - 52px); }
 aside.hidden { display:none; }
 .side-head { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:14px; margin-bottom:12px; }
 .side-head button { border:1px solid var(--line); background:#fff; border-radius:7px; width:26px; height:26px; cursor:pointer; color:var(--muted); font-size:15px; line-height:1; }
 .side-body h1 { font-size:20px; margin:0 0 2px; }
 .side-body .sub { font-size:13px; margin-bottom:8px; }
 .side-body .bar { display:flex; flex-direction:column; align-items:flex-start; gap:6px; margin:12px 0; }
 .side-body .lab { width:auto; font-size:13px; margin-bottom:2px; color:var(--muted); }
 .side-body .chips { display:flex; flex-wrap:wrap; gap:6px; }
 .chip { border:1px solid var(--line); border-radius:999px; padding:4px 10px; background:#fff; cursor:pointer; font-family:inherit; font-size:13px; color:var(--ink); }
 .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
 .side-body hr { border:0; border-top:1px dashed var(--line); margin:14px 0; width:100%; }
 #openSide { position:fixed; left:10px; top:64px; z-index:40; border:1px solid var(--line); background:#fffdf8; border-radius:8px; padding:6px 10px; cursor:pointer; font-family:inherit; font-size:14px; color:var(--accent); }
 main { flex:1; min-width:0; max-width:820px; margin:20px auto; background:var(--paper); box-shadow:0 0 0 1px var(--line); border-radius:16px; padding:22px 24px 34px; }
 .statbar { display:flex; gap:18px; color:var(--muted); font-size:14px; padding:4px 0 10px; border-bottom:1px dashed var(--line); }
 .statbar b { color:var(--ink); font-weight:normal; }
 .side-end { padding:6px 0; }
 .side-end #endBtn { width:100%; }
 .jumpbar { padding:4px 0 8px; }
 #jumpInput { font-family:inherit; font-size:14px; padding:7px 10px; width:100%; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); outline:none; }
 #jumpInput:focus { border-color:var(--accent); }
 #jumpInput::placeholder { color:#b9b2a7; }
 .wordbox { display:flex; justify-content:center; gap:var(--zgap,18px); margin:18px 0 6px; flex-wrap:nowrap; align-items:flex-start; }
 .zicell { display:inline-flex; flex-direction:column; align-items:center; gap:4px; flex:0 0 auto; }
 .zirow { display:flex; gap:3px; align-items:flex-start; flex:0 0 auto; }
 .zicap { font-size:13px; line-height:1.2; white-space:nowrap; color:var(--muted); }
 .zicap .r { font-size:15px; }
 .zicap .l { font-family:ui-monospace,Consolas,monospace; font-size:12px; }
 .zicap .none { color:#b3a99a; font-size:15px; }
 .rule { text-align:center; font-size:13px; color:var(--muted); margin:2px 0 0; }
 .kbwrap { margin:10px 0 2px; }
 .kbbox { overflow-x:auto; padding-bottom:4px; }
 .kb { display:flex; flex-direction:column; gap:4px; min-width:790px; }
 .kb-title { text-align:center; font-size:12px; color:var(--muted); margin-bottom:2px; }
 .kb-row { display:flex; justify-content:center; gap:4px; }
 .kb-row.r2 { padding-left:40px; }
 .kb-row.r3 { padding-left:120px; }
 .kb-key { flex:0 0 auto; width:74px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:3px 2px 4px; cursor:pointer; font-family:inherit; color:var(--ink); text-align:center; }
 .kb-key.on { border-color:var(--accent); box-shadow:0 0 0 2px rgba(163,60,47,.13); }
 .kb-pill { display:flex; align-items:center; justify-content:center; gap:1px; border:1px solid var(--line); border-radius:999px; background:#fdfbf6; padding:1px 2px; }
 .kb-pill .kj { font-size:10px; color:var(--muted); }
 .kb-pill .kl { font-size:13px; color:var(--accent); font-family:ui-monospace,Consolas,monospace; }
 .kb-pill .kn { font-size:10px; color:var(--muted); }
 .rg { width:11px; height:11px; vertical-align:-2px; display:inline-block; }
 .kb-roots { display:block; margin-top:2px; font-size:9px; line-height:1.2; color:#9b9184; word-break:break-all; }
 .kbhint { text-align:center; font-size:11px; color:var(--muted); margin-top:2px; }
 .charcell { text-align:center; }
 .zislot { display:inline-block; border:1px solid var(--line); border-radius:10px; background:#fff; padding:6px; width:var(--zi,150px); height:var(--zi,150px); flex:0 0 auto; }
 .zi-svg { width:100%; height:100%; display:block; }
 .charcell .roots { margin-top:4px; font-size:20px; line-height:1.5; }
 .charcell .roots div { white-space:nowrap; }
 .codline { text-align:center; font-family:ui-monospace,Consolas,monospace; font-size:24px; letter-spacing:8px; min-height:30px; color:var(--muted); }
 .inputwrap { display:flex; justify-content:center; margin:18px 0 6px; }
 #typeInput { font-family:'KaiTi','楷体',serif; font-size:28px; text-align:center; padding:8px 14px; width:min(100%, 420px); border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); outline:none; }
 #typeInput:focus { border-color:var(--accent); }
 #typeInput.ok { border-color:var(--ok); color:var(--ok); }
 #typeInput.bad { border-color:var(--bad); color:var(--bad); }
 .msg { text-align:center; font-size:17px; min-height:26px; }
 .msg.ok { color:var(--ok); }
 .msg.bad { color:var(--bad); }
 .actions { display:flex; justify-content:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
 .actions button { font-family:inherit; font-size:15px; padding:7px 16px; border-radius:9px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink); }
 .actions button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
 .result { text-align:center; }
 .big { font-size:44px; color:var(--accent); }
 table { width:100%; border-collapse:collapse; margin-top:10px; font-size:15px; }
 td, th { border-bottom:1px solid var(--line); padding:7px 6px; text-align:left; }
 th { color:var(--muted); font-weight:normal; }
 .empty { color:var(--muted); text-align:center; padding:16px; }
 .hidden { display:none !important; }
 footer { text-align:center; color:var(--muted); font-size:13px; padding:16px; }
 @media (max-width:860px) {
   aside { position:fixed; left:0; top:0; bottom:0; z-index:60; background:var(--paper); box-shadow:6px 0 24px rgba(0,0,0,.12); overflow:auto; }
   main { margin:12px; padding:16px; }
   .zi-svg { width:100%; height:100%; }
   .wordbox { --zi:110px; --zgap:10px; }
 }
</style>
</head><body>
<header><a href="./">五笔字根 · 笔画着色</a><span><a href="char/">全部单字</a>　<a href="ci/">全部词组</a>　<a href="./">回首页</a></span></header>

<div class="layout">
<aside id="sidebar">
  <div class="side-head"><span>练习设置</span><button id="collapseBtn" title="收起">×</button></div>
  <div class="side-body">
    <div class="jumpbar">
      <input id="jumpInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="搜词组，回车跳题">
    </div>

    <h1>词组练习</h1>
    <div class="sub">照着彩色字形直接打字，输入正确自动跳下一题</div>

    <div class="bar"><span class="lab">字数</span><div class="chips">
      <button class="chip on" data-len="2">双字词</button>
      <button class="chip" data-len="3">三字词</button>
      <button class="chip" data-len="4">四字词</button>
      <button class="chip" data-len="5">五字词</button>
      <button class="chip" data-len="6">六字以上</button>
    </div></div>

    <div class="bar"><span class="lab">版本</span><div class="chips">
      <button class="chip on" data-ver="6">新世纪</button>
      <button class="chip" data-ver="8">86 版</button>
      <button class="chip" data-ver="9">98 版</button>
    </div></div>

    <div class="bar"><span class="lab">题量</span><div class="chips">
      <button class="chip on" data-count="10">10 题</button>
      <button class="chip" data-count="20">20 题</button>
      <button class="chip" data-count="50">50 题</button>
      <button class="chip" data-count="0">不限</button>
    </div></div>

    <div class="bar"><span class="lab">提示</span><div class="chips">
      <button class="chip on" data-hint="2">显示编码</button>
      <button class="chip" data-hint="0">不看提示</button>
    </div></div>

    <div class="bar"><div class="chips"><button class="chip on" id="statToggle">计时统计：开</button></div></div>

    <hr>
    <div class="bar"><span class="lab">错题本</span><div class="chips">
      <span id="wrongCount" style="font-size:13px;color:var(--muted)">0</span>
      <button class="chip" id="practiceWrong">练错题</button>
      <button class="chip" id="clearWrong">清空</button>
    </div></div>
    <hr>
    <div class="side-end"><button id="endBtn">结束本轮</button></div>
  </div>
</aside>
<button id="openSide" class="hidden" title="展开设置">设置</button>

<main>
  <div id="play">
    <div class="statbar">
      <span>第 <b id="qIndex">1</b> / <b id="qTotal">10</b> 题</span>
      <span>正确 <b id="qRight">0</b></span>
      <span>连击 <b id="qStreak">0</b></span>
      <span>用时 <b id="qTime">0s</b></span>
    </div>

    <div class="wordbox" id="wordbox"></div>
    <div class="codline" id="codline"></div>
    <div class="rule" id="ruleline"></div>

    <div class="inputwrap"><input id="typeInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在这里打出词组"></div>
    <div class="msg" id="msg">输入上面的词组</div>
    <div class="kbwrap"><div class="kbbox"><div class="kb" id="kb"></div></div><div class="kbhint">左右滑动看全键盘 · 点键输入该码</div></div>

    
  </div>

  <div id="result" class="hidden">
    <div class="result">
      <div class="big" id="acc">0%</div>
      <div class="sub" id="summary">—</div>
    </div>
    <h2 style="font-size:17px;margin-top:14px">错词</h2>
    <div id="wrongList"></div>
    <div class="actions">
      <button class="primary" id="againBtn">再来一轮</button>
      <button id="retryWrongBtn">只练错题</button>
    </div>
  </div>
</main>
</div>
<footer>数据来源：Rime 五笔码表 · 五笔大一统方案</footer>

<script src="data/wubi_roots_all.js"></script>
<script src="data/root-glyphs.js"></script>
<script>
(function () {
  var PALETTE = ['#E74C3C', '#FF9800', '#27AE60', '#2980B9'];
  var state = { len: 2, ver: '6', hint: 2, count: 10, stats: true, pool: [], idx: 0, right: 0, streak: 0, best: 0, startAt: 0, wrong: [], locked: false, running: false };
  window.__pstate = state;
  var $ = function (id) { return document.getElementById(id); };
  var LS_WRONG = 'wubi_wrong_words_v1';

  function loadWrong() { try { return JSON.parse(localStorage.getItem(LS_WRONG) || '[]'); } catch (e) { return []; } }
  function saveWrong(list) { try { localStorage.setItem(LS_WRONG, JSON.stringify(list.slice(0, 500))); } catch (e) {} }
  function addWrong(w) { var list = loadWrong(); if (!list.some(function (x) { return x.w === w.w; })) { list.unshift({ w: w.w, len: w.len, t: Date.now() }); saveWrong(list); } }
  function refreshWrongCount() { $('wrongCount').textContent = loadWrong().length; }

  document.querySelectorAll('[data-len]').forEach(function (b) {
    b.onclick = function () { document.querySelectorAll('[data-len]').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); state.len = Number(b.dataset.len); restart(); };
  });
  document.querySelectorAll('[data-ver]').forEach(function (b) {
    b.onclick = function () { document.querySelectorAll('[data-ver]').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); state.ver = b.dataset.ver; buildKeyboard(); redraw(); };
  });
  document.querySelectorAll('[data-count]').forEach(function (b) {
    b.onclick = function () { document.querySelectorAll('[data-count]').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); state.count = Number(b.dataset.count); restart(); };
  });
  document.querySelectorAll('[data-hint]').forEach(function (b) {
    b.onclick = function () { document.querySelectorAll('[data-hint]').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); state.hint = Number(b.dataset.hint); redraw(); };
  });
  $('statToggle').onclick = function () {
    state.stats = !state.stats;
    this.textContent = '计时统计：' + (state.stats ? '开' : '关');
    this.classList.toggle('on', state.stats);
  };

  function codeOf(w) { return state.ver === '86' ? w.c86 : state.ver === '98' ? w.c98 : w.c6; }
  function rootsOf(w) { return (state.ver === '86' ? w.r86 : state.ver === '98' ? w.r98 : w.r6).split(' ').filter(Boolean); }

  // 按字分组：2 字 → 2+2；3 字 → 1+1+2；4 字 → 1+1+1+1；5+ → 前 3 字各 1，末字 1
  function groupCount(n) {
    if (n === 2) return [2, 2];
    if (n === 3) return [1, 1, 2];
    if (n === 4) return [1, 1, 1, 1];
    var out = [];
    for (var i = 0; i < n - 1; i++) out.push(1);
    out[n - 1] = 1;
    return out;
  }

  function loadData(len, cb) {
    var key = 'PRACTICE_' + len;
    if (window[key]) { cb(window[key]); return; }
    var s = document.createElement('script');
    s.src = 'data/practice-' + len + '.js';
    s.onload = function () { cb(window[key] || []); };
    s.onerror = function () { cb([]); };
    document.head.appendChild(s);
  }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function rowToWord(r, len) { return { w: r[0], c6: r[1], c86: r[2], c98: r[3], r6: r[4], r86: r[5], r98: r[6], keys: r[7] || '', cheng: r[8] || '', len: len }; }

  // 搜索词组：回车直接跳到这一题（找不到就提示），方便核对某个词的着色
  function jumpToWord(raw) {
    var t = (raw || '').replace(/\s+/g, '');
    var msg = $('msg');
    if (!t) return;
    var n = Array.from(t).length;
    if (n < 2) { msg.textContent = '至少输入两个字的词组'; msg.className = 'msg bad'; return; }
    if (n > 6) { loadLongWord(t, n); return; }
    loadData(n, function (rows) {
      var row = null;
      for (var i = 0; i < rows.length; i++) { if (rows[i][0] === t) { row = rows[i]; break; } }
      if (!row) { loadLongWord(t, n); return; }
      document.querySelectorAll('[data-len]').forEach(function (x) { x.classList.toggle('on', Number(x.dataset.len) === n); });
      state.len = n;
      var at = -1;
      for (var j = 0; j < state.pool.length; j++) { if (state.pool[j].w === t) { at = j; break; } }
      if (at < 0) {
        var rec = rowToWord(row, n);
        if (!state.running || !state.pool.length) { state.pool = [rec]; at = 0; }
        else { state.pool.splice(state.idx, 0, rec); at = state.idx; }
      }
      state.idx = at;
      state.locked = false;
      state.running = true;
      $('result').classList.add('hidden');
      $('play').classList.remove('hidden');
      $('qTotal').textContent = state.pool.length;
      $('qIndex').textContent = state.idx + 1;
      msg.textContent = '已跳到「' + t + '」';
      msg.className = 'msg';
      redraw();
      var ti = $('typeInput');
      ti.value = ''; ti.className = ''; ti.disabled = false;
      $('jumpInput').blur();
    });
  }
  // 7 字以上：题库没有，改从 data/word-<首字哈希>.js 取记录
  function loadLongWord(t, n) {
    var msg = $('msg');
    var wb = t.charCodeAt(0) % 64;
    var key = 'WORD_DATA_' + wb;
    var go = function () {
      var rec = (window[key] || {})[t];
      if (!rec) { msg.textContent = '词库里没有「' + t + '」'; msg.className = 'msg bad'; return; }
      var item = {
        w: rec.w, c6: rec.c06 || rec.c6 || '', c86: rec.c86 || '', c98: rec.c98 || '',
        r6: (rec.r06 || []).join(' '), r86: (rec.r86 || []).join(' '), r98: (rec.r98 || []).join(' '),
        keys: '', len: n
      };
      state.len = n;
      document.querySelectorAll('[data-len]').forEach(function (x) { x.classList.remove('on'); });
      var at = -1;
      for (var j = 0; j < state.pool.length; j++) { if (state.pool[j].w === t) { at = j; break; } }
      if (at < 0) { state.pool.splice(state.idx, 0, item); at = state.idx; }
      state.idx = at; state.locked = false; state.running = true;
      $('result').classList.add('hidden');
      $('play').classList.remove('hidden');
      $('qTotal').textContent = state.pool.length;
      $('qIndex').textContent = state.idx + 1;
      msg.textContent = '已跳到「' + t + '」';
      msg.className = 'msg';
      redraw();
      var ti = $('typeInput'); ti.value = ''; ti.className = ''; ti.disabled = false;
      $('jumpInput').blur();
    };
    if (window[key]) { go(); return; }
    var sc = document.createElement('script');
    sc.src = 'data/word-' + wb + '.js';
    sc.onload = go;
    sc.onerror = function () { msg.textContent = '词库加载失败'; msg.className = 'msg bad'; };
    document.head.appendChild(sc);
  }

  var jumpInput = $('jumpInput');
  if (jumpInput) {
    jumpInput.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
      e.preventDefault();
      jumpToWord(this.value);
    });
  }


  function restart() {
    loadData(state.len, function (rows) {
      if (!rows.length) { $('wordbox').innerHTML = '<div>（该分类暂无数据）</div>'; return; }
      var pool = shuffle(rows.map(function (r) { return rowToWord(r, state.len); }));
      if (state.count > 0) pool = pool.slice(0, state.count);
      state.pool = pool; state.idx = 0; state.right = 0; state.streak = 0; state.best = 0;
      state.wrong = []; state.startAt = Date.now(); state.running = true;
      $('result').classList.add('hidden');
      $('play').classList.remove('hidden');
      $('qTotal').textContent = pool.length;
      nextQuestion();
    });
  }

  function startWrong() {
    var list = loadWrong();
    if (!list.length) { alert('错题本还是空的'); return; }
    var byLen = {};
    list.forEach(function (x) { (byLen[x.len] = byLen[x.len] || []).push(x.w); });
    var lens = Object.keys(byLen), pending = lens.length, out = [];
    lens.forEach(function (L) {
      loadData(L, function (rows) {
        var wanted = {}; byLen[L].forEach(function (w) { wanted[w] = 1; });
        rows.forEach(function (r) { if (wanted[r[0]]) out.push(rowToWord(r, Number(L))); });
        pending -= 1;
        if (pending === 0) {
          if (!out.length) { alert('错题无法匹配到题库'); return; }
          state.pool = shuffle(out); state.idx = 0; state.right = 0; state.streak = 0; state.best = 0;
          state.wrong = []; state.startAt = Date.now(); state.running = true;
          $('result').classList.add('hidden'); $('play').classList.remove('hidden');
          $('qTotal').textContent = state.pool.length;
          nextQuestion();
        }
      });
    });
  }

  var VER_FILE = { '86': '86', '98': '98', '6': '06' };
  var GRAY = '#cfc8bd';

  function recolorSvg(svg, start, k) {
    var MAP = { '#E74C3C': 0, '#FF9800': 1, '#27AE60': 2, '#2980B9': 3, '#3498DB': 3 };
    return svg.replace(/fill="(#[0-9A-Fa-f]{3,6})"/g, function (m, f) {
      var u = f.toUpperCase();
      if (u === '#FFF' || u === '#FFFFFF') return m;
      if (u === '#555555' || u === '#555' || u === '#CFC8BD' || u === '#999999') return 'fill="' + GRAY + '"';
      var i = MAP[u];
      if (i !== undefined && i < k) return 'fill="' + PALETTE[(start + i) % 4] + '"';
      return 'fill="' + GRAY + '"';
    });
  }

  function colorWholeSvg(svg, color) {
    return svg.replace(/fill="(#[0-9A-Fa-f]{3,6})"/g, function (m, f) {
      var u = f.toUpperCase();
      if (u === '#FFF' || u === '#FFFFFF') return m;
      return 'fill="' + color + '"';
    });
  }

  function dashOnSecondRoot(svg, color) {
    return svg.replace(/<path([^>]*?)fill="(#[0-9A-Fa-f]{3,6})"([^>]*?)\/>/g, function (m, pre, fill, post) {
      var f = fill.toUpperCase();
      if (f !== '#FF9800') return '';
      var d = (pre + post).match(/d="([^"]*)"/);
      if (!d) return '';
      return '<path d="' + d[1] + '" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>' +
             '<path d="' + d[1] + '" fill="none" stroke="' + color + '" stroke-width="12" stroke-dasharray="26 16" stroke-linejoin="round" stroke-linecap="round"/>';
    });
  }

  function dashOnlySvg(svg, color) {
    return svg.replace(/<path([^>]*?)fill="(#[0-9A-Fa-f]{3,6})"([^>]*?)\/>/g, function (m, pre, fill, post) {
      var f = fill.toUpperCase();
      if (f === '#FFF' || f === '#FFFFFF') return '';
      var d = (pre + post).match(/d="([^"]*)"/);
      if (!d) return '';
      return '<path d="' + d[1] + '" fill="none" stroke="' + color + '" stroke-width="12" stroke-dasharray="26 16" stroke-linejoin="round" stroke-linecap="round"/>';
    });
  }

  function ruleText(n) {
    if (n === 2) return '双字词：每字取前两码（2+2）';
    if (n === 3) return '三字词：前两字各取首码，末字取前两码（1+1+2）';
    if (n === 4) return '四字词：每字各取首码（1+1+1+1）';
    return '五字及以上：前三字各取首码，末字取首码，中间字不参与编码';
  }

  // 字根键盘：数据取自 data/wubi_roots_all.js，随版本切换
  var JIANMA = { G: '一', F: '地', D: '在', S: '要', A: '工', H: '上', J: '是', K: '中', L: '国', M: '同', T: '和', R: '的', E: '有', W: '人', Q: '我', Y: '主', U: '产', I: '不', O: '为', P: '这', N: '民', B: '了', V: '发', C: '以', X: '经' };
  var KB_LAYOUT = [['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'], ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'], ['Z', 'X', 'C', 'V', 'B', 'N', 'M']];
  function kbData() {
    if (typeof WUBI_ROOT_TABLE_06 === 'undefined') return [{}, {}];
    if (state.ver === '86') return [WUBI_ROOT_TABLE_86, KEY_NAMES];
    if (state.ver === '98') return [WUBI_ROOT_TABLE_98, KEY_NAMES_98];
    return [WUBI_ROOT_TABLE_06, KEY_NAMES_06];
  }
  function rootHtml(tok) {
    var g = (window.ROOT_GLYPHS || {})[tok];
    if (!g || !g.paths) return tok;
    var ps = g.paths.map(function (d) { return '<path d="' + d + '" fill="currentColor"/>'; }).join('');
    var sc = g.scale || 1, cx = g.cx || 512, cy = g.cy || 512;
    return '<svg class="rg" viewBox="0 0 1024 1024" aria-hidden="true"><g transform="translate(' + cx + ',' + cy + ') scale(' + sc + ') translate(' + (-cx) + ',' + (-cy) + ')">' + ps + '</g></svg>';
  }
  function rootsHtml(str) {
    var out = '', i = 0, t = str || '';
    while (i < t.length) {
      if (t[i] === '[') {
        var j = t.indexOf(']', i);
        var name = t.slice(i + 1, j < 0 ? t.length : j);
        out += rootHtml(name);
        i = j < 0 ? t.length : j + 1;
      } else if (t[i] === ']') { i += 1; }
      else {
        var ch = t[i];
        out += (ch.charCodeAt(0) >= 0xE000 && ch.charCodeAt(0) <= 0xF8FF) || ROOT_GLYPHS_SAFE(ch) ? rootHtml(ch) : ch;
        i += 1;
      }
    }
    return out;
  }
  function ROOT_GLYPHS_SAFE(ch) { return !!(window.ROOT_GLYPHS && window.ROOT_GLYPHS[ch]); }

  function buildKeyboard() {
    var kb = $('kb');
    if (!kb) return;
    var d = kbData(), table = d[0] || {}, names = d[1] || {};
    var verName = state.ver === '86' ? '86 版' : state.ver === '98' ? '98 版' : '新世纪';
    var html = '<div class="kb-title">' + verName + '五笔键盘</div>';
    KB_LAYOUT.forEach(function (row, ri) {
      html += '<div class="kb-row' + (ri === 1 ? ' r2' : ri === 2 ? ' r3' : '') + '">';
      row.forEach(function (L) {
        var roots = rootsHtml(table[L] || '');
        html += '<button class="kb-key" data-k="' + L + '">' +
          '<span class="kb-pill"><span class="kj">' + (JIANMA[L] || '') + '</span><span class="kl">' + L + '</span><span class="kn">' + (names[L] || (L === 'Z' ? '万能' : '')) + '</span></span>' +
          '<span class="kb-roots">' + roots + '</span></button>';
      });
      html += '</div>';
    });
    kb.innerHTML = html;
  }
  buildKeyboard();
  $('kb').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.kb-key') : null;
    if (!b || state.locked) return;
    $('typeInput').value += b.dataset.k.toLowerCase();
    judge();
  });

  // 词组始终单行：按字数把每个字格缩到一行放得下，不折行
  function fitWordbox() {
    var box = $('wordbox');
    var slots = box.querySelectorAll('.zislot').length || 1;
    var avail = box.clientWidth || (window.innerWidth - 48);
    var gap = slots <= 3 ? 14 : (slots <= 5 ? 8 : 6);
    var size = Math.floor((avail - gap * (slots - 1)) / slots);
    size = Math.max(34, Math.min(200, size));
    box.style.setProperty('--zi', size + 'px');
    box.style.setProperty('--zgap', gap + 'px');
    box.style.flexWrap = 'nowrap';
  }
  var fitTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(function () {
      if (document.querySelectorAll('#wordbox .zislot').length) fitWordbox();
    }, 120);
  });

  function redraw() {
    if (!state.pool.length) return;
    var w = state.pool[state.idx];
    if (!w) return;
    var chars = [...w.w];
    var ver = VER_FILE[state.ver] || '06';

    var n = chars.length;
    // 码位分配：2字 2+2；3字 1+1+2；4字 1+1+1+1；5字以上 前三字各 1 + 末字 1，中间字 0（只涂灰）
    var cnt = [];
    for (var a = 0; a < n; a++) {
      if (n === 2) cnt.push(2);
      else if (n === 3) cnt.push(a === 2 ? 2 : 1);
      else if (n === 4) cnt.push(1);
      else cnt.push((a < 3 || a === n - 1) ? 1 : 0);
    }
    var starts = [], acc = 0;
    for (var b = 0; b < n; b++) { starts.push(acc); acc += cnt[b]; }
    if (n >= 5) starts[n - 1] = 3;   // 末字固定第 4 码（蓝）
    var keysStr = w.keys || '';
    var chengStr = w.cheng || '';
    var roots = rootsOf(w);
    var codeStr = codeOf(w).toUpperCase();
    var html = '', ri = 0;
    for (var i = 0; i < n; i++) {
      var k = cnt[i], startPos = starts[i];
      var rA = roots[ri], rB = roots[ri + 1];
      var isKeyName = k >= 2 && (keysStr.charAt(i) === '1' || (!!rA && rA === rB));
      var cell = '<span class="zislot" data-c="' + chars[i] + '" data-v="' + ver + '" data-start="' + startPos + '" data-k="' + k + '" data-key="' + (isKeyName ? '1' : '0') + '" data-cheng="' + (chengStr.charAt(i) === '1' ? '1' : '0') + '"></span>';
      if (isKeyName) {
        cell += '<span class="zislot" data-c="' + chars[i] + '" data-v="' + ver + '" data-start="' + (startPos + 1) + '" data-k="0" data-key="dash"></span>';
      }
      cell = '<span class="zirow">' + cell + '</span>';
      var cap = '';
      if (k === 0) {
        cap = '<span class="none">—</span>';
      } else {
        for (var t = 0; t < k; t++) {
          var li = startPos + t;
          var col = PALETTE[li % 4];
          cap += (t ? ' ' : '') +
            '<span class="r" style="color:' + col + '">' + (roots[ri] || '') + '</span>' +
            '<span class="l" style="color:' + col + '">' + (codeStr.charAt(li) || '') + '</span>';
          ri += 1;
        }
      }
      html += '<span class="zicell">' + cell + '<span class="zicap">' + cap + '</span></span>';
    }
    $('wordbox').innerHTML = html;
    $('ruleline').textContent = ruleText(n);
    fitWordbox();
    document.querySelectorAll('.zislot').forEach(function (slot) {
      fetch('svg/' + encodeURIComponent(slot.dataset.c) + '-' + slot.dataset.v + '.svg')
        .then(function (r) { return r.ok ? r.text() : ''; })
        .then(function (svg) {
          if (!svg) return;
          var inner = svg.replace(/<path[^>]*stroke="#c0392b"[^>]*\/>/g, '').replace(/<rect[^>]*>/g, '').replace(/<svg[^>]*>/, '').replace(/<\/svg>/, '');
          var k = Number(slot.dataset.k);
          var st = Number(slot.dataset.start);
          var out;
                    if (slot.dataset.key === 'dash') {
            out = dashOnlySvg(inner, PALETTE[st % 4]);
          } else if (slot.dataset.key === '1') {
            out = colorWholeSvg(inner, PALETTE[st % 4]);
          } else if (slot.dataset.cheng === '1' && k >= 2) {
            out = colorWholeSvg(inner, PALETTE[st % 4]) + dashOnSecondRoot(inner, PALETTE[(st + 1) % 4]);
          } else {
            out = recolorSvg(inner, st, k);
          }
          slot.innerHTML = '<svg class="zi-svg" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">' + out + '</svg>';
        })
        .catch(function () {});
    });

    var usedKeys = codeStr.split('');
    document.querySelectorAll('.kb-key').forEach(function (b) {
      b.classList.toggle('on', usedKeys.indexOf(b.dataset.k) >= 0);
    });

    if (state.hint === 2) {
      $('codline').innerHTML = codeOf(w).split('').map(function (L, i) {
        return '<span style="color:' + PALETTE[i % 4] + '">' + L.toUpperCase() + '</span>';
      }).join('');
    } else {
      $('codline').innerHTML = '';
    }
  }

  function nextQuestion() {
    if (state.idx >= state.pool.length) return finish();
    state.locked = false;
    var inp = $('typeInput');
    inp.value = ''; inp.className = ''; inp.disabled = false;
    $('qIndex').textContent = state.idx + 1;
    $('qRight').textContent = state.right;
    $('qStreak').textContent = state.streak;
    $('msg').textContent = '输入上面的词组';
    $('msg').className = 'msg';
    redraw();
    setTimeout(function () { inp.focus(); }, 30);
  }

  function judge() {
    var w = state.pool[state.idx];
    var inp = $('typeInput');
    var typed = inp.value.replace(/\s+/g, '');
    if (!typed) return;
    var code = codeOf(w).toUpperCase();
    var ascii = /^[A-Za-z]+$/.test(typed);
    var hit = (typed === w.w) || (ascii && typed.toUpperCase() === code);
    if (hit) {
      state.locked = true;
      state.right += 1; state.streak += 1; state.best = Math.max(state.best, state.streak);
      inp.className = 'ok'; inp.disabled = true;
      $('msg').textContent = '✓ 正确';
      $('msg').className = 'msg ok';
      $('qRight').textContent = state.right;
      $('qStreak').textContent = state.streak;
      setTimeout(function () { state.idx += 1; nextQuestion(); }, 450);
      return;
    }
    // 只有长度达到词组长度仍然不对，才判错（打字母时到 4 码才判）
    var wrongNow = ascii ? (typed.length >= 4) : (typed.length >= w.w.length);
    if (wrongNow) {
      state.locked = true;
      inp.className = 'bad';
      state.streak = 0;
      $('qStreak').textContent = 0;
      $('msg').textContent = '✗ 打错了，正确是「' + w.w + '」（按空格继续）';
      $('msg').className = 'msg bad';
      state.wrong.push({ w: w.w, code: codeOf(w), typed: typed, len: w.len });
      addWrong(w); refreshWrongCount();
    }
  }

  var composing = false;
  var inp = $('typeInput');
  inp.addEventListener('compositionstart', function () { composing = true; });
  inp.addEventListener('compositionend', function () { composing = false; judge(); });
  inp.addEventListener('input', function () { if (!composing && !state.locked) judge(); });
  inp.addEventListener('keydown', function (e) {
    if (e.key === ' ') {
      if (state.locked) { e.preventDefault(); state.idx += 1; nextQuestion(); }
    }
  });

  setInterval(function () {
    if (state.stats && state.running) $('qTime').textContent = Math.round((Date.now() - state.startAt) / 1000) + 's';
  }, 500);

  $('endBtn').onclick = function () { finish(); };
  $('againBtn').onclick = function () { restart(); };
  $('retryWrongBtn').onclick = function () { startWrong(); };
  $('practiceWrong').onclick = startWrong;
  $('clearWrong').onclick = function () { if (confirm('清空错题本？')) { saveWrong([]); refreshWrongCount(); } };

  function finish() {
    state.running = false;
    $('play').classList.add('hidden');
    $('result').classList.remove('hidden');
    var done = Math.min(state.idx + (state.locked ? 1 : 0), state.pool.length) || 1;
    var total = Math.max(done, 1);
    $('acc').textContent = Math.round((state.right / total) * 100) + '%';
    $('summary').textContent = '共 ' + done + ' 题 · 正确 ' + state.right + ' 题 · 最高连击 ' + state.best +
      (state.stats ? ' · 用时 ' + Math.round((Date.now() - state.startAt) / 1000) + ' 秒' : '');
    $('wrongList').innerHTML = state.wrong.length
      ? '<table><tr><th>词组</th><th>编码</th><th>你的输入</th></tr>' + state.wrong.map(function (x) {
          return '<tr><td>' + x.w + '</td><td>' + x.code.toUpperCase() + '</td><td>' + (x.typed || '跳过') + '</td></tr>';
        }).join('') + '</table>'
      : '<div class="empty">全对，没有错词 👍</div>';
    refreshWrongCount();
  }

  // 侧栏折叠
  var LS_SIDE = 'wubi_practice_sidebar';
  function applySide(open) {
    $('sidebar').classList.toggle('hidden', !open);
    $('openSide').classList.toggle('hidden', open);
    try { localStorage.setItem(LS_SIDE, open ? '1' : '0'); } catch (e) {}
  }
  $('collapseBtn').onclick = function () { applySide(false); };
  $('openSide').onclick = function () { applySide(true); };
  var saved = null;
  try { saved = localStorage.getItem(LS_SIDE); } catch (e) {}
  // 手机上默认收起设置（先看到题目），桌面默认展开；用户手动选择过后按记忆来
  applySide(saved === null ? window.innerWidth > 860 : saved === '1');

  window.__redraw = redraw;
  window.__next = nextQuestion;
  refreshWrongCount();
  restart();
})();
</script>
</body></html>
