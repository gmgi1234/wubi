  <h2>怎么拆</h2>
  <div class="rule">
    <p>捍御 = 捍 + 御</p>
    <p>双字词：每个字取前两码：扌（R） + 日（J） + 彳（T） + 牛前（R） → <strong>RJTR</strong></p>
