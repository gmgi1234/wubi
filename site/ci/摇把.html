  <h2>怎么拆</h2>
  <div class="rule">
    <p>摇把 = 摇 + 把</p>
    <p>双字词：每个字取前两码：扌（R） + 爫（E） + 扌（R） + 巴（C） → <strong>RERC</strong></p>
  </div>
