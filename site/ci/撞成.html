  <h2>怎么拆</h2>
  <div class="rule">
    <p>撞成 = 撞 + 成</p>
    <p>双字词：每个字取前两码：扌（R） + 立（U） + 厂（D） + ㇆（N） → <strong>RUDN</strong></p>
