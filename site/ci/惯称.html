  <h2>怎么拆</h2>
  <div class="rule">
    <p>惯称 = 惯 + 称</p>
    <p>双字词：每个字取前两码：忄（N） + 毌框（X） + 禾（T） + ⺈（Q） → <strong>NXTQ</strong></p>
