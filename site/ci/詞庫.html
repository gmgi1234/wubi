  <h2>怎么拆</h2>
  <div class="rule">
    <p>詞庫 = 詞 + 庫</p>
    <p>双字词：每个字取前两码：言（Y） + 𠃌（N） + 广（Y） + 車（L） → <strong>YNYL</strong></p>
