  <h2>怎么拆</h2>
  <div class="rule">
    <p>援敌 = 援 + 敌</p>
    <p>双字词：每个字取前两码：扌（R） + 爫（E） + 丿（T） + 古（D） → <strong>RETD</strong></p>
