  <h2>怎么拆</h2>
  <div class="rule">
    <p>錐形 = 錐 + 形</p>
    <p>双字词：每个字取前两码：金（Q） + 亻（W） + 一（G） + 廾（A） → <strong>QWGA</strong></p>
