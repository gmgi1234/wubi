  <h2>怎么拆</h2>
  <div class="rule">
    <p>篷布 = 篷 + 布</p>
    <p>双字词：每个字取前两码：⺮（T） + 夂（T） + 𠂇（D） + 冂（M） → <strong>TTDM</strong></p>
