  <h2>怎么拆</h2>
  <div class="rule">
    <p>偷渡 = 偷 + 渡</p>
    <p>双字词：每个字取前两码：亻（W） + 人（W） + 氵（I） + 广（Y） → <strong>WWIY</strong></p>
