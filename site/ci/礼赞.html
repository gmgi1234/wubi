  <h2>怎么拆</h2>
  <div class="rule">
    <p>礼赞 = 礼 + 赞</p>
    <p>双字词：每个字取前两码：衣示旁（P） + 丶（Y） + 丿（T） + 土（F） → <strong>PYTF</strong></p>
