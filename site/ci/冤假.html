  <h2>怎么拆</h2>
  <div class="rule">
    <p>冤假 = 冤 + 假</p>
    <p>双字词：每个字取前两码：冖（P） + ⺈（Q） + 亻（W） + コ（N） → <strong>PQWN</strong></p>
