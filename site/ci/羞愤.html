  <h2>怎么拆</h2>
  <div class="rule">
    <p>羞愤 = 羞 + 愤</p>
    <p>双字词：每个字取前两码：丷（U） + 羊后（D） + 忄（N） + 十（F） → <strong>UDNF</strong></p>
