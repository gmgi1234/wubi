  <h2>怎么拆</h2>
  <div class="rule">
    <p>庄稼人 = 庄 + 稼 + 人</p>
    <p>三字词：前两字各取首码，最后一字取前两码：广（Y） + 禾（T） + 人（W） → <strong>YTWW</strong></p>
