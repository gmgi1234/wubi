  <h2>怎么拆</h2>
  <div class="rule">
    <p>钢缆 = 钢 + 缆</p>
    <p>双字词：每个字取前两码：钅（Q） + 冂（M） + 纟（X） + 〢（J） → <strong>QMXJ</strong></p>
