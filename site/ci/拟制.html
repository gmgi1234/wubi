  <h2>怎么拆</h2>
  <div class="rule">
    <p>拟制 = 拟 + 制</p>
    <p>双字词：每个字取前两码：扌（R） + 𠄌（N） + 牛前（R） + 冂（M） → <strong>RNRM</strong></p>
