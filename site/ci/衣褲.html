  <h2>怎么拆</h2>
  <div class="rule">
    <p>衣褲 = 衣 + 褲</p>
    <p>双字词：每个字取前两码：亠（Y） + 𧘇（E） + 衣示旁（P） + 冫（U） → <strong>YEPU</strong></p>
