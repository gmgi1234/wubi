  <h2>怎么拆</h2>
  <div class="rule">
    <p>裙带 = 裙 + 带</p>
    <p>双字词：每个字取前两码：衣示旁（P） + 冫（U） + 一（G） + 川（K） → <strong>PUGK</strong></p>
