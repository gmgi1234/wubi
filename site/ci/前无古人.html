  <h2>怎么拆</h2>
  <div class="rule">
    <p>前无古人 = 前 + 无 + 古 + 人</p>
    <p>四字词：每个字取首码：䒑（U） + 二（F） + 古（D） + 人（W） → <strong>UFDW</strong></p>
