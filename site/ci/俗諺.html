  <h2>怎么拆</h2>
  <div class="rule">
    <p>俗諺 = 俗 + 諺</p>
    <p>双字词：每个字取前两码：亻（W） + 八（W） + 言（Y） + 立（U） → <strong>WWYU</strong></p>
