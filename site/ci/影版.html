  <h2>怎么拆</h2>
  <div class="rule">
    <p>影版 = 影 + 版</p>
    <p>双字词：每个字取前两码：日（J） + 京头（Y） + 丿（T） + 丨（H） → <strong>JYTH</strong></p>
