  <h2>怎么拆</h2>
  <div class="rule">
    <p>姓字 = 姓 + 字</p>
    <p>双字词：每个字取前两码：女（V） + 丿（T） + 宀（P） + 子（B） → <strong>VTPB</strong></p>
