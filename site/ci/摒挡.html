  <h2>怎么拆</h2>
  <div class="rule">
    <p>摒挡 = 摒 + 挡</p>
    <p>双字词：每个字取前两码：扌（R） + 尸（N） + 扌（R） + ⺌（I） → <strong>RNRI</strong></p>
