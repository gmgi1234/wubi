  <h2>怎么拆</h2>
  <div class="rule">
    <p>蚁力神 = 蚁 + 力 + 神</p>
    <p>三字词：前两字各取首码，最后一字取前两码：虫（J） + 力（L） + 衣示旁（P） + 丶（Y） → <strong>JLPY</strong></p>
