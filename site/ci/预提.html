  <h2>怎么拆</h2>
  <div class="rule">
    <p>预提 = 预 + 提</p>
    <p>双字词：每个字取前两码：龴（C） + 𠄐（B） + 扌（R） + 曰（J） → <strong>CBRJ</strong></p>
