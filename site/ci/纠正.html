  <h2>怎么拆</h2>
  <div class="rule">
    <p>纠正 = 纠 + 正</p>
    <p>双字词：每个字取前两码：纟（X） + 𠄌（N） + 一（G） + 止（H） → <strong>XNGH</strong></p>
  </div>
