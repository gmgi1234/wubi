  <h2>怎么拆</h2>
  <div class="rule">
    <p>对立统一 = 对 + 立 + 统 + 一</p>
    <p>四字词：每个字取首码：又（C） + 立（U） + 纟（X） + 一（G） → <strong>CUXG</strong></p>
