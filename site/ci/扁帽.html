  <h2>怎么拆</h2>
  <div class="rule">
    <p>扁帽 = 扁 + 帽</p>
    <p>双字词：每个字取前两码：丶（Y） + 尸（N） + 冂（M） + 丨（H） → <strong>YNMH</strong></p>
