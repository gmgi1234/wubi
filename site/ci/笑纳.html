  <h2>怎么拆</h2>
  <div class="rule">
    <p>笑纳 = 笑 + 纳</p>
    <p>双字词：每个字取前两码：⺮（T） + 丿（T） + 纟（X） + 冂（M） → <strong>TTXM</strong></p>
