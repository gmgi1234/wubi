  <h2>怎么拆</h2>
  <div class="rule">
    <p>一字一顿 = 一 + 字 + 一 + 顿</p>
    <p>四字词：每个字取首码：一（G） + 宀（P） + 一（G） + 一（G） → <strong>GPGG</strong></p>
