  <h2>怎么拆</h2>
  <div class="rule">
    <p>視爲 = 視 + 爲</p>
    <p>双字词：每个字取前两码：衣示旁（P） + 丶（Y） + 爫（E） + 丿（T） → <strong>PYET</strong></p>
