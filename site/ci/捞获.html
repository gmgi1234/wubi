  <h2>怎么拆</h2>
  <div class="rule">
    <p>捞获 = 捞 + 获</p>
    <p>双字词：每个字取前两码：扌（R） + 艹（A） + 艹（A） + 犭前（Q） → <strong>RAAQ</strong></p>
