  <h2>怎么拆</h2>
  <div class="rule">
    <p>敬拜 = 敬 + 拜</p>
    <p>双字词：每个字取前两码：艹（A） + 勹（Q） + 龵（R） + 三（D） → <strong>AQRD</strong></p>
