  <h2>怎么拆</h2>
  <div class="rule">
    <p>千秋万代 = 千 + 秋 + 万 + 代</p>
    <p>四字词：每个字取首码：丿（T） + 禾（T） + 丆（D） + 亻（W） → <strong>TTDW</strong></p>
