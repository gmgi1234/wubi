  <h2>怎么拆</h2>
  <div class="rule">
    <p>正切 = 正 + 切</p>
    <p>双字词：每个字取前两码：一（G） + 止（H） + 七（A） + 刀（V） → <strong>GHAV</strong></p>
  </div>
