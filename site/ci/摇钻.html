  <h2>怎么拆</h2>
  <div class="rule">
    <p>摇钻 = 摇 + 钻</p>
    <p>双字词：每个字取前两码：扌（R） + 爫（E） + 钅（Q） + 卜（H） → <strong>REQH</strong></p>
