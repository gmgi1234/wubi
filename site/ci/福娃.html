  <h2>怎么拆</h2>
  <div class="rule">
    <p>福娃 = 福 + 娃</p>
    <p>双字词：每个字取前两码：衣示旁（P） + 丶（Y） + 女（V） + 土（F） → <strong>PYVF</strong></p>
