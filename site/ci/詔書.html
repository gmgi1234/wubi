  <h2>怎么拆</h2>
  <div class="rule">
    <p>詔書 = 詔 + 書</p>
    <p>双字词：每个字取前两码：言（Y） + 刀（V） + 彐（V） + 土（F） → <strong>YVVF</strong></p>
