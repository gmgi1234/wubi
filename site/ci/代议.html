  <h2>怎么拆</h2>
  <div class="rule">
    <p>代议 = 代 + 议</p>
    <p>双字词：每个字取前两码：亻（W） + 弋（A） + 讠（Y） + 丶（Y） → <strong>WAYY</strong></p>
  </div>
