  <h2>怎么拆</h2>
  <div class="rule">
    <p>锦纶 = 锦 + 纶</p>
    <p>双字词：每个字取前两码：钅（Q） + 白（R） + 纟（X） + 𠆢（W） → <strong>QRXW</strong></p>
