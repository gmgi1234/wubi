  <h2>怎么拆</h2>
  <div class="rule">
    <p>触底 = 触 + 底</p>
    <p>双字词：每个字取前两码：⺈（Q） + 用（E） + 广（Y） + 卬左（Q） → <strong>QEYQ</strong></p>
