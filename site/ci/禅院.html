  <h2>怎么拆</h2>
  <div class="rule">
    <p>禅院 = 禅 + 院</p>
    <p>双字词：每个字取前两码：衣示旁（P） + 丶（Y） + 阝（B） + 宀（P） → <strong>PYBP</strong></p>
