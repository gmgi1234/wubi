  <h2>怎么拆</h2>
  <div class="rule">
    <p>諢名 = 諢 + 名</p>
    <p>双字词：每个字取前两码：言（Y） + 冖（P） + 夕（Q） + 口（K） → <strong>YPQK</strong></p>
