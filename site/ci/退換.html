  <h2>怎么拆</h2>
  <div class="rule">
    <p>退換 = 退 + 換</p>
    <p>双字词：每个字取前两码：彐（V） + 長下（E） + 扌（R） + ⺈（Q） → <strong>VERQ</strong></p>
