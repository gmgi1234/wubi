  <h2>怎么拆</h2>
  <div class="rule">
    <p>被捕 = 被 + 捕</p>
    <p>双字词：每个字取前两码：衣示旁（P） + 冫（U） + 扌（R） + 一（G） → <strong>PURG</strong></p>
