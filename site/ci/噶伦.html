  <h2>怎么拆</h2>
  <div class="rule">
    <p>噶伦 = 噶 + 伦</p>
    <p>双字词：每个字取前两码：口（K） + 艹（A） + 亻（W） + 𠆢（W） → <strong>KAWW</strong></p>
