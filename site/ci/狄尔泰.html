  <h2>怎么拆</h2>
  <div class="rule">
    <p>狄尔泰 = 狄 + 尔 + 泰</p>
    <p>三字词：前两字各取首码，最后一字取前两码：犭前（Q） + ⺈（Q） + 三（D） + 人（W） → <strong>QQDW</strong></p>
