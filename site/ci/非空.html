  <h2>怎么拆</h2>
  <div class="rule">
    <p>非空 = 非 + 空</p>
    <p>双字词：每个字取前两码：三（D） + 〢（J） + 宀（P） + 八（W） → <strong>DJPW</strong></p>
  </div>
