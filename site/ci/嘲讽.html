  <h2>怎么拆</h2>
  <div class="rule">
    <p>嘲讽 = 嘲 + 讽</p>
    <p>双字词：每个字取前两码：口（K） + 十（F） + 讠（Y） + 𠘨（M） → <strong>KFYM</strong></p>
