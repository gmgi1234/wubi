  <h2>怎么拆</h2>
  <div class="rule">
    <p>杞人忧天 = 杞 + 人 + 忧 + 天</p>
    <p>四字词：每个字取首码：木（S） + 人（W） + 忄（N） + 一（G） → <strong>SWNG</strong></p>
