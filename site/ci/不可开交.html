  <h2>怎么拆</h2>
  <div class="rule">
    <p>不可开交 = 不 + 可 + 开 + 交</p>
    <p>四字词：每个字取首码：一（G） + 丁（S） + 一（G） + 六（U） → <strong>GSGU</strong></p>
