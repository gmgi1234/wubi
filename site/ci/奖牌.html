  <h2>怎么拆</h2>
  <div class="rule">
    <p>奖牌 = 奖 + 牌</p>
    <p>双字词：每个字取前两码：丬（U） + 夕（Q） + 丿（T） + 丨（H） → <strong>UQTH</strong></p>
