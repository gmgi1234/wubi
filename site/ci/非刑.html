  <h2>怎么拆</h2>
  <div class="rule">
    <p>非刑 = 非 + 刑</p>
    <p>双字词：每个字取前两码：三（D） + 〢（J） + 一（G） + 廾（A） → <strong>DJGA</strong></p>
