  <h2>怎么拆</h2>
  <div class="rule">
    <p>跳帧 = 跳 + 帧</p>
    <p>双字词：每个字取前两码：口（K） + 止（H） + 冂（M） + 丨（H） → <strong>KHMH</strong></p>
