  <h2>怎么拆</h2>
  <div class="rule">
    <p>抢墒 = 抢 + 墒</p>
    <p>双字词：每个字取前两码：扌（R） + 𠆢（W） + 土（F） + 立头（U） → <strong>RWFU</strong></p>
