  <h2>怎么拆</h2>
  <div class="rule">
    <p>賦役 = 賦 + 役</p>
    <p>双字词：每个字取前两码：貝（M） + 一（G） + 彳（T） + 𠘧（M） → <strong>MGTM</strong></p>
