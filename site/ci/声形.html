  <h2>怎么拆</h2>
  <div class="rule">
    <p>声形 = 声 + 形</p>
    <p>双字词：每个字取前两码：士（F） + 𠃜（N） + 一（G） + 廾（A） → <strong>FNGA</strong></p>
