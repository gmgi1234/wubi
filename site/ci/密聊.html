  <h2>怎么拆</h2>
  <div class="rule">
    <p>密聊 = 密 + 聊</p>
    <p>双字词：每个字取前两码：宀（P） + 心（N） + 耳（B） + 卬左（Q） → <strong>PNBQ</strong></p>
