  <h2>怎么拆</h2>
  <div class="rule">
    <p>反法 = 反 + 法</p>
    <p>双字词：每个字取前两码：𠂆（R） + 又（C） + 氵（I） + 土（F） → <strong>RCIF</strong></p>
