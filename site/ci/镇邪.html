  <h2>怎么拆</h2>
  <div class="rule">
    <p>镇邪 = 镇 + 邪</p>
    <p>双字词：每个字取前两码：钅（Q） + 十（F） + 匸（A） + 亅（H） → <strong>QFAH</strong></p>
