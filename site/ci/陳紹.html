  <h2>怎么拆</h2>
  <div class="rule">
    <p>陳紹 = 陳 + 紹</p>
    <p>双字词：每个字取前两码：阝（B） + 一（G） + 糹（X） + 刀（V） → <strong>BGXV</strong></p>
