  <h2>怎么拆</h2>
  <div class="rule">
    <p>多才多艺 = 多 + 才 + 多 + 艺</p>
    <p>四字词：每个字取首码：夕（Q） + 十（F） + 夕（Q） + 艹（A） → <strong>QFQA</strong></p>
