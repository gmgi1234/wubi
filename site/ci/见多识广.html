  <h2>怎么拆</h2>
  <div class="rule">
    <p>见多识广 = 见 + 多 + 识 + 广</p>
    <p>四字词：每个字取首码：冂（M） + 夕（Q） + 讠（Y） + 广（Y） → <strong>MQYY</strong></p>
