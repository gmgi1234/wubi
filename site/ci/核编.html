  <h2>怎么拆</h2>
  <div class="rule">
    <p>核编 = 核 + 编</p>
    <p>双字词：每个字取前两码：木（S） + 亠（Y） + 纟（X） + 丶（Y） → <strong>SYXY</strong></p>
