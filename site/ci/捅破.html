  <h2>怎么拆</h2>
  <div class="rule">
    <p>捅破 = 捅 + 破</p>
    <p>双字词：每个字取前两码：扌（R） + 龴（C） + 石（D） + 皮前（H） → <strong>RCDH</strong></p>
