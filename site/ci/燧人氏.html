  <h2>怎么拆</h2>
  <div class="rule">
    <p>燧人氏 = 燧 + 人 + 氏</p>
    <p>三字词：前两字各取首码，最后一字取前两码：火（O） + 人（W） + 卬左（Q） + 七（A） → <strong>OWQA</strong></p>
