  <h2>怎么拆</h2>
  <div class="rule">
    <p>逃稅 = 逃 + 稅</p>
    <p>双字词：每个字取前两码：氺侧（I） + 儿（Q） + 禾（T） + 八（W） → <strong>IQTW</strong></p>
