  <h2>怎么拆</h2>
  <div class="rule">
    <p>授衔 = 授 + 衔</p>
    <p>双字词：每个字取前两码：扌（R） + 爫（E） + 彳（T） + 钅（Q） → <strong>RETQ</strong></p>
