  <h2>怎么拆</h2>
  <div class="rule">
    <p>啓事 = 啓 + 事</p>
    <p>双字词：每个字取前两码：丶（Y） + 尸（N） + 一（G） + 口（K） → <strong>YNGK</strong></p>
