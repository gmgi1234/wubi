  <h2>怎么拆</h2>
  <div class="rule">
    <p>南锡 = 南 + 锡</p>
    <p>双字词：每个字取前两码：十（F） + 冂（M） + 钅（Q） + 日（J） → <strong>FMQJ</strong></p>
