  <h2>怎么拆</h2>
  <div class="rule">
    <p>拓补 = 拓 + 补</p>
    <p>双字词：每个字取前两码：扌（R） + 石（D） + 衣示旁（P） + 冫（U） → <strong>RDPU</strong></p>
  </div>
