  <h2>怎么拆</h2>
  <div class="rule">
    <p>补上 = 补 + 上</p>
    <p>双字词：每个字取前两码：衣示旁（P） + 冫（U） + 上（H） + 丨（H） → <strong>PUHH</strong></p>
  </div>
