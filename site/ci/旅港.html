  <h2>怎么拆</h2>
  <div class="rule">
    <p>旅港 = 旅 + 港</p>
    <p>双字词：每个字取前两码：方（Y） + 𠂉（T） + 氵（I） + 龷（A） → <strong>YTIA</strong></p>
