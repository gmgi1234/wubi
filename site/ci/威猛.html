  <h2>怎么拆</h2>
  <div class="rule">
    <p>威猛 = 威 + 猛</p>
    <p>双字词：每个字取前两码：厂（D） + 一（G） + 犭前（Q） + 丿（T） → <strong>DGQT</strong></p>
