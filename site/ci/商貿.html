  <h2>怎么拆</h2>
  <div class="rule">
    <p>商貿 = 商 + 貿</p>
    <p>双字词：每个字取前两码：立头（U） + 冂（M） + 卬左（Q） + 丶（Y） → <strong>UMQY</strong></p>
