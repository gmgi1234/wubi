  <h2>怎么拆</h2>
  <div class="rule">
    <p>费神 = 费 + 神</p>
    <p>双字词：每个字取前两码：弓（X） + 〢（J） + 衣示旁（P） + 丶（Y） → <strong>XJPY</strong></p>
