  <h2>怎么拆</h2>
  <div class="rule">
    <p>造詣 = 造 + 詣</p>
    <p>双字词：每个字取前两码：丿（T） + 土（F） + 言（Y） + 匕（X） → <strong>TFYX</strong></p>
