  <h2>怎么拆</h2>
  <div class="rule">
    <p>身不由己 = 身 + 不 + 由 + 己</p>
    <p>四字词：每个字取首码：丿（T） + 一（G） + 由（M） + 己（N） → <strong>TGMN</strong></p>
