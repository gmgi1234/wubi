  <h2>怎么拆</h2>
  <div class="rule">
    <p>辉映 = 辉 + 映</p>
    <p>双字词：每个字取前两码：光头（I） + 儿（Q） + 日（J） + 冂（M） → <strong>IQJM</strong></p>
