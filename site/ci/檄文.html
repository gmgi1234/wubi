  <h2>怎么拆</h2>
  <div class="rule">
    <p>檄文 = 檄 + 文</p>
    <p>双字词：每个字取前两码：木（S） + 白（R） + 文（Y） + 丶（Y） → <strong>SRYY</strong></p>
