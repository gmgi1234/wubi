  <h2>怎么拆</h2>
  <div class="rule">
    <p>訓誡 = 訓 + 誡</p>
    <p>双字词：每个字取前两码：言（Y） + 川（K） + 言（Y） + 戈（A） → <strong>YKYA</strong></p>
