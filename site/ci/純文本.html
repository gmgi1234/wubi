  <h2>怎么拆</h2>
  <div class="rule">
    <p>純文本 = 純 + 文 + 本</p>
    <p>三字词：前两字各取首码，最后一字取前两码：糹（X） + 文（Y） + 木（S） + 一（G） → <strong>XYSG</strong></p>
