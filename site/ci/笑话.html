  <h2>怎么拆</h2>
  <div class="rule">
    <p>笑话 = 笑 + 话</p>
    <p>双字词：每个字取前两码：⺮（T） + 丿（T） + 讠（Y） + 丿（T） → <strong>TTYT</strong></p>
