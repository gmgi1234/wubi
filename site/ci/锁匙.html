  <h2>怎么拆</h2>
  <div class="rule">
    <p>锁匙 = 锁 + 匙</p>
    <p>双字词：每个字取前两码：钅（Q） + ⺌（I） + 曰（J） + 一（G） → <strong>QIJG</strong></p>
