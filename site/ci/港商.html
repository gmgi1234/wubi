  <h2>怎么拆</h2>
  <div class="rule">
    <p>港商 = 港 + 商</p>
    <p>双字词：每个字取前两码：氵（I） + 龷（A） + 立头（U） + 冂（M） → <strong>IAUM</strong></p>
