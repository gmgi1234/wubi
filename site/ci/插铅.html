  <h2>怎么拆</h2>
  <div class="rule">
    <p>插铅 = 插 + 铅</p>
    <p>双字词：每个字取前两码：扌（R） + 丿（T） + 钅（Q） + 𠘧（M） → <strong>RTQM</strong></p>
