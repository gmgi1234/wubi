  <h2>怎么拆</h2>
  <div class="rule">
    <p>人人皆知 = 人 + 人 + 皆 + 知</p>
    <p>四字词：每个字取首码：人（W） + 人（W） + 匕（X） + 𠂉（T） → <strong>WWXT</strong></p>
