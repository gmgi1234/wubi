  <h2>怎么拆</h2>
  <div class="rule">
    <p>链轮 = 链 + 轮</p>
    <p>双字词：每个字取前两码：钅（Q） + 车（L） + 车（L） + 𠆢（W） → <strong>QLLW</strong></p>
