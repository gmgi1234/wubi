  <h2>怎么拆</h2>
  <div class="rule">
    <p>贞操 = 贞 + 操</p>
    <p>双字词：每个字取前两码：⺊（H） + 贝（M） + 扌（R） + 口（K） → <strong>HMRK</strong></p>
