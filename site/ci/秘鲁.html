  <h2>怎么拆</h2>
  <div class="rule">
    <p>秘鲁 = 秘 + 鲁</p>
    <p>双字词：每个字取前两码：禾（T） + 心（N） + 鱼头（Q） + 一（G） → <strong>TNQG</strong></p>
