  <h2>怎么拆</h2>
  <div class="rule">
    <p>联调 = 联 + 调</p>
    <p>双字词：每个字取前两码：耳（B） + 䒑（U） + 讠（Y） + 冂（M） → <strong>BUYM</strong></p>
