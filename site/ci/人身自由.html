  <h2>怎么拆</h2>
  <div class="rule">
    <p>人身自由 = 人 + 身 + 自 + 由</p>
    <p>四字词：每个字取首码：人（W） + 丿（T） + 丿（T） + 由（M） → <strong>WTTM</strong></p>
