  <h2>怎么拆</h2>
  <div class="rule">
    <p>外交大臣 = 外 + 交 + 大 + 臣</p>
    <p>四字词：每个字取首码：夕（Q） + 六（U） + 大（D） + 匚（A） → <strong>QUDA</strong></p>
