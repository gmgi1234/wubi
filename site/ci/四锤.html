  <h2>怎么拆</h2>
  <div class="rule">
    <p>四锤 = 四 + 锤</p>
    <p>双字词：每个字取前两码：四（L） + 丨（H） + 钅（Q） + 丿（T） → <strong>LHQT</strong></p>
