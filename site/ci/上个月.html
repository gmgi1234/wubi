  <h2>怎么拆</h2>
  <div class="rule">
    <p>上个月 = 上 + 个 + 月</p>
    <p>三字词：前两字各取首码，最后一字取前两码：上（H） + 人（W） + 月（E） → <strong>HWEE</strong></p>
