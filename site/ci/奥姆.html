  <h2>怎么拆</h2>
  <div class="rule">
    <p>奥姆 = 奥 + 姆</p>
    <p>双字词：每个字取前两码：丿（T） + 冂（M） + 女（V） + 母框（X） → <strong>TMVX</strong></p>
