  <h2>怎么拆</h2>
  <div class="rule">
    <p>锐减 = 锐 + 减</p>
    <p>双字词：每个字取前两码：钅（Q） + 丷（U） + 冫（U） + 厂（D） → <strong>QUUD</strong></p>
