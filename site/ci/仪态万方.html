  <h2>怎么拆</h2>
  <div class="rule">
    <p>仪态万方 = 仪 + 态 + 万 + 方</p>
    <p>四字词：每个字取首码：亻（W） + 大（D） + 丆（D） + 方（Y） → <strong>WDDY</strong></p>
