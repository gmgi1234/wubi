  <h2>怎么拆</h2>
  <div class="rule">
    <p>采撷 = 采 + 撷</p>
    <p>双字词：每个字取前两码：爫（E） + 木（S） + 扌（R） + 士（F） → <strong>ESRF</strong></p>
