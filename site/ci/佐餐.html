  <h2>怎么拆</h2>
  <div class="rule">
    <p>佐餐 = 佐 + 餐</p>
    <p>双字词：每个字取前两码：亻（W） + 𠂇（D） + 卜（H） + 夕（Q） → <strong>WDHQ</strong></p>
