  <h2>怎么拆</h2>
  <div class="rule">
    <p>刊名 = 刊 + 名</p>
    <p>双字词：每个字取前两码：干（F） + 刂（J） + 夕（Q） + 口（K） → <strong>FJQK</strong></p>
