  <h2>怎么拆</h2>
  <div class="rule">
    <p>掩映 = 掩 + 映</p>
    <p>双字词：每个字取前两码：扌（R） + 大（D） + 日（J） + 冂（M） → <strong>RDJM</strong></p>
