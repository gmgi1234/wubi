  <h2>怎么拆</h2>
  <div class="rule">
    <p>拔管 = 拔 + 管</p>
    <p>双字词：每个字取前两码：扌（R） + 尤前（D） + ⺮（T） + 宀（P） → <strong>RDTP</strong></p>
