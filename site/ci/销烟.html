  <h2>怎么拆</h2>
  <div class="rule">
    <p>销烟 = 销 + 烟</p>
    <p>双字词：每个字取前两码：钅（Q） + ⺌（I） + 火（O） + 囗（L） → <strong>QIOL</strong></p>
