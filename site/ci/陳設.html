  <h2>怎么拆</h2>
  <div class="rule">
    <p>陳設 = 陳 + 設</p>
    <p>双字词：每个字取前两码：阝（B） + 一（G） + 言（Y） + 𠘧（M） → <strong>BGYM</strong></p>
