  <h2>怎么拆</h2>
  <div class="rule">
    <p>正确 = 正 + 确</p>
    <p>双字词：每个字取前两码：一（G） + 止（H） + 石（D） + ⺈（Q） → <strong>GHDQ</strong></p>
