  <h2>怎么拆</h2>
  <div class="rule">
    <p>递减 = 递 + 减</p>
    <p>双字词：每个字取前两码：丷（U） + 弓（X） + 冫（U） + 厂（D） → <strong>UXUD</strong></p>
