  <h2>怎么拆</h2>
  <div class="rule">
    <p>光譜 = 光 + 譜</p>
    <p>双字词：每个字取前两码：光头（I） + 儿（Q） + 言（Y） + 䒑（U） → <strong>IQYU</strong></p>
