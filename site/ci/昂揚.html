  <h2>怎么拆</h2>
  <div class="rule">
    <p>昂揚 = 昂 + 揚</p>
    <p>双字词：每个字取前两码：日（J） + 卬左（Q） + 扌（R） + 日（J） → <strong>JQRJ</strong></p>
