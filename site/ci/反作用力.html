  <h2>怎么拆</h2>
  <div class="rule">
    <p>反作用力 = 反 + 作 + 用 + 力</p>
    <p>四字词：每个字取首码：𠂆（R） + 亻（W） + 用（E） + 力（L） → <strong>RWEL</strong></p>
