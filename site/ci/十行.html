  <h2>怎么拆</h2>
  <div class="rule">
    <p>十行 = 十 + 行</p>
    <p>双字词：每个字取前两码：十（F） + 一（G） + 彳（T） + 二（F） → <strong>FGTF</strong></p>
  </div>
