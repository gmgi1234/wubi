  <h2>怎么拆</h2>
  <div class="rule">
    <p>逃婚 = 逃 + 婚</p>
    <p>双字词：每个字取前两码：氺侧（I） + 儿（Q） + 女（V） + 卬左（Q） → <strong>IQVQ</strong></p>
