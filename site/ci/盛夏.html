  <h2>怎么拆</h2>
  <div class="rule">
    <p>盛夏 = 盛 + 夏</p>
    <p>双字词：每个字取前两码：厂（D） + ㇆（N） + 丆（D） + 目（H） → <strong>DNDH</strong></p>
