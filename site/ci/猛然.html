  <h2>怎么拆</h2>
  <div class="rule">
    <p>猛然 = 猛 + 然</p>
    <p>双字词：每个字取前两码：犭前（Q） + 丿（T） + 𱼀（Q） + 犬（D） → <strong>QTQD</strong></p>
