  <h2>怎么拆</h2>
  <div class="rule">
    <p>文武全才 = 文 + 武 + 全 + 才</p>
    <p>四字词：每个字取首码：文（Y） + 一（G） + 人（W） + 十（F） → <strong>YGWF</strong></p>
