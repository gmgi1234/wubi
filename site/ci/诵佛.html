  <h2>怎么拆</h2>
  <div class="rule">
    <p>诵佛 = 诵 + 佛</p>
    <p>双字词：每个字取前两码：讠（Y） + 龴（C） + 亻（W） + 弓（X） → <strong>YCWX</strong></p>
