  <h2>怎么拆</h2>
  <div class="rule">
    <p>候选人 = 候 + 选 + 人</p>
    <p>三字词：前两字各取首码，最后一字取前两码：亻（W） + 丿（T） + 人（W） → <strong>WTWW</strong></p>
