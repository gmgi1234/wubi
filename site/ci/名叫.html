  <h2>怎么拆</h2>
  <div class="rule">
    <p>名叫 = 名 + 叫</p>
    <p>双字词：每个字取前两码：夕（Q） + 口（K） + 口（K） + 𠄌（N） → <strong>QKKN</strong></p>
