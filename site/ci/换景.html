  <h2>怎么拆</h2>
  <div class="rule">
    <p>换景 = 换 + 景</p>
    <p>双字词：每个字取前两码：扌（R） + 𠂊（Q） + 日（J） + 京头（Y） → <strong>RQJY</strong></p>
