  <h2>怎么拆</h2>
  <div class="rule">
    <p>养颜 = 养 + 颜</p>
    <p>双字词：每个字取前两码：丷（U） + 羊后（D） + 立（U） + 丿（T） → <strong>UDUT</strong></p>
