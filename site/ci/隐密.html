  <h2>怎么拆</h2>
  <div class="rule">
    <p>隐密 = 隐 + 密</p>
    <p>双字词：每个字取前两码：阝（B） + 𠂊（Q） + 宀（P） + 心（N） → <strong>BQPN</strong></p>
