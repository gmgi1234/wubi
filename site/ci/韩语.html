  <h2>怎么拆</h2>
  <div class="rule">
    <p>韩语 = 韩 + 语</p>
    <p>双字词：每个字取前两码：十（F） + 早（J） + 讠（Y） + 五（G） → <strong>FJYG</strong></p>
