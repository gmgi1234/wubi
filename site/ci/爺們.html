  <h2>怎么拆</h2>
  <div class="rule">
    <p>爺們 = 爺 + 們</p>
    <p>双字词：每个字取前两码：八（W） + 乂（Q） + 亻（W） + 門（U） → <strong>WQWU</strong></p>
