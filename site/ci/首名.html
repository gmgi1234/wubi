  <h2>怎么拆</h2>
  <div class="rule">
    <p>首名 = 首 + 名</p>
    <p>双字词：每个字取前两码：䒑（U） + 丿（T） + 夕（Q） + 口（K） → <strong>UTQK</strong></p>
