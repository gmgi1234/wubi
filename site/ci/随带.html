  <h2>怎么拆</h2>
  <div class="rule">
    <p>随带 = 随 + 带</p>
    <p>双字词：每个字取前两码：阝（B） + 𠂇（D） + 一（G） + 川（K） → <strong>BDGK</strong></p>
