  <h2>怎么拆</h2>
  <div class="rule">
    <p>钢铸 = 钢 + 铸</p>
    <p>双字词：每个字取前两码：钅（Q） + 冂（M） + 钅（Q） + 三（D） → <strong>QMQD</strong></p>
