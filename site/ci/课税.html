  <h2>怎么拆</h2>
  <div class="rule">
    <p>课税 = 课 + 税</p>
    <p>双字词：每个字取前两码：讠（Y） + 曰（J） + 禾（T） + 丷（U） → <strong>YJTU</strong></p>
