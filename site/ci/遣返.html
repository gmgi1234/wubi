  <h2>怎么拆</h2>
  <div class="rule">
    <p>遣返 = 遣 + 返</p>
    <p>双字词：每个字取前两码：口（K） + 丨（H） + 𠂆（R） + 又（C） → <strong>KHRC</strong></p>
