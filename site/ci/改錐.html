  <h2>怎么拆</h2>
  <div class="rule">
    <p>改錐 = 改 + 錐</p>
    <p>双字词：每个字取前两码：己（N） + 攵（T） + 金（Q） + 亻（W） → <strong>NTQW</strong></p>
