  <h2>怎么拆</h2>
  <div class="rule">
    <p>摇蚊 = 摇 + 蚊</p>
    <p>双字词：每个字取前两码：扌（R） + 爫（E） + 虫（J） + 文（Y） → <strong>REJY</strong></p>
