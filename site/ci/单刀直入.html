  <h2>怎么拆</h2>
  <div class="rule">
    <p>单刀直入 = 单 + 刀 + 直 + 入</p>
    <p>四字词：每个字取首码：丷（U） + 刀（V） + 十（F） + 丿（T） → <strong>UVFT</strong></p>
