  <h2>怎么拆</h2>
  <div class="rule">
    <p>孤寡 = 孤 + 寡</p>
    <p>双字词：每个字取前两码：子（B） + 𠂆（R） + 宀（P） + 丆（D） → <strong>BRPD</strong></p>
