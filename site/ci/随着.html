  <h2>怎么拆</h2>
  <div class="rule">
    <p>随着 = 随 + 着</p>
    <p>双字词：每个字取前两码：阝（B） + 𠂇（D） + 丷（U） + 羊后（D） → <strong>BDUD</strong></p>
