  <h2>怎么拆</h2>
  <div class="rule">
    <p>退賠 = 退 + 賠</p>
    <p>双字词：每个字取前两码：彐（V） + 長下（E） + 貝（M） + 立（U） → <strong>VEMU</strong></p>
