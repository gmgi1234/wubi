  <h2>怎么拆</h2>
  <div class="rule">
    <p>换装 = 换 + 装</p>
    <p>双字词：每个字取前两码：扌（R） + 𠂊（Q） + 丬（U） + 士（F） → <strong>RQUF</strong></p>
