  <h2>怎么拆</h2>
  <div class="rule">
    <p>挖掉 = 挖 + 掉</p>
    <p>双字词：每个字取前两码：扌（R） + 宀（P） + 扌（R） + ⺊（H） → <strong>RPRH</strong></p>
