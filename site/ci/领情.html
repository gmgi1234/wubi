  <h2>怎么拆</h2>
  <div class="rule">
    <p>领情 = 领 + 情</p>
    <p>双字词：每个字取前两码：𠆢（W） + 丶（Y） + 忄（N） + 龶（G） → <strong>WYNG</strong></p>
