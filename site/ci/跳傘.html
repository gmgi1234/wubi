  <h2>怎么拆</h2>
  <div class="rule">
    <p>跳傘 = 跳 + 傘</p>
    <p>双字词：每个字取前两码：口（K） + 止（H） + 𠆢（W） + 人（W） → <strong>KHWW</strong></p>
