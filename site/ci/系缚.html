  <h2>怎么拆</h2>
  <div class="rule">
    <p>系缚 = 系 + 缚</p>
    <p>双字词：每个字取前两码：丿（T） + 幺（X） + 纟（X） + 一（G） → <strong>TXXG</strong></p>
