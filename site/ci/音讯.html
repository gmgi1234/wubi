  <h2>怎么拆</h2>
  <div class="rule">
    <p>音讯 = 音 + 讯</p>
    <p>双字词：每个字取前两码：立（U） + 日（J） + 讠（Y） + ⺄（N） → <strong>UJYN</strong></p>
