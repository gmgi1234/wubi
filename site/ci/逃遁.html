  <h2>怎么拆</h2>
  <div class="rule">
    <p>逃遁 = 逃 + 遁</p>
    <p>双字词：每个字取前两码：氺侧（I） + 儿（Q） + 𠂆（R） + 十（F） → <strong>IQRF</strong></p>
