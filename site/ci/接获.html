  <h2>怎么拆</h2>
  <div class="rule">
    <p>接获 = 接 + 获</p>
    <p>双字词：每个字取前两码：扌（R） + 立（U） + 艹（A） + 犭前（Q） → <strong>RUAQ</strong></p>
