  <h2>怎么拆</h2>
  <div class="rule">
    <p>岡比亞 = 岡 + 比 + 亞</p>
    <p>三字词：前两字各取首码，最后一字取前两码：冂（M） + 匕（X） + 一（G） + 丨（H） → <strong>MXGH</strong></p>
