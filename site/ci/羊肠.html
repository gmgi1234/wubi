  <h2>怎么拆</h2>
  <div class="rule">
    <p>羊肠 = 羊 + 肠</p>
    <p>双字词：每个字取前两码：丷（U） + 羊后（D） + 月（E） + 𠄎（N） → <strong>UDEN</strong></p>
