  <h2>怎么拆</h2>
  <div class="rule">
    <p>错觉 = 错 + 觉</p>
    <p>双字词：每个字取前两码：钅（Q） + 龷（A） + 𭕄（I） + 冖（P） → <strong>QAIP</strong></p>
