  <h2>怎么拆</h2>
  <div class="rule">
    <p>虚渺 = 虚 + 渺</p>
    <p>双字词：每个字取前两码：虍头（H） + 七（A） + 氵（I） + 目（H） → <strong>HAIH</strong></p>
