  <h2>怎么拆</h2>
  <div class="rule">
    <p>抚熨 = 抚 + 熨</p>
    <p>双字词：每个字取前两码：扌（R） + 二（F） + 尸（N） + 二（F） → <strong>RFNF</strong></p>
