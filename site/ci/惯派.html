  <h2>怎么拆</h2>
  <div class="rule">
    <p>惯派 = 惯 + 派</p>
    <p>双字词：每个字取前两码：忄（N） + 毌框（X） + 氵（I） + 𠂆（R） → <strong>NXIR</strong></p>
