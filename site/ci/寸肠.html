  <h2>怎么拆</h2>
  <div class="rule">
    <p>寸肠 = 寸 + 肠</p>
    <p>双字词：每个字取前两码：寸（F） + 一（G） + 月（E） + 𠄎（N） → <strong>FGEN</strong></p>
