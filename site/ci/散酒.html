  <h2>怎么拆</h2>
  <div class="rule">
    <p>散酒 = 散 + 酒</p>
    <p>双字词：每个字取前两码：龷（A） + 月（E） + 氵（I） + 西（S） → <strong>AEIS</strong></p>
