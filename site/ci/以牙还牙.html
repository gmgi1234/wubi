  <h2>怎么拆</h2>
  <div class="rule">
    <p>以牙还牙 = 以 + 牙 + 还 + 牙</p>
    <p>四字词：每个字取首码：𠄌（N） + 匸（A） + 一（G） + 匸（A） → <strong>NAGA</strong></p>
