  <h2>怎么拆</h2>
  <div class="rule">
    <p>塞给 = 塞 + 给</p>
    <p>双字词：每个字取前两码：宀（P） + 二（F） + 纟（X） + 人（W） → <strong>PFXW</strong></p>
