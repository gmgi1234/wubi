  <h2>怎么拆</h2>
  <div class="rule">
    <p>铁路 = 铁 + 路</p>
    <p>双字词：每个字取前两码：钅（Q） + 牛前（R） + 口（K） + 止（H） → <strong>QRKH</strong></p>
