  <h2>怎么拆</h2>
  <div class="rule">
    <p>信箋 = 信 + 箋</p>
    <p>双字词：每个字取前两码：亻（W） + 言（Y） + ⺮（T） + 戈（A） → <strong>WYTA</strong></p>
