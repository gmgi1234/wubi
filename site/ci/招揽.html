  <h2>怎么拆</h2>
  <div class="rule">
    <p>招揽 = 招 + 揽</p>
    <p>双字词：每个字取前两码：扌（R） + 刀（V） + 扌（R） + 〢（J） → <strong>RVRJ</strong></p>
