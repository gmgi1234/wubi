  <h2>怎么拆</h2>
  <div class="rule">
    <p>铁锹 = 铁 + 锹</p>
    <p>双字词：每个字取前两码：钅（Q） + 牛前（R） + 钅（Q） + 禾（T） → <strong>QRQT</strong></p>
