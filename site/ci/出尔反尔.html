  <h2>怎么拆</h2>
  <div class="rule">
    <p>出尔反尔 = 出 + 尔 + 反 + 尔</p>
    <p>四字词：每个字取首码：凵（B） + ⺈（Q） + 𠂆（R） + ⺈（Q） → <strong>BQRQ</strong></p>
