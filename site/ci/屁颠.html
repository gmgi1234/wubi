  <h2>怎么拆</h2>
  <div class="rule">
    <p>屁颠 = 屁 + 颠</p>
    <p>双字词：每个字取前两码：尸（N） + 匕（X） + 十（F） + 具头（H） → <strong>NXFH</strong></p>
