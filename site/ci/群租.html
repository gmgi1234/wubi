  <h2>怎么拆</h2>
  <div class="rule">
    <p>群租 = 群 + 租</p>
    <p>双字词：每个字取前两码：彐（V） + 丿（T） + 禾（T） + 冃（E） → <strong>VTTE</strong></p>
