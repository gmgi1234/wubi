  <h2>怎么拆</h2>
  <div class="rule">
    <p>腐败 = 腐 + 败</p>
    <p>双字词：每个字取前两码：广（Y） + 亻（W） + 贝（M） + 攵（T） → <strong>YWMT</strong></p>
