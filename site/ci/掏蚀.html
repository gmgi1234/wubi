  <h2>怎么拆</h2>
  <div class="rule">
    <p>掏蚀 = 掏 + 蚀</p>
    <p>双字词：每个字取前两码：扌（R） + 勹（Q） + ⺈（Q） + 𠄌（N） → <strong>RQQN</strong></p>
