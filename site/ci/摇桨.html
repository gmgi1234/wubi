  <h2>怎么拆</h2>
  <div class="rule">
    <p>摇桨 = 摇 + 桨</p>
    <p>双字词：每个字取前两码：扌（R） + 爫（E） + 丬（U） + 夕（Q） → <strong>REUQ</strong></p>
