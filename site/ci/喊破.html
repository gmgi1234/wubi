  <h2>怎么拆</h2>
  <div class="rule">
    <p>喊破 = 喊 + 破</p>
    <p>双字词：每个字取前两码：口（K） + 厂（D） + 石（D） + 皮前（H） → <strong>KDDH</strong></p>
