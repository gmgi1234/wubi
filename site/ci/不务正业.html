  <h2>怎么拆</h2>
  <div class="rule">
    <p>不务正业 = 不 + 务 + 正 + 业</p>
    <p>四字词：每个字取首码：一（G） + 夂（T） + 一（G） + 灬（O） → <strong>GTGO</strong></p>
