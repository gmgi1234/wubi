  <h2>怎么拆</h2>
  <div class="rule">
    <p>久仰大名 = 久 + 仰 + 大 + 名</p>
    <p>四字词：每个字取首码：𠂊（Q） + 亻（W） + 大（D） + 夕（Q） → <strong>QWDQ</strong></p>
