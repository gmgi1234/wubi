  <h2>怎么拆</h2>
  <div class="rule">
    <p>缉获 = 缉 + 获</p>
    <p>双字词：每个字取前两码：纟（X） + 口（K） + 艹（A） + 犭前（Q） → <strong>XKAQ</strong></p>
