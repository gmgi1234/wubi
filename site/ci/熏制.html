  <h2>怎么拆</h2>
  <div class="rule">
    <p>熏制 = 熏 + 制</p>
    <p>双字词：每个字取前两码：丿（T） + 一（G） + 牛前（R） + 冂（M） → <strong>TGRM</strong></p>
