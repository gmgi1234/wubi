  <h2>怎么拆</h2>
  <div class="rule">
    <p>必应 = 必 + 应</p>
    <p>双字词：每个字取前两码：心（N） + 丿（T） + 广（Y） + 兴头（I） → <strong>NTYI</strong></p>
