  <h2>怎么拆</h2>
  <div class="rule">
    <p>捻碎 = 捻 + 碎</p>
    <p>双字词：每个字取前两码：扌（R） + 𠆢（W） + 石（D） + 亠（Y） → <strong>RWDY</strong></p>
