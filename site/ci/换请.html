  <h2>怎么拆</h2>
  <div class="rule">
    <p>换请 = 换 + 请</p>
    <p>双字词：每个字取前两码：扌（R） + 𠂊（Q） + 讠（Y） + 龶（G） → <strong>RQYG</strong></p>
