  <h2>怎么拆</h2>
  <div class="rule">
    <p>招牌 = 招 + 牌</p>
    <p>双字词：每个字取前两码：扌（R） + 刀（V） + 丿（T） + 丨（H） → <strong>RVTH</strong></p>
