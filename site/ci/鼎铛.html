  <h2>怎么拆</h2>
  <div class="rule">
    <p>鼎铛 = 鼎 + 铛</p>
    <p>双字词：每个字取前两码：目（H） + 𠃑（N） + 钅（Q） + ⺌（I） → <strong>HNQI</strong></p>
