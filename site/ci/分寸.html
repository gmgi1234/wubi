  <h2>怎么拆</h2>
  <div class="rule">
    <p>分寸 = 分 + 寸</p>
    <p>双字词：每个字取前两码：八（W） + 刀（V） + 寸（F） + 一（G） → <strong>WVFG</strong></p>
