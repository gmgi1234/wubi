  <h2>怎么拆</h2>
  <div class="rule">
    <p>纪录 = 纪 + 录</p>
    <p>双字词：每个字取前两码：纟（X） + 己（N） + 彐（V） + 氺（I） → <strong>XNVI</strong></p>
