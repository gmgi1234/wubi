  <h2>怎么拆</h2>
  <div class="rule">
    <p>韶钢 = 韶 + 钢</p>
    <p>双字词：每个字取前两码：立（U） + 日（J） + 钅（Q） + 冂（M） → <strong>UJQM</strong></p>
