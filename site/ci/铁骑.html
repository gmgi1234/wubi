  <h2>怎么拆</h2>
  <div class="rule">
    <p>铁骑 = 铁 + 骑</p>
    <p>双字词：每个字取前两码：钅（Q） + 牛前（R） + 马（C） + 大（D） → <strong>QRCD</strong></p>
