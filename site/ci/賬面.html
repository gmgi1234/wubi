  <h2>怎么拆</h2>
  <div class="rule">
    <p>賬面 = 賬 + 面</p>
    <p>双字词：每个字取前两码：貝（M） + 镸头（D） + 丆（D） + 冂（M） → <strong>MDDM</strong></p>
