  <h2>怎么拆</h2>
  <div class="rule">
    <p>挈领 = 挈 + 领</p>
    <p>双字词：每个字取前两码：三（D） + 丨（H） + 𠆢（W） + 丶（Y） → <strong>DHWY</strong></p>
