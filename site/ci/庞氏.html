  <h2>怎么拆</h2>
  <div class="rule">
    <p>庞氏 = 庞 + 氏</p>
    <p>双字词：每个字取前两码：广（Y） + 尤前（D） + 卬左（Q） + 七（A） → <strong>YDQA</strong></p>
