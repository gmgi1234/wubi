  <h2>怎么拆</h2>
  <div class="rule">
    <p>微视 = 微 + 视</p>
    <p>双字词：每个字取前两码：彳（T） + 山（M） + 衣示旁（P） + 丶（Y） → <strong>TMPY</strong></p>
