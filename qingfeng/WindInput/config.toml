[input]
filter_mode = "gb18030"

[input.auto_pair]
english_pairs = [
    "()",
    "[]",
    "{}",
]

[input.punct]
follow_mode = true

[keys]
key_actions_materialized = 1
page_keys = [
    "pageupdown",
    "minus_equal",
    "comma_period",
]

[keys.key_actions]
backtick = "temp_pinyin"
semicolon = "mix:quick_mix"

[schema]
active = "wubi_union_pinyin"
available = ["wubi_union"]
primary_codetable = "wubi86"

[schema.codetable.auto_phrase]
enabled = true

[schema.codetable.frequency]
enabled = true
half_life = 0

[schema.english.frequency]
half_life = 0

[schema.pinyin.frequency]
half_life = 0

[ui.candidate]
per_page = 5

[ui.comment.assign.type.codetable]
default_horizontal = "chaizi_word"

[ui.comment.assign.type.mixed]
default_horizontal = "chaizi_word"

[[ui.comment.templates]]
id = "chaizi_word"
name = "拆分（含词组）"
text = "${chaizi}{ · ${dict:ci_chaifen}}"

[[ui.comment_dicts]]
id = "ci_chaifen"
label = "词组拆分"
path = "comments/ci_chaifen.txt"
