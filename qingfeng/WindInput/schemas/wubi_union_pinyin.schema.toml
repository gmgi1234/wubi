[schema]
id = "wubi_union_pinyin"
name = "五笔大一统拼音"
icon_label = "统"
version = "1.0.0"
author = "社区"
description = "86/98/新世纪三版兼容+拼音混合输入方案"

[engine]
type = "mixed"

# 仅引擎固定参数（方案构成 + 内部权重基线）；融合策略已上移至全局 [schema.mix]。
[engine.mixed]
primary_schema = "wubi_union"
secondary_schema = "pinyin"
codetable_weight_boost = 10000000

# 用户数据从引用方案继承：
#   shadow/userdict → 主方案 (wubi_union)
#   userfreq → 拼音方案 (pinyin)
# 调频/造词走子方案的全局 [schema.codetable] / [schema.pinyin] 配置。

[engine.chaizi]
enabled = true
db_path = "wubi06_chaizi_pua.txt"
font_path = "xin_shiji_zigen.ttf"
font_family = "新世纪字根"

[[dictionaries]]
id = "wubi_union_main"
path = "dicts/wubi_union.dict.yaml"
default = true
