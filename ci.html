<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>词组五笔编码查询 · 五笔字根</title>
<meta name="description" content="输入任意词组，查看 86/98/新世纪三版五笔编码、字根拆分与彩色字形。">
<link rel="stylesheet" href="data/page-word.css">
</head>
<body>
<div id="app"></div>
<script src="data/render.js"></script>
<script src="data/frag-map.js"></script>
<script src="data/frag-sprite.js"></script>
<script>
(async function () {
  const w = new URLSearchParams(location.search).get('w') || '中国';
  document.title = w + '五笔怎么打？86/98/新世纪编码与拆分';
  const load = (src) => new Promise((ok, bad) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s);
  });

  // 本地 file://：有静态完整页就跳过去（版式与静态页一致）
  if (location.protocol === 'file:') {
    try {
      await load('data/static-pages.js');
      if ((window.STATIC_CI_PAGES || []).indexOf(w) >= 0) {
        location.replace('ci/' + encodeURIComponent(w) + '.html');
        return;
      }
    } catch (e) {}
  }

  const wb = w.charCodeAt(0) % 64;
  try { await load('data/word-' + wb + '.js'); } catch (e) {}
  const rec = (window['WORD_DATA_' + wb] || {})[w];
  if (!rec) {
    document.getElementById('app').innerHTML = '<div style="padding:60px;text-align:center;font-family:KaiTi,serif">没找到「' + w + '」这个词<br><a href="./">回首页</a></div>';
    return;
  }

  // 载入每个字的单字记录（判断成字字根）
  const keyIdx = {};
  const keyNameIdx = {};
  await Promise.all(rec.ch.map(async (c) => {
    const b = c.charCodeAt(0) % 64;
    if (!window['CHAR_DATA_' + b]) {
      try { await load('data/char-' + b + '.js'); } catch (e) {}
    }
    const cr = (window['CHAR_DATA_' + b] || {})[c];
    if (!cr) return;
    for (const ver of ['86', '98', '06']) {
      const d = cr.v[ver];
      if (d && d.split && d.split[0] === c) keyIdx[c + '-' + ver] = true;
      if (d && d.split && d.split.length === 1 && d.split[0] === c) keyNameIdx[c + '-' + ver] = true;
    }
  }));
  // 同首字桶内的前后词
  try {
    await load('data/word-idx-' + wb + '.js');
    const list = window['WORD_IDX_' + wb] || [];
    const at = list.indexOf(w);
    if (at >= 0) {
      rec.prev = at > 0 ? list[at - 1] : '';
      rec.next = at < list.length - 1 ? list[at + 1] : '';
    }
  } catch (e) {}

  rec.keyIdx = keyIdx;
  rec.keyName = keyNameIdx;

  WubiRender.renderWord(rec, {}, {});
  // 字形按需加载（本地 file:// 下由 render.js 用 stroke-bundle 重建）
  const glyphs = {};
  const jobs = [];
  for (const c of rec.ch) {
    for (const ver of ['86', '98', '06']) {
      jobs.push((async () => {
        const inner = await WubiRender.glyphInner(c, ver);
        if (inner) glyphs[c + '-' + ver] = inner;
      })());
    }
  }
  await Promise.all(jobs);
  WubiRender.renderWord(rec, glyphs, {});

  // 释义（按首字分桶，按需加载）
  (async function () {
    const slot = document.getElementById('mean-slot');
    if (!slot) return;
    const mb = w.charCodeAt(0) % 64;
    if (!window['WORD_MEAN_' + mb]) {
      await load('data/word-mean-' + mb + '.js');
    }
    const table = window['WORD_MEAN_' + mb] || {};
    const text = table[w];
    if (text) {
      slot.innerHTML = '<h2>释义</h2><div class="rule"><p>' + text.replace(/[&<>]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])) + '</p></div>';
    }
  })();
})();
</script>

<script src="data/file-link-shim.js"></script>
</body></html>
