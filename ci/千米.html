  <h2>怎么拆</h2>
  <div class="rule">
    <p>千米 = 千 + 米</p>
    <p>双字词：每个字取前两码：丿（T） + 十（F） + 米（O） + 丶（Y） → <strong>TFOY</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>1.公制长度单位。一千米等于一公里，合我国二市里。</p></div>
