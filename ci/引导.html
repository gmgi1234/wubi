  <h2>怎么拆</h2>
  <div class="rule">
    <p>引导 = 引 + 导</p>
    <p>双字词：每个字取前两码：弓（X） + 丨（H） + 巳（N） + 寸（F） → <strong>XHNF</strong></p>
  </div>
