  <div class="rule">
    <p>挑战 = 挑 + 战</p>
    <p>双字词：每个字取前两码：扌（R） + <svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#FF9800;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-22"/></svg>（I） + 卜（H） + 口（K） → <strong>RIHK</strong></p>
  </div>
