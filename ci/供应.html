  <h2>怎么拆</h2>
  <div class="rule">
    <p>供应 = 供 + 应</p>
    <p>双字词：每个字取前两码：亻（W） + 龷（A） + 广（Y） + 兴头（I） → <strong>WAYI</strong></p>
