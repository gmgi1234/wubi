  <h2>怎么拆</h2>
  <div class="rule">
    <p>名义 = 名 + 义</p>
    <p>双字词：每个字取前两码：夕（Q） + 口（K） + 丶（Y） + 乂（Q） → <strong>QKYQ</strong></p>
  </div>
