  <h2>怎么拆</h2>
  <div class="rule">
    <p>军人 = 军 + 人</p>
    <p>双字词：每个字取前两码：冖（P） + 车（L） + 人（W） + 人（W） → <strong>PLWW</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>有军籍的人；服兵役的人。</p></div>
