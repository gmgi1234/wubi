  <h2>怎么拆</h2>
  <div class="rule">
    <p>措施 = 措 + 施</p>
    <p>双字词：每个字取前两码：扌（R） + 龷（A） + 方（Y） + 𠂉（T） → <strong>RAYT</strong></p>
