  <h2>怎么拆</h2>
  <div class="rule">
    <p>农业 = 农 + 业</p>
    <p>双字词：每个字取前两码：冖（P） + <svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#FF9800;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-83"/></svg>（E） + 灬（O） + 一（G） → <strong>PEOG</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>1.指栽培农作物和饲养牲畜的生产事业。</p></div>
