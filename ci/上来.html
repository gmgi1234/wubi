  <h2>怎么拆</h2>
  <div class="rule">
    <p>上来 = 上 + 来</p>
    <p>双字词：每个字取前两码：上（H） + 丨（H） + 一（G） + 米（O） → <strong>HHGO</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>1.犹言以上，上述。</p></div>
