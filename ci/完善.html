  <h2>怎么拆</h2>
  <div class="rule">
    <p>完善 = 完 + 善</p>
    <p>双字词：每个字取前两码：宀（P） + 二（F） + 丷（U） + <svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#3498DB;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-30"/></svg>（D） → <strong>PFUD</strong></p>
  </div>
