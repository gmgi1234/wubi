  <h2>怎么拆</h2>
  <div class="rule">
    <p>年纪 = 年 + 纪</p>
    <p>双字词：每个字取前两码：<svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#E74C3C;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-24"/></svg>（R） + 丨（H） + 纟（X） + 己（N） → <strong>RHXN</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>1.纪年年数。 2.年号。 3.年龄。 4.年代;时代。</p></div>
