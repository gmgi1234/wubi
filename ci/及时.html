  <h2>怎么拆</h2>
  <div class="rule">
    <p>及时 = 及 + 时</p>
    <p>双字词：每个字取前两码：乃（E） + 丶（Y） + 日（J） + 寸（F） → <strong>EYJF</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>①正赶上时候，适合需要～雨ㄧ～播种。②不拖延；马上；立刻有问题就～解决。</p></div>
