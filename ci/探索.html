  <h2>怎么拆</h2>
  <div class="rule">
    <p>探索 = 探 + 索</p>
    <p>双字词：每个字取前两码：扌（R） + 冖（P） + 十（F） + 冖（P） → <strong>RPFP</strong></p>
  </div>
