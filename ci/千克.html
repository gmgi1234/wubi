  <h2>怎么拆</h2>
  <div class="rule">
    <p>千克 = 千 + 克</p>
    <p>双字词：每个字取前两码：丿（T） + 十（F） + 古（D） + 儿（Q） → <strong>TFDQ</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>1.公制计量单位，一千克等于一公斤，合我国二市斤。</p></div>
