    <p>双字词：每个字取前两码：勹（Q） + 巳（N） + <svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#27AE60;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-69"/></svg>（W） + 丶（Y） → <strong>QNWY</strong></p>
  </div>
