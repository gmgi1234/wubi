  <h2>怎么拆</h2>
  <div class="rule">
    <p>密切 = 密 + 切</p>
    <p>双字词：每个字取前两码：宀（P） + 心（N） + 七（A） + 刀（V） → <strong>PNAV</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>1.亲近。 2.慎密。 3.严密。 4.关系近;紧密。 5.使关系接近。</p></div>
