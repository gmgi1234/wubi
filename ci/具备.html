  <h2>怎么拆</h2>
  <div class="rule">
    <p>具备 = 具 + 备</p>
    <p>双字词：每个字取前两码：<svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#E74C3C;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-8"/></svg>（H） + 八（W） + 夂（T） + 田（L） → <strong>HWTL</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>具有；齐备：～条件｜青年必须～建设祖国和保卫祖国的双重本领。</p></div>
