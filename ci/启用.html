  <h2>怎么拆</h2>
  <div class="rule">
    <p>启用 = 启 + 用</p>
    <p>双字词：每个字取前两码：丶（Y） + 尸（N） + 用（E） + ㇒（T） → <strong>YNET</strong></p>
