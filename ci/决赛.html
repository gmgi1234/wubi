  <h2>怎么拆</h2>
  <div class="rule">
    <p>决赛 = 决 + 赛</p>
    <p>双字词：每个字取前两码：冫（U） + コ（N） + 宀（P） + 二（F） → <strong>UNPF</strong></p>
