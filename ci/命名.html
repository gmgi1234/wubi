  <h2>怎么拆</h2>
  <div class="rule">
    <p>命名 = 命 + 名</p>
    <p>双字词：每个字取前两码：人（W） + 一（G） + 夕（Q） + 口（K） → <strong>WGQK</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>1.给予名称;定名。</p></div>
