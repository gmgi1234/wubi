  <h2>怎么拆</h2>
  <div class="rule">
    <p>典礼 = 典 + 礼</p>
    <p>双字词：每个字取前两码：冂（M） + 龷（A） + 衣示旁（P） + 丶（Y） → <strong>MAPY</strong></p>
  </div>
