  <h2>怎么拆</h2>
  <div class="rule">
    <p>尺寸 = 尺 + 寸</p>
    <p>双字词：每个字取前两码：尸（N） + 丶（Y） + 寸（F） + 一（G） → <strong>NYFG</strong></p>
  </div>
