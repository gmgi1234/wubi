  <h2>怎么拆</h2>
  <div class="rule">
    <p>宣布 = 宣 + 布</p>
    <p>双字词：每个字取前两码：宀（P） + 一（G） + <svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#27AE60;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-56"/></svg>（D） + 冂（M） → <strong>PGDM</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>1.谓公之于众。 2.宣扬，广为宣传。 3.流布;泄漏。</p></div>
