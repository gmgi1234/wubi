  <h2>怎么拆</h2>
  <div class="rule">
    <p>专家 = 专 + 家</p>
    <p>双字词：每个字取前两码：二（F） + <svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#FF9800;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-64"/></svg>（N） + 宀（P） + 豕（E） → <strong>FNPE</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>1.指在学术﹑技艺等方面有专门研究或特长的人。 2.指学术上的某一家。</p></div>
