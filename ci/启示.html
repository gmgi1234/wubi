  <h2>怎么拆</h2>
  <div class="rule">
    <p>启示 = 启 + 示</p>
    <p>双字词：每个字取前两码：丶（Y） + 尸（N） + 二（F） + 小（I） → <strong>YNFI</strong></p>
  </div>
