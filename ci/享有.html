  <h2>怎么拆</h2>
  <div class="rule">
    <p>享有 = 享 + 有</p>
    <p>双字词：每个字取前两码：<svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#E74C3C;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-4"/></svg>（Y） + 子（B） + <svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#27AE60;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-56"/></svg>（D） + 月（E） → <strong>YBDE</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>1.谓在社会上有所取得。如权利﹑自由﹑声望等。 2.享受。</p></div>
