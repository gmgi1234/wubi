  <h2>怎么拆</h2>
  <div class="rule">
    <p>三分 = 三 + 分</p>
    <p>双字词：每个字取前两码：三（D） + 一（G） + 八（W） + 刀（V） → <strong>DGWV</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>1.谓一分为三。 2.指三国史话。 3.十分之三。</p></div>
