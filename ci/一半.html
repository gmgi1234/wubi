  <h2>怎么拆</h2>
  <div class="rule">
    <p>一半 = 一 + 半</p>
    <p>双字词：每个字取前两码：一（G） + 一（G） + 䒑（U） + 十（F） → <strong>GGUF</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>1.二分之一。亦以表示约得其半。</p></div>
