  <h2>怎么拆</h2>
  <div class="rule">
    <p>双方 = 双 + 方</p>
    <p>双字词：每个字取前两码：又（C） + 又（C） + 方（Y） + 丶（Y） → <strong>CCYY</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>1.指在某种场合中相对的两个人或两个集体。</p></div>
