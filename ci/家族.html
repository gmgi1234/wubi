  <div class="rule">
    <p>家族 = 家 + 族</p>
    <p>双字词：每个字取前两码：宀（P） + 豕（E） + 方（Y） + <svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#3498DB;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-57"/></svg>（T） → <strong>PEYT</strong></p>
  </div>
