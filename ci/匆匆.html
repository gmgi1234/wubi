  <h2>怎么拆</h2>
  <div class="rule">
    <p>匆匆 = 匆 + 匆</p>
    <p>双字词：每个字取前两码：勹（Q） + <svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#FF9800;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-92"/></svg>（R） + 勹（Q） + <svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#2980B9;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-92"/></svg>（R） → <strong>QRQR</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>急促的样子；急忙的样子匆匆游子匆匆去｜更能消几番风雨，匆匆春又归去｜行色匆匆。</p></div>
