  <h2>怎么拆</h2>
  <div class="rule">
    <p>借鉴 = 借 + 鉴</p>
    <p>双字词：每个字取前两码：亻（W） + 龷（A） + 〢（J） + 𠂉（T） → <strong>WAJT</strong></p>
