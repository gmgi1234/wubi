  <h2>怎么拆</h2>
  <div class="rule">
    <p>协会 = 协 + 会</p>
    <p>双字词：每个字取前两码：十（F） + 力（L） + 人（W） + 二（F） → <strong>FLWF</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>1.会合。 2.为促进某种共同事业的发展而组成的群众团体。</p></div>
