  <h2>怎么拆</h2>
  <div class="rule">
    <p>创办 = 创 + 办</p>
    <p>双字词：每个字取前两码：<svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#E74C3C;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-69"/></svg>（W） + 㔾（B） + 力（L） + 八（W） → <strong>WBLW</strong></p>
  </div>
