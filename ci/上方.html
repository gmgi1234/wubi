  <h2>怎么拆</h2>
  <div class="rule">
    <p>上方 = 上 + 方</p>
    <p>双字词：每个字取前两码：上（H） + 丨（H） + 方（Y） + 丶（Y） → <strong>HHYY</strong></p>
