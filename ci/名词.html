  <h2>怎么拆</h2>
  <div class="rule">
    <p>名词 = 名 + 词</p>
    <p>双字词：每个字取前两码：夕（Q） + 口（K） + 讠（Y） + 𠃌（N） → <strong>QKYN</strong></p>
