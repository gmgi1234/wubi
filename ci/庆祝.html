  <h2>怎么拆</h2>
  <div class="rule">
    <p>庆祝 = 庆 + 祝</p>
    <p>双字词：每个字取前两码：广（Y） + 大（D） + <svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#27AE60;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-35"/></svg>（P） + 丶（Y） → <strong>YDPY</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>1.庆贺祝颂。 2.后指对喜事进行一些活动表示欢庆或纪念。</p></div>
