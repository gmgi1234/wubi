    <p>双字词：每个字取前两码：<svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#E74C3C;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-66"/></svg>（N） + 丨（H） + 䒑（U） + 八（W） → <strong>NHUW</strong></p>
  </div>
