  <h2>怎么拆</h2>
  <div class="rule">
    <p>应变 = 应 + 变</p>
    <p>双字词：每个字取前两码：广（Y） + 兴头（I） + 亠（Y） + 灬（O） → <strong>YIYO</strong></p>
  </div>
