  <h2>怎么拆</h2>
  <div class="rule">
    <p>彻底 = 彻 + 底</p>
    <p>双字词：每个字取前两码：彳（T） + 七（A） + 广（Y） + <svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#2980B9;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-11"/></svg>（Q） → <strong>TAYQ</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>1.通透到底。形容深透﹑完全而无所遗留。 2.形容水清见底。</p></div>
