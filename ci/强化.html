  <h2>怎么拆</h2>
  <div class="rule">
    <p>强化 = 强 + 化</p>
    <p>双字词：每个字取前两码：弓（X） + 口（K） + 亻（W） + <svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#3498DB;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-73"/></svg>（X） → <strong>XKWX</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>加强；使坚强巩固：～记忆｜～训练。</p></div>
