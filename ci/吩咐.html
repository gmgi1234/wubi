  <h2>怎么拆</h2>
  <div class="rule">
    <p>吩咐 = 吩 + 咐</p>
    <p>双字词：每个字取前两码：口（K） + 八（W） + 口（K） + 亻（W） → <strong>KWKW</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>嘱咐；口头命令或派遣临出门，母亲反覆吩咐他要小心｜吩咐兵丁立即去抓人。</p></div>
