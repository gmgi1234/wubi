  <h2>怎么拆</h2>
  <div class="rule">
    <p>储备 = 储 + 备</p>
    <p>双字词：每个字取前两码：亻（W） + 讠（Y） + 夂（T） + 田（L） → <strong>WYTL</strong></p>
