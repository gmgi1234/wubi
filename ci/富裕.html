  <h2>怎么拆</h2>
  <div class="rule">
    <p>富裕 = 富 + 裕</p>
    <p>双字词：每个字取前两码：宀（P） + 一（G） + 衣示旁（P） + 冫（U） → <strong>PGPU</strong></p>
