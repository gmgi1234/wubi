  <h2>怎么拆</h2>
  <div class="rule">
    <p>对应 = 对 + 应</p>
    <p>双字词：每个字取前两码：又（C） + 寸（F） + 广（Y） + 兴头（I） → <strong>CFYI</strong></p>
