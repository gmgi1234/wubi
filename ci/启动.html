  <h2>怎么拆</h2>
  <div class="rule">
    <p>启动 = 启 + 动</p>
    <p>双字词：每个字取前两码：丶（Y） + 尸（N） + 二（F） + 厶（C） → <strong>YNFC</strong></p>
  </div>
  <h2>释义</h2><div class="rule"><p>1.犹劳动，劳驾。 2.发动;开动。</p></div>
