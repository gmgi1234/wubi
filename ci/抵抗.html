    <p>抵抗 = 抵 + 抗</p>
    <p>双字词：每个字取前两码：扌（R） + <svg class="frag" viewBox="0 0 1024 1024" width="18" height="18" style="color:#FF9800;vertical-align:-4px"><use href="../data/frag-sprite.svg#frag-11"/></svg>（Q） + 扌（R） + 亠（Y） → <strong>RQRY</strong></p>
  </div>
