    // 用临字的𫩏字根（strokes 5-8，4笔）替换象的strokes 2-5，
    // 并保留原stroke 5作为𧰨的第一笔（原笔顺错误导致它被归到𫩏）
    // 临是左右结构，𫩏在右上；象是上下结构，𫩏在中间，需坐标偏移
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    const xiangFixConfigs = {
        '象': {prefix: 0, dx: 0},
        '像': {prefix: 2, dx: 147},   // 亻占2笔
        '橡': {prefix: 4, dx: 151},   // 木占4笔
        '蟓': {prefix: 6, dx: 155},   // 虫占6笔
        '豫': {prefix: 4, dx: 159},   // 予占4笔
    };
    // 98/新世纪版象系字（象/像/橡/蟓/豫）使用本地原始笔划数据，不套用修正（此替换仅86版启用）
    // 86版：象直接用XIANG_86_STROKES；复合字用XIANG_86_STROKES fit到原象部位置
    const isXiangFixSkip = (currentWubiVersion !== '86' && xiangFixConfigs[char]);
    if (xiangFixConfigs[char] && !isXiangFixSkip && !window.XIANG_86_STROKES) {
        // bundle尚未加载（XIANG_86_STROKES未定义）时，回退旧的从临字取𫩏修正
        const linData = await fetchCharData('临');
        const cfg = xiangFixConfigs[char];
        strokes = applyXiangFix(strokes, linData, cfg.prefix, cfg.dx);
    }
    // 龜字前两笔笔划数据有误，用甪字的第一笔(丿)替换
    // 原2笔→丿(1笔)，总笔画从18→17
    // 通过fitStrokesToTargetBBox缩放对齐到原前两笔区域
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '龜') {
        const luoData = await fetchCharData('甪');
        const guiHeadStrokes = strokes.slice(0, 2);
        const fittedStroke = fitStrokesToTargetBBox(luoData.strokes.slice(0, 1), guiHeadStrokes);
        strokes = [...fittedStroke, ...strokes.slice(2)];
    }
    // 鬮笔画数据有误，用鬥+縮小後的龜替換（龜放在鬥内部）
    // 注意：必须调用getStrokeData('龜')而非fetchCharData('龜')，
    // 因为龜字的前两笔修正(18→17笔)在getStrokeData中执行，fetchCharData返回的是未修正的18笔
    if (char === '鬮') {
        const douData = await fetchCharData('鬥');
        const guiData = await getStrokeData('龜');
        // 將龜縮小並置於鬥內部中心位置，放大倍數恢復筆劃粗細
        const scaledGuiStrokes = guiData.strokes.map(s => scalePath(s, 0.6, 200, 80));
        // 标记龜的笔画，用于加粗笔划
        const guiStartIdx = douData.strokes.length;
        for (let i = guiStartIdx; i < guiStartIdx + scaledGuiStrokes.length; i++) {
            strokes[i] = scaledGuiStrokes[i - guiStartIdx];
        }
        strokes._guiStrokeStart = guiStartIdx;
    }
    // 隉=阝(2笔)+臼(6笔)+工(3笔)=11笔，末3笔（工）笔划数据有误（显示为土而非工）
    // 经字中的工也呈现土形，改用独立工字(3笔)的笔划数据替换隉的工(末3笔)
    // fitStrokesToTargetBBox后工字仍偏大，需额外缩小0.7倍并重新居中到目标区域中心
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '隉') {
        const gongData = await fetchCharData('工');
        const targetBBox = getStrokesBBox(strokes.slice(8));
        const fittedStrokes = fitStrokesToTargetBBox(gongData.strokes, strokes.slice(8));
        // 额外缩小0.7倍，以目标区域中心为锚点
        const fittedBBox = getStrokesBBox(fittedStrokes);
        const cx = targetBBox.minX + targetBBox.width / 2;
        const cy = targetBBox.minY + targetBBox.height / 2;
        const shrinkScale = 0.7;
        const offsetX = cx - fittedBBox.minX * shrinkScale - fittedBBox.width * shrinkScale / 2;
        const offsetY = cy - fittedBBox.minY * shrinkScale - fittedBBox.height * shrinkScale / 2;
        const gongStrokes = fittedStrokes.map(s => scalePath(s, shrinkScale, offsetX, offsetY));
        strokes = [...strokes.slice(0, 8), ...gongStrokes];
    }
    // 颻=䍃(10笔)+風(9笔)=19笔，左侧䍃笔划数据有误
    // 用繇字(䍃10笔+系7笔=17笔)中䍃部分(前10笔)替换颻的䍃(前10笔)
    // 通过fitStrokesToTargetBBox缩放对齐到原位置
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '颻') {
        const yaoData = await fetchCharData('繇');
        const yaoStrokes = fitStrokesToTargetBBox(yaoData.strokes.slice(0, 10), strokes.slice(0, 10));
        strokes = [...yaoStrokes, ...strokes.slice(10)];
    }
    // 韆=革(9笔)+遷(15笔)=24笔，右侧遷笔划数据有误
    // 用遷字(覀6+大3+巳3+辶3=15笔)的完整笔划数据替换韆的遷部分(第10笔起)
    // 注意：必须调用getStrokeData('遷')而非fetchCharData('遷')，
    // 因为遷字的巳笔划修正(14→15笔)在getStrokeData中执行，fetchCharData返回的是未修正的14笔
    // 通过fitStrokesToTargetBBox缩放对齐到原位置
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '韆') {
        const qianData = await getStrokeData('遷');
        const qianStrokes = fitStrokesToTargetBBox(qianData.strokes, strokes.slice(9));
        strokes = [...strokes.slice(0, 9), ...qianStrokes];
    }
    // 髮=髟(10笔)+犮(5笔)=15笔，下方犮笔划数据有误
    // 用独立犮字(5笔)的笔划数据替换髮的犮部分(末5笔，第11-15笔)
    // 通过fitStrokesToTargetBBox缩放对齐到原位置
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '髮') {
        const faData = await fetchCharData('犮');
        const faStrokes = fitStrokesToTargetBBox(faData.strokes, strokes.slice(10));
        strokes = [...strokes.slice(0, 10), ...faStrokes];
    }
    // 鷉=虒(10笔)+鳥(11笔)=21笔，左侧虒笔划数据有误
    // 用独立虒字(10笔)的笔划数据替换鷉的虒部分(前10笔)
    // 通过fitStrokesToTargetBBox缩放对齐到原位置
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '鷉') {
        const siData = await fetchCharData('虒');
        const siStrokes = fitStrokesToTargetBBox(siData.strokes, strokes.slice(0, 10));
        strokes = [...siStrokes, ...strokes.slice(10)];
    }
    // 鷈=鳥(11笔)+虒(10笔)=21笔，右侧虒笔划数据有误
    // 用独立虒字(10笔)的笔划数据替换鷈的虒部分(末10笔，第12-21笔)
    // 通过fitStrokesToTargetBBox缩放对齐到原位置
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '鷈') {
        const siData = await fetchCharData('虒');
        const siStrokes = fitStrokesToTargetBBox(siData.strokes, strokes.slice(11));
        strokes = [...strokes.slice(0, 11), ...siStrokes];
    }
    // 鷂=䍃(10笔)+鳥(11笔)=21笔，左侧䍃笔划数据有误
    // 用繇字(䍃10笔+系7笔=17笔)中䍃部分(前10笔)替换鷂的䍃(前10笔)
    // 通过fitStrokesToTargetBBox缩放对齐到原位置
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '鷂') {
        const yaoData = await fetchCharData('繇');
        const yaoStrokes = fitStrokesToTargetBBox(yaoData.strokes.slice(0, 10), strokes.slice(0, 10));
        strokes = [...yaoStrokes, ...strokes.slice(10)];
    }
    // 鴇=匕(2笔)+十(2笔)+鳥(11笔)=15笔，前两笔(匕)笔划数据有误
    // 用独立匕字(2笔)的笔划数据替换鴇的匕(前2笔)
    // 通过fitStrokesToTargetBBox缩放对齐到原位置
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '鴇') {
        const biData = await fetchCharData('匕');
        const biStrokes = fitStrokesToTargetBBox(biData.strokes, strokes.slice(0, 2));
        strokes = [...biStrokes, ...strokes.slice(2)];
    }
    // 鴟=氐(5笔)+鳥(11笔)=16笔，左侧氐笔划数据有误
    // 用鸱字(氐5笔+鸟5笔=10笔)中氐部分(前5笔)替换鴟的氐(前5笔)
    // 通过fitStrokesToTargetBBox缩放对齐到原位置
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '鴟') {
        const chiData = await fetchCharData('鸱');
        const diStrokes = fitStrokesToTargetBBox(chiData.strokes.slice(0, 5), strokes.slice(0, 5));
        strokes = [...diStrokes, ...strokes.slice(5)];
    }
    // 鸢=弋(3笔)+鸟(5笔)=8笔，笔划顺序有误
    // 重排：交换前两笔(s[0]↔s[1])，交换末两笔(s[6]↔s[7])
    if (char === '鸢') {
        const s = strokes;
        strokes = [s[1], s[0], s[2], s[3], s[4], s[5], s[7], s[6]];
    }
    // 䜭字笔划数据从㕡字左半部分提取（前12笔=䜭部分）
    // 㕡=䜭(12笔)+又(2笔)=14笔，取前12笔通过fitStrokesToTargetBBox缩放对齐到䜭原位置
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '䜭') {
        const heData = await fetchCharData('㕡');
        const leftStrokes = fitStrokesToTargetBBox(heData.strokes.slice(0, 12), strokes);
        strokes = leftStrokes;
    }
    // 86版象系字：使用用户提供的修正笔划数据（12笔）存储在stroke-bundle.js的XIANG_86_STROKES中
    // 象：直接替换整字；像/橡/蟓/豫：用XIANG_86_STROKES fit到复合字中原象部位置
    // 若bundle尚未加载完成（XIANG_86_STROKES未定义），回退原数据
    // 98/06版仍用bundle原始数据
    if (currentWubiVersion === '86' && window.XIANG_86_STROKES) {
        if (char === '象') {
            strokes = [...window.XIANG_86_STROKES];
        } else if (char === '像' || char === '橡' || char === '蟓' || char === '豫') {
            const cfg = xiangFixConfigs[char];
            const prefix = cfg.prefix;
            const xiangPart = strokes.slice(prefix); // 复合字中的原象部
            const newXiang = fitStrokesToTargetBBox(window.XIANG_86_STROKES, xiangPart);
            strokes = [...strokes.slice(0, prefix), ...newXiang];
        }
    }
    return { strokes, radStrokes: data.radStrokes || [] };
}

// ==================== 主渲染入口 ====================
async function loadAndRender(ch) {
    const char = ch || document.getElementById('char-input').value.trim()[0];
    if (!char) return;
    currentChar = char;

    // 显示加载
    const svg = document.getElementById('char-svg');
    svg.innerHTML = '<text x="512" y="512" text-anchor="middle" dominant-baseline="central" fill="#999" font-size="24">加载中...</text>';

    try {
        const strokeData = await getStrokeData(char);
        strokes = strokeData.strokes;
        radStrokes = strokeData.radStrokes;
        if (char === '酱') console.log('[DEBUG酱] data.strokes.length=', strokes.length);

        // 应用自定义笔画顺序（解决五笔与标准笔顺冲突）
        let customOrder = null;
        const wubi = WUBI[char];
        let customOrderSource = null; // 'char' 或 'component'
        
        // 先检查字符本身
        if (wubi && CUSTOM_STROKE_ORDER[char] && CUSTOM_STROKE_ORDER[char].condition(wubi)) {
            customOrder = CUSTOM_STROKE_ORDER[char];
            customOrderSource = 'char';
        }
        
        // 如果字符本身没有匹配，检查其部件是否有
        if (!customOrder && wubi && wubi.r) {
            // 检查字符的每个部件是否在 CUSTOM_STROKE_ORDER 中有定义
            // 如果有，则使用该部件的配置（复用该部件的笔画顺序调整逻辑）
            for (const root of wubi.r) {
                const rootWubi = WUBI[root];
                if (rootWubi && CUSTOM_STROKE_ORDER[root] && CUSTOM_STROKE_ORDER[root].condition(rootWubi)
                    && CUSTOM_STROKE_ORDER[root].swapLast && CUSTOM_STROKE_ORDER[root].swapScope !== 'roots') {
                    customOrder = CUSTOM_STROKE_ORDER[root];
                    customOrderSource = 'component';
                    break;
                }
            }
            
            // 如果直接检查部件未匹配，尝试展开 roots 后再检查
            if (!customOrder) {
                let expandedRoots = [...wubi.r];
                const KEY_NAMES_SET = new Set(Object.values(keyNamesDisplay));
                let changed = true;
                let iterations = 0;
                while (changed && iterations < 5) {
                    changed = false;
                    iterations++;
                    const next = [];
                    for (const root of expandedRoots) {
                        const wubiEntry = WUBI[root];
                        if (wubiEntry && wubiEntry.r && wubiEntry.r.length >= 2
                            && !KEY_NAMES_SET.has(root)
                            && !RADICAL_CHARS.has(root)
                            && !RADICAL_CHARS.has(root)
                            && root !== char) {
                            next.push(...wubiEntry.r);
                            changed = true;
                        } else {
                            next.push(root);
                        }
                    }
                    expandedRoots = next;
                }
                
                // 检查展开后的 roots 是否匹配任何 CUSTOM_STROKE_ORDER 条件
                // 注意：只匹配 swapScope:'roots' 的条目（部件级交换），
                // 不匹配整体 swapLast 条目（否则会误触发不含该字根的字符）
                for (const key in CUSTOM_STROKE_ORDER) {
                    const entry = CUSTOM_STROKE_ORDER[key];
                    if (entry.swapScope === 'roots' && entry.condition({ r: expandedRoots })) {
                        customOrder = entry;
                        customOrderSource = 'component';
                        break;
                    }
                }
            }
        }
        
        // 应用自定义笔画顺序
        if (customOrder) {
            const originalStrokes = [...strokes];
            const n = originalStrokes.length;
            
            if (customOrder.swapLast && n >= 2 && customOrder.swapScope !== 'roots') {
                // 交换最后两笔
                // swapScope:'roots' 的字不做整体交换，留给复合字逻辑按字根范围处理
                strokes = [...originalStrokes.slice(0, n-2), originalStrokes[n-1], originalStrokes[n-2]];
            } else if (customOrder.strokeRemap) {
                // 使用自定义重映射
                strokes = customOrder.strokeRemap.map(i => originalStrokes[i]);
            }
            
        }

        // ========== 通用递归展开字根 ==========
        // 如果某个字根本身是WUBI字典中的字（且有多个子字根），递归展开
        // 例如：洋=['氵','羊'] → ['氵','丷','羊后']（羊→丷+羊后）


        // 查找五笔信息
        if (wubi) {
            roots = wubi.r;

            // 配合 strokeRemap 同步更新 roots 数组顺序
            if (customOrder && customOrder.rootsRemap) {
                const originalRoots = roots;
                roots = customOrder.rootsRemap.map(idx => originalRoots[idx]);
            }
            
            // 调试：追踪 recursivelyExpandRoots 的入参
            console.log('[DEBUG' + char + '] 调用 recursivelyExpandRoots 前', { roots, currentChar, wubi_r: wubi && wubi.r });
            try {
                roots = recursivelyExpandRoots(roots, char);
            } catch(e) {
                console.error('[DEBUG] recursivelyExpandRoots 报错', { error: e.message, roots, currentChar });
                roots = [];
            }
        if (char === '酱') console.log('[DEBUG酱] 展开后roots=', JSON.stringify(roots));
            if (char === '迈') console.log('[DEBUG迈] 展开后roots=', JSON.stringify(roots), 'strokes.length=', strokes.length);
            if (char === '戊') console.log('[DEBUG戊] 展开后roots=', JSON.stringify(roots), 'strokes.length=', strokes.length);
            if (char === '成' || char === '戳') console.log('[DEBUG' + char + '] 展开后roots=', JSON.stringify(roots), 'strokes.length=', strokes.length, 'rootCode=', wubi.c);
            
            rootCode = wubi.c;
            
            // 自动判断补码（如果没有手动设置）
            // 使用拆分后的 roots 而不是原始 wubi.r
            if (!wubi.sup || wubi._supAuto) {
                const detected = autoDetectSupplement(char, roots);
                if (detected && detected.sup.length > 0) {
                    // 自动设置补码索引
                    wubi.sup = detected.sup;
                    wubi._supAuto = true;  // 标记为自动判断
                    // endStroke 不再自动设置，由 renderChar 中的倒查逻辑正确计算
                    // 原因：囗结构的字（如恩=囗+大+心）封口位置不固定，不能用硬编码
                } else if (wubi._supAuto) {
                    // 自动设置的sup与当前检测结果矛盾，清除
                    wubi.sup = [];
                    delete wubi._supAuto;
                }
            }
        } else {
            roots = [];
            rootCode = '—';
        }

        // 手动指定的 strokeRootMap（优先级最高，覆盖自动计算）
        if (customOrder && customOrder.strokeRootMap && customOrder.strokeRootMap.length === strokes.length) {
            strokeRootMap = [...customOrder.strokeRootMap];
            strokeRootMapForDisplay = [...strokeRootMap];
            applyShaDianPieSwap();
        } else {
            initStrokeRootMap();
            applyYouNCFix(currentChar, WUBI[currentChar], roots, strokeRootMap, strokes.length);
            strokeRootMapForDisplay = [...strokeRootMap];
            applyShaDianPieSwap();
        }
        if (char === '酱') console.log('[DEBUG酱] strokes.length=', strokes.length, 'strokeRootMap=', JSON.stringify(strokeRootMap));
        if (char === '迈') console.log('[DEBUG迈] init后 strokeRootMap=', JSON.stringify(strokeRootMap));
        if (char === '戊') console.log('[DEBUG戊] init后 strokeRootMap=', JSON.stringify(strokeRootMap), 'roots=', JSON.stringify(roots));
        if (char === '成') console.log('[DEBUG成] init后 strokeRootMap=', JSON.stringify(strokeRootMap), 'roots=', JSON.stringify(roots));
        // ========== swapScope:'roots' 的单字整体末两笔交换 ==========
        // 此分支处理报户口字符（力、乃等），报户口字根覆盖全部笔画，
        // 物理交换笔画顺序使显示与标准笔顺一致
        // 非连续字根已通过 autoDetectNonContinuous 统一处理，不走此路径
        // 分、切排除：它们的刀是直接字根，由复合字交换循环处理，避免双重交换
        if (customOrder && customOrder.swapLast && customOrder.swapScope === 'roots' && strokes.length >= 2 && currentChar !== '刀' && currentChar !== '分' && currentChar !== '切') {
            const n = strokes.length;
            // 只交换物理笔画顺序（strokes），不交换 strokeRootMap
            // strokeRootMap 按字根顺序对应笔画索引，交换 strokes 后映射关系自动正确
            [strokes[n-2], strokes[n-1]] = [strokes[n-1], strokes[n-2]];
            if (NON_CONTINUOUS_CHARS.has(currentChar)) {
                // 非连续字：需要同步交换 strokeRootMap 以保持字根-笔画对应
                [strokeRootMap[n-2], strokeRootMap[n-1]] = [strokeRootMap[n-1], strokeRootMap[n-2]];
                strokeRootMapForDisplay = [...strokeRootMap];
            } else {
                // 报户口字（力、乃等）：只交换物理笔画，不交换 strokeRootMap
                // strokeRootMap 保持原始映射，交换 strokes 后自动匹配正确字根
                strokeRootMapForDisplay = [...strokeRootMap];
            }
        }

        // ========== 复合字：基字部分末两笔交换 ==========
        // 如果当前字的某个字根本身是 CUSTOM_STROKE_ORDER 中的 swapLast 字，
        // 则只交换该字根部分的末两笔，不交换整体字的末两笔
        // 例：利=禾+刂，力有swapLast → 只交换力部分的末两笔
        if (wubi && wubi.r) {
            // 构建原始字根索引→展开后字根索引的映射
            // strokeRootMap 用的是展开后的字根索引，而循环用 wubi.r 的原始索引
            // 当前置字根被展开时（如歹→一+夕），后续字根的展开索引会偏移
            const _origToExpIndices = {};
            let _expIdxCounter = 0;
            const _KEY_NAMES_SET_SWAP = new Set(Object.values(keyNamesDisplay));
            for (let _ori = 0; _ori < wubi.r.length; _ori++) {
                const _origRoot = wubi.r[_ori];
                const _origWubi = WUBI[_origRoot];
                if (_origWubi && _origWubi.r && _origWubi.r.length >= 2
                    && _origWubi.r[0] !== _origRoot
                    && !_KEY_NAMES_SET_SWAP.has(_origRoot)
                    && !RADICAL_CHARS.has(_origRoot)
                    && _origRoot !== currentChar) {
                    const _expanded = recursivelyExpandRoots([_origRoot], currentChar);
                    const _indices = [];
                    for (let _k = 0; _k < _expanded.length; _k++) {
                        _indices.push(_expIdxCounter++);
                    }
                    _origToExpIndices[_ori] = _indices;
                } else {
                    _origToExpIndices[_ori] = [_expIdxCounter++];
                }
            }

            let strokeOffset = 0;  // 当前笔画偏移量
            for (let ri = 0; ri < wubi.r.length; ri++) {
                const rootChar = wubi.r[ri];
                let rootStrokeCount = RADICAL_STROKES[rootChar] || 1;
                // 但字根可能进一步递归展开，需要算完整笔画数
                const rootWubi = WUBI[rootChar];
                if (rootWubi && rootWubi.r  && !RADICAL_CHARS.has(rootChar) && rootWubi.r[0] !== rootChar && !RADICAL_CHARS.has(rootChar) && rootChar !== currentChar) {
                    const supSet = new Set(rootWubi.sup || []);
                    // 用展开后的子字根算笔画数
                    const expandedSubRoots = rootWubi.r.filter((_, idx) => !supSet.has(idx));
                    rootStrokeCount = 0;
                    for (const sr of expandedSubRoots) {
                        rootStrokeCount += RADICAL_STROKES[sr] || 1;
                    }
                }
                // 检查该字根是否有 swapLast（只处理非当前字本身的字根，避免双重交换）
                // 分/切内部已经会递归到刀并执行刀的 swapLast；父级分/切不再提前交换，避免两次交换互相抵消
                const rootCustomOrder = CUSTOM_STROKE_ORDER[rootChar];
                let needsSwap = false;
                if (rootCustomOrder && rootCustomOrder.swapLast && rootWubi && rootCustomOrder.condition(rootWubi, currentChar) && rootChar !== currentChar
                    && rootChar !== '分' && rootChar !== '切') {
                    needsSwap = true;
                }
                if (needsSwap) {
                    // 交换该字根部分的末两笔
                    if (rootStrokeCount >= 2) {
                        const i1 = strokeOffset + rootStrokeCount - 2;
                        const i2 = strokeOffset + rootStrokeCount - 1;
                        if (rootChar === '戈') console.log('[DEBUG戈swap] currentChar=', currentChar, 'strokeOffset=', strokeOffset, 'rootStrokeCount=', rootStrokeCount, 'i1=', i1, 'i2=', i2, 'strokesLen=', strokes.length);
                        // 交换 strokes
                        if (currentChar === '迈') console.log('[DEBUG迈] rootChar=', rootChar, 'rootStrokeCount=', rootStrokeCount, 'i1=', i1, 'i2=', i2, 'strokeRootMap[i1,i2]=', strokeRootMap[i1], strokeRootMap[i2], 'strokes[i1,i2].id前=', strokes[i1]?.id, strokes[i2]?.id);
                        // 交换 strokes 和 strokeRootMap（使颜色映射与物理笔画顺序一致）
                        // 仅当两笔都属于当前字根时才交换（非连续字根会分散到其他位置）
                        // 注意：strokeRootMap 用的是展开后的字根索引，需用映射转换
                        const _expIdxForRi = _origToExpIndices[ri] || [ri];
                        if (_expIdxForRi.includes(strokeRootMap[i1]) && _expIdxForRi.includes(strokeRootMap[i2])) {
                            [strokes[i1], strokes[i2]] = [strokes[i2], strokes[i1]];
                            [strokeRootMap[i1], strokeRootMap[i2]] = [strokeRootMap[i2], strokeRootMap[i1]];
                            strokeRootMapForDisplay = [...strokeRootMap];
                        }
                        if (currentChar === '迈') console.log('[DEBUG迈] strokes[i1,i2].id后=', strokes[i1]?.id, strokes[i2]?.id);
                    }
                }
                // 字根被展开时，递归检查子字根是否有 swapLast
                // 例：励=['厉','力']，力有swapLast，在力部分交换
                // 注意：NON_CONTINUOUS_CHARS 中的字根（如或）已走非连续映射，不触发 swapLast
                if (rootWubi && rootWubi.r && !RADICAL_CHARS.has(rootChar) && rootWubi.r[0] !== rootChar && rootChar !== currentChar
                    && !NON_CONTINUOUS_CHARS.has(rootChar)) {
                    const supSet2 = new Set(rootWubi.sup || []);
                    const subRoots = rootWubi.r.filter((_, idx) => !supSet2.has(idx));
                    let subOffset = strokeOffset;
                    for (const sr of subRoots) {
                        // 如果 sr 本身是 WUBI 字典中的可拆分汉字，递归展开子字根算笔画
                        const srWubi = WUBI[sr];
                        let srStrokeCount = RADICAL_STROKES[sr];
                        if (srStrokeCount === undefined && srWubi && srWubi.r && !RADICAL_CHARS.has(sr)) {
                            srStrokeCount = 0;
                            for (const subSr of srWubi.r) {
                                srStrokeCount += RADICAL_STROKES[subSr] || 1;
                            }
                        }
                        srStrokeCount = srStrokeCount || 1;
                        const srCustom = CUSTOM_STROKE_ORDER[sr];
                        let srNeedsSwap = false;
                        // 检查CUSTOM_STROKE_ORDER配置
                        if (srCustom && srCustom.swapLast && srWubi && srCustom.condition(srWubi, currentChar) && sr !== currentChar) {
                            srNeedsSwap = true;
                        }
                        if (srNeedsSwap && srStrokeCount >= 2) {
                                const i1 = subOffset + srStrokeCount - 2;
                                const i2 = subOffset + srStrokeCount - 1;
                                // 交换strokes数组和strokeRootMap，使颜色映射与物理笔画顺序一致
                                [strokes[i1], strokes[i2]] = [strokes[i2], strokes[i1]];
                                [strokeRootMap[i1], strokeRootMap[i2]] = [strokeRootMap[i2], strokeRootMap[i1]];
                                strokeRootMapForDisplay = [...strokeRootMap];
                            }
                        // 更新subOffset，确保后续子字根的交换位置正确
                        subOffset += srStrokeCount;
                        }
                }
                strokeOffset += rootStrokeCount;
            }
        }

        // DEBUG 励
        if (currentChar === '励') {
            console.log('[DEBUG励] strokeRootMap=' + JSON.stringify(strokeRootMap));
            console.log('[DEBUG励] strokeRootMapForDisplay=' + JSON.stringify(strokeRootMapForDisplay));
            console.log('[DEBUG励] roots=' + JSON.stringify(roots));
            console.log('[DEBUG励] strokes.length=' + strokes.length);
        }

        // 渲染
        highlightStroke = -1;
        // 渲染之前才标记就绪，防止页面加载时的默认值触发跳转
        appReady = true;

        renderInfo();  // 先构建strokeColorMap
        
        // 检查字根着色区与五笔编码区的一致性
        checkRootCodeConsistency();
        
        renderSVG();   // 再渲染SVG
        renderAssignment();
        renderKeyboard();
        renderCharLibrary();
        // 对比模式开启时，同步刷新三版对比面板
        if (compareModeActive && typeof renderCompareMode === 'function') renderCompareMode();

        // 首次渲染完成后立即隐藏加载动画（笔划数据在后台继续加载）
        const _loader = document.getElementById('app-loader');
        if (_loader && !_loader.classList.contains('fade-out')) {
            const _hideLoader = () => {
                if (window._loaderTipTimer) { clearInterval(window._loaderTipTimer); window._loaderTipTimer = null; }
                _loader.classList.add('fade-out');
                setTimeout(() => { if (_loader.parentNode) _loader.parentNode.removeChild(_loader); }, 700);
            };
            _hideLoader();
        }

        // 记录当前目标字，等待用户验证
        clearFeedback();

    } catch (e) {
        svg.innerHTML = `<text x="512" y="512" text-anchor="middle" dominant-baseline="central" fill="#e74c3c" font-size="18">${e.message}</text>`;
        // 出错时也要隐藏加载动画
        const _loader = document.getElementById('app-loader');
        if (_loader && !_loader.classList.contains('fade-out')) {
            const _hideLoader = () => {
                if (window._loaderTipTimer) { clearInterval(window._loaderTipTimer); window._loaderTipTimer = null; }
                _loader.classList.add('fade-out');
                setTimeout(() => { if (_loader.parentNode) _loader.parentNode.removeChild(_loader); }, 700);
            };
            _hideLoader();
        }
        pendingChar = '';
        clearFeedback();
    }
}


// ==================== 递归展开字根（全局） ====================
function recursivelyExpandRoots(rootList, excludeChar) {
    // 防御：确保 rootList 是可迭代的数组
    if (!Array.isArray(rootList)) {
        console.error('[recursivelyExpandRoots] rootList 不是数组！', { rootList, excludeChar, currentChar });
        return [];
    }
    const KEY_NAMES_SET = new Set(Object.values(keyNamesDisplay));
    let changed = true;
    let iterations = 0;
    while (changed && iterations < 5) {
        changed = false;
        iterations++;
        const next = [];
        for (const root of rootList) {
            const wubiEntry = WUBI[root];
            if (wubiEntry && wubiEntry.r && wubiEntry.r.length >= 2
                && wubiEntry.r[0] !== root
                && !KEY_NAMES_SET.has(root)
                && !RADICAL_CHARS.has(root)
                && root !== excludeChar) {
                // 不根据组件自身的sup过滤子字根
                // sup只对该字本身有意义（识别码），不影响其在其他字中的展开
                // 例如母=XGUI有sup=[3](识别码I)，但在海=氵+每中展开时⺀仍应保留
                next.push(...wubiEntry.r);
                changed = true;
            } else {
                next.push(root);
            }
        }
        rootList = next;
    }
    return rootList;
}

// ==================== 支持非连续字根递归嵌入的笔画映射 ====================
/**
 * 构建笔画→字根映射，支持递归处理非连续字根（如可、兆等）
 * 当字根列表中含有 NON_CONTINUOUS_CHARS 中的字符时，
 * 自动调用 autoDetectNonContinuous 生成正确的非连续映射，
 * 而非简单的连续分配。
 * @param {string[]} rootList - 字根列表（未展开，含非连续字根）
 * @param {number} startIndex - 起始索引（全局 expandedRoots 中的起始位置）
 * @returns {number[]} strokeRootMap 片段
 */
function buildEmbeddedMap(rootList, startIndex) {
    const map = [];
    let idx = startIndex;
    const KEY_NAMES_SET = new Set(Object.values(keyNamesDisplay));

    // 递归处理单个字根：在每一层都检查NC字符（如母、酉），
    // 确保嵌套在复合字根中的NC子字根也能正确应用非连续映射。
    // 例如：繁=敏+糸，敏→每+攵，每→𠂉+母，母是NC字符需要夹心映射
    function processRoot(root) {
        // 若某个可展开部件有完整的专用笔画→子字根映射，作为复合字部件时也应继承。
        // 例：夜的末两笔归根顺序为 ...丶、夂；鹵的囗底横在部件最后但仍属囗。
        const directCustom = CUSTOM_STROKE_ORDER[root];
        const directWubi = WUBI[root];
        if (directCustom && directCustom.strokeRootMap && directWubi && directWubi.r && directWubi.r.length >= 2
            && directCustom.condition(directWubi) && !RADICAL_CHARS.has(root)) {
            const subRoots = recursivelyExpandRoots(directWubi.r);
            const subN = subRoots.reduce((s, r) => s + (RADICAL_STROKES[r] || 1), 0);
            if (directCustom.strokeRootMap.length === subN) {
                for (const v of directCustom.strokeRootMap) map.push(v === -1 ? -1 : v + idx);
                idx += subRoots.length;
                return;
            }
        }

        // 检查是否为非连续字根（如可、兆、万、母等）
        // 止：单独成字时走非连续；作为复合字的一部分时按4笔连续分配
        // 成字字根（RADICAL_CHARS中的NC字根，如戈）：作为复合字子字根时走连续分配，
        // 因autoDetectNonContinuous的hasShaDianPie分支会将戈的子笔画分配为不同字根索引
        if (root !== '止' && NON_CONTINUOUS_CHARS.has(root) && !RADICAL_CHARS.has(root) && WUBI[root] && WUBI[root].r && WUBI[root].r.length >= 2) {
            let subRoots = recursivelyExpandRoots(WUBI[root].r);
            // 报户口字（如戈=r[0]===root）：过滤掉报户口自身，只取实际笔画子根
            if (subRoots.length > 0 && subRoots[0] === root) {
                subRoots = subRoots.slice(1);
            }
            const subN = subRoots.reduce((s, r) => s + (RADICAL_STROKES[r] || 1), 0);
            // 传入 isEmbedded=true，确保"來"等NC字根作为子字根时走嵌入式映射
            // 如麥=來+夂中，來应使用 [0,0,1,1,2,2,0,0] 而非独立映射 [0,1,1,2,2,0,0,0]
            const subMap = autoDetectNonContinuous(root, subRoots, subN, (WUBI[root].sup || []), idx, true);
            if (subMap && subMap.length === subN) {
                for (const v of subMap) map.push(v);
                idx += subRoots.length;  // 增加字根数（非笔画数），确保后续字根索引正确
                return;
            }
        }
        // 检查是否为可展开的复合字根（一层展开后递归处理）
        const wubiEntry = WUBI[root];
        if (wubiEntry && wubiEntry.r && wubiEntry.r.length >= 2
            && wubiEntry.r[0] !== root
            && !KEY_NAMES_SET.has(root)
            && !RADICAL_CHARS.has(root)) {
            // 复合字根：展开一层，对每个子字根递归处理
            let oneLevel = wubiEntry.r;
            // 报户口字根：过滤掉自身
            if (oneLevel.length > 1 && oneLevel[0] === root) {
                oneLevel = oneLevel.slice(1);
            }
            for (const subRoot of oneLevel) {
                processRoot(subRoot);
            }
            return;
        }
        // 简单字根：按笔画数连续分配
        const sc = RADICAL_STROKES[root] || 1;
        for (let j = 0; j < sc; j++) map.push(idx);
        idx++;
    }

    for (const root of rootList) {
        processRoot(root);
    }
    return map;
}

// ==================== ㇂+丶+丿 末两笔交换（统一处理）====================
// 当展开后的 roots 末三字根为 ㇂+丶+丿 时，交换末两个字根的笔画映射
// 适用于所有路径：成、戊、臧、茂、藏、篾 等
// 排除成字字根（戈、戋、戊等），它们由 CUSTOM_STROKE_ORDER 或 autoDetectNonContinuous 单独处理
function applyShaDianPieSwap() {
    if (!strokeRootMap || strokeRootMap.length === 0) return;
    if (!roots || roots.length < 2) return;
    // 排除成字字根：戈、戋、戊 有独立的交换逻辑（CUSTOM_STROKE_ORDER 或 autoDetectNonContinuous）
    if (RADICAL_CHARS.has(currentChar)) return;

    // 情况1：roots末三位是 ㇂+丶+丿（字根已展开的情况）
    const last3 = roots.slice(-3);
    if (last3.length >= 3 && last3[0] === '㇂' && last3[1] === '丶' && last3[2] === '丿') {
        const lastRootIdx = roots.length - 1;
        const secondLastRootIdx = roots.length - 2;
        for (let si = 0; si < strokeRootMap.length; si++) {
            if (strokeRootMap[si] === lastRootIdx) {
                strokeRootMap[si] = secondLastRootIdx;
            } else if (strokeRootMap[si] === secondLastRootIdx) {
                strokeRootMap[si] = lastRootIdx;
            }
        }
        strokeRootMapForDisplay = [...strokeRootMap];
        return;
    }

}

// ==================== 初始化笔画→字根映射 ====================
// 判断base+suffix复合字是否为左右结构（基字在左）
// 通过DOM获取笔画实际渲染边界框，比较基字与后缀的X质心
function isLeftRightCompound(strokes, baseStrokeCount) {
    // 先查已知左右结构字（來+貝=賚是左右，來+夂=麥是上下）
    const LR_SET = new Set(['賚']);
    if (LR_SET.has(currentChar)) return true;
    const TB_SET = new Set(['麥']);
    if (TB_SET.has(currentChar)) return false;
    // 后备：通过DOM的getBBox比较基字与后缀的X质心
    const pathElems = document.querySelectorAll('#char-svg path');
    if (pathElems.length < strokes.length) return false;
    let baseXSum = 0, baseXCount = 0, suffixXSum = 0, suffixXCount = 0;
    for (let i = 0; i < pathElems.length && i < strokes.length; i++) {
        const bb = pathElems[i].getBBox();
        const cx = bb.x + bb.width / 2;
        if (i < baseStrokeCount) {
            baseXSum += cx * bb.width * bb.height;
            baseXCount += bb.width * bb.height;
        } else {
            suffixXSum += cx * bb.width * bb.height;
            suffixXCount += bb.width * bb.height;
        }
    }
    if (baseXCount === 0 || suffixXCount === 0) return false;
    const baseCentroidX = baseXSum / baseXCount;
    const suffixCentroidX = suffixXSum / suffixXCount;
    // 后缀X质心明显在基字右侧 → 左右结构
    return suffixCentroidX > baseCentroidX + 100;
}

/**
 * 酉字非连续修正（通用后处理）
 * 酉展开为[西,一]，7笔：西(0-4,6) + 一(5)
 * 连续分配会错误地将前6笔给西、末笔给一，需要交换第6和第7笔的字根归属
 * 适用于任何含酉部件的复合字，无论走哪条映射路径
 */
function applyYouNCFix(currentChar, wubiData, roots, strokeRootMap, n) {
    if (currentChar === '酉') return; // 酉字本身由专用映射处理
    const origRoots = wubiData?.r || [];
    if (!origRoots.includes('酉')) return;

    // 在展开后的roots中定位酉的起始位置
    let youRootStart = -1;
    let cursor = 0;
    for (const origRoot of origRoots) {
        if (origRoot === '酉') { youRootStart = cursor; break; }
        const expanded = recursivelyExpandRoots([origRoot], currentChar);
        cursor += expanded.length;
    }
    if (youRootStart < 0) return;
    if (youRootStart + 1 >= roots.length) return;
    if (roots[youRootStart] !== '西' || roots[youRootStart + 1] !== '一') return;

    // 计算酉部件的笔画起始位置
    let youStrokeStart = 0;
    for (let ri = 0; ri < youRootStart; ri++) {
        youStrokeStart += (RADICAL_STROKES[roots[ri]] || 1);
    }
    // 酉共7笔，第6笔(index 5)→一, 第7笔(index 6)→西
    if (youStrokeStart + 6 < n) {
        strokeRootMap[youStrokeStart + 5] = youRootStart + 1;  // 一
        strokeRootMap[youStrokeStart + 6] = youRootStart;      // 西
    }
}

function initStrokeRootMap() {
    
    // 防御：确保 roots 是数组
    if (!Array.isArray(roots)) {
        console.warn('[initStrokeRootMap] roots 不是数组，已重置为空数组。currentChar=' + currentChar);
        roots = [];
    }
    // 防御：确保 currentChar 有值
    if (!currentChar) {
        strokeRootMap = [];
        strokeRootMapForDisplay = [];
        return;
    }

    const n = strokes.length;
    const rootCount = roots.length;
    const wubiData = WUBI[currentChar];
    const supIndices = wubiData?.sup || [];

    if (rootCount === 0) {
        strokeRootMap = strokes.map((_, i) => i % ROOT_COLORS.length);
        strokeRootMapForDisplay = [...strokeRootMap];
        return;
    }

    if (rootCount === 1) {
        strokeRootMap = strokes.map(() => 0);
        strokeRootMapForDisplay = [...strokeRootMap];
        return;
    }

    // ========== 非连续白名单提前处理 ==========
    // 如啬=土+丷+回、丧=土+丷+艮下，虽然部分字根有包围/复合结构，
    // 但整体笔顺是非连续的，必须在复合检测之前处理，避免被囗检测或prefix+base拦截
    // 注：十+戈仅在字首（索引0或1）相邻时才视为包围结构（哉/栽/截/戴）；
    // 戰=口+口+曰+十+戈 中十在索引3、戈在索引4，属字尾正常顺序，不应触发非连续映射
    // 戈非末字根模式（如職=耳+立头+戈+日）：戈在中间位置（非首字根）包裹后续字根，也需走非连续映射
    // 注：仅在戈不是首字根时触发，避免划(戈+刂)等左右结构误判
    
    // ===== 韱系列字专用处理 =====
    // 韱=从+戈+韭，戈包裹韭（末3笔是戈，中间是韭的笔画）
    // 含韱作为基字的复合字（懺/殲/籤/纖/讖/谶）也需同样的非连续映射
    // 条件：展开后的roots含 三+〢+三（韭的展开特征）且含戈
    const _xExpandedRoots = recursivelyExpandRoots(roots);
    if (_xExpandedRoots.includes('戈') && _xExpandedRoots.some((_, i) => i + 2 < _xExpandedRoots.length && _xExpandedRoots[i] === '三' && _xExpandedRoots[i+1] === '〢' && _xExpandedRoots[i+2] === '三')) {
        // 直接复用韱字的autoDetectNonContinuous，再按前缀偏移
        const _zanExpanded = recursivelyExpandRoots(['韱']);
        const _zanN = _zanExpanded.reduce((s, r) => s + (RADICAL_STROKES[r] || 1), 0);
        const _zanMap = autoDetectNonContinuous('韱', _zanExpanded, _zanN, [], 0);
        if (_zanMap && _zanMap.length === _zanN && !_zanMap.includes(-1)) {
            // 前缀处理：找到韱部分（从+戈+韭）在原始roots中的起始位置
            const _origRoots = WUBI[currentChar]?.r || roots;
            const _congIdx = _origRoots.indexOf('从');
            if (_congIdx >= 0) {
                // 前缀roots = 从之前的所有原始roots
                const _prefixRoots = _origRoots.slice(0, _congIdx);
                const _prefixExpanded = recursivelyExpandRoots(_prefixRoots);
                // 前缀srm：用buildEmbeddedMap正确分配每个字根的笔画
                const _prefixMap = buildEmbeddedMap(_prefixExpanded, 0);
                // 偏移 = 前缀使用的最大字根索引 + 1（韱本身无前缀，offset=0）
                const _offset = _prefixMap.length > 0 ? (Math.max(..._prefixMap) + 1) : 0;
                const fullMap = [];
                for (const v of _prefixMap) fullMap.push(v);
                // 韱部分：复用韱的映射，加上前缀偏移
                for (let i = 0; i < _zanMap.length; i++) {
                    fullMap.push(_zanMap[i] + _offset);
                }
                if (fullMap.length === n) {
                    strokeRootMap = fullMap;
                    strokeRootMapForDisplay = [...strokeRootMap];
                    return;
                }
            }
        }
    }
    
    // 含囗的字跳过戈在中间的NC检查，由囗检测路径处理（囗封口笔在最后，NC映射会错位）
    // 戈条件改为检查原始字根(wubiData.r)，避免复合字根展开产生的戈（如戔→戈戈、伐→亻戈）误触发包裹映射
    // 同时也检查展开后字根中是否有戈在中间位置（如蘵=艹+職→艹+耳+立头+戈+日，戈来自職的展开）
    // 排除含囗的字（如蟈=虫+國→虫+囗+戈+口+㇀），囗结构需由专门的囗检测路径处理

                return c;
            });

            const totalFinal = finalCounts.reduce((s, c) => s + c, 0);
            if (totalFinal === n) {
                strokeRootMap = buildMapFromCounts(finalCounts);
                strokeRootMapForDisplay = [...strokeRootMap];
                return;
            }
        }
    }


}  // initStrokeRootMap 结束


// ==================== SVG 渲染 ====================
function renderSVG() {
    const svg = document.getElementById('char-svg');
    svg.innerHTML = '';

    // 白色背景
    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('width', '1024');
    bg.setAttribute('height', '1024');
    bg.setAttribute('fill', '#fff');
    svg.appendChild(bg);

    // 创建变换组（hanzi-writer-data的y轴向上，需要翻转并居中）
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', 'translate(0, 900) scale(1, -1)');
    svg.appendChild(g);

    // 补码判断（仅用于小框着色，大框用字根颜色）
    const wubiDataForColor = WUBI[currentChar];
    const supIndicesForColor = wubiDataForColor?.sup || [];
    const endStrokeIdx = wubiDataForColor?.endStroke;
    const hasSup = supIndicesForColor.length > 0;

    // 绘制笔画
    const guiStrokeStart = strokes._guiStrokeStart;
    strokes.forEach((d, i) => {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);

        const isHighlighted = highlightStroke === -1 || highlightStroke === i;
        // 使用统一颜色函数，确保与编码区、字根区一致
        const color = getStrokeColor(i);
        const isNonRoot = strokeRootMap[i] === undefined || strokeRootMap[i] < 0;
        // 龜的笔画加粗
        const isGuiStroke = guiStrokeStart !== undefined && i >= guiStrokeStart;
        let strokeWidth = isGuiStroke ? 1.5 : (isNonRoot ? 0.3 : 0.5);
        // 按笔画索引缩放宽度（如X缩窄后的入字根加粗）
        const widthScale = strokes._strokeWidthScale;
        if (widthScale && widthScale[i]) strokeWidth *= widthScale[i];

        if (isHighlighted) {
            path.setAttribute('fill', color);
            path.setAttribute('stroke', isNonRoot ? '#444' : '#333');
            path.setAttribute('stroke-width', highlightStroke === -1 ? strokeWidth : 1.5);
        } else {
            path.setAttribute('fill', isNonRoot ? '#777' : '#e8e8e8');
            path.setAttribute('stroke', isNonRoot ? '#666' : '#ccc');
            path.setAttribute('stroke-width', strokeWidth);
        }

        path.style.cursor = 'pointer';
        path.style.transition = 'fill 0.25s ease';
        path.dataset.strokeIndex = i;

        // 点击笔画 → 弹出字根选择
        path.addEventListener('click', (e) => {
            e.stopPropagation();
            showStrokeSelector(i, e);
        });

        g.appendChild(path);
    });

    // ========== 补码小框渲染 ==========
    const miniBox = document.getElementById('sup-mini-box');
    const miniSvg = document.getElementById('sup-mini-svg');
    
    // 自动判断：有sup就显示补码小框
    // 补码规则：有囗则取囗内部首的最后一笔，无囗则取整个字的最后一笔
    let actualEndStroke = strokes.length - 1;  // 默认取最后一笔
    if (endStrokeIdx !== undefined) {
        actualEndStroke = endStrokeIdx;
    } else if (wubiDataForColor?.r && Array.isArray(wubiDataForColor.r)) {
        // ========== 囗/匚 包围结构特殊处理 ==========
        const charRoots = wubiDataForColor.r;
        
        // 【囗】结构：取非囗字根的最后一笔
        if (charRoots.includes('囗')) {
            const weiIdx = charRoots.indexOf('囗');
            let lastNonWeiStroke = -1;
            for (let i = strokes.length - 1; i >= 0; i--) {
                const rootIdx = strokeRootMap[i];
                if (rootIdx !== undefined && rootIdx !== weiIdx && rootIdx >= 0) {
                    lastNonWeiStroke = i;
                    break;
                }
            }
            if (lastNonWeiStroke >= 0) actualEndStroke = lastNonWeiStroke;
        }
        // 【匚】外框包围结构：取内部字根的最后一笔
        // 注意：必须用展开后的全局 roots（包含匚），不能用 wubiDataForColor.r（原始的可能是['氵','区']）
        // 规则：含【匚】的字 → 补码/识别码笔画取匚内字根的末笔
        // 如【区】AQI（3码+识别码I，取乂末笔丶）
        // 如【沤】IAQY（4码，第4位Y=识别码，取乂末笔丶）
        if (hasSup && (roots||[]).includes('匚')) {
            const fuIdx = roots.indexOf('匚');  // 用全局展开后的 roots
            // 取非匚字根的最后一笔（即内部字根的末笔）
            let lastInnerStroke = -1;
            for (let i = strokes.length - 1; i >= 0; i--) {
                const rootIdx = strokeRootMap[i];
                if (rootIdx !== undefined && rootIdx !== fuIdx && rootIdx >= 0) {
                    lastInnerStroke = i;
                    break;
                }
            }
            if (lastInnerStroke >= 0) actualEndStroke = lastInnerStroke;
        }

        }

    // ========== 基于 swap 后 strokeRootMap 定位末笔 ==========
    // ========== 辶/廴 半包围结构补码小框高亮定位 ==========
    // 规则：含辶/廴的字，补码高亮应指向被包围部分的末笔
    // 如【过】FPI → 高亮寸的末笔；【辽】BPK → 高亮了(竖)的末笔
    // 对于非连续字根（如万、兆），末笔应取最后一个字根（最大rootIdx）的末笔，
    // 而非视觉最后一笔（非连续字根的视觉末笔可能属于较早的字根）
    const walkRoots = (roots||[]);
    const walkIdx = walkRoots.indexOf('辶') !== -1 ? walkRoots.indexOf('辶') : (walkRoots.indexOf('廴') !== -1 ? walkRoots.indexOf('廴') : -1);
    if (walkIdx !== -1 && strokeRootMap && strokeRootMap.length > 0) {
        // 找到最后一个非辶/廴的字根索引（最大rootIdx）
        let maxInnerRootIdx = -1;
        for (let i = 0; i < strokes.length; i++) {
            const rootIdx = strokeRootMap[i];
            if (rootIdx !== undefined && rootIdx !== walkIdx && rootIdx >= 0) {
                if (rootIdx > maxInnerRootIdx) maxInnerRootIdx = rootIdx;
            }
        }
        let innerLast = -1;
        if (maxInnerRootIdx >= 0) {
            // 非连续字根：取最后一个字根的末笔（如迈→㇆，逃→乚）
            for (let i = strokes.length - 1; i >= 0; i--) {
                if (strokeRootMap[i] === maxInnerRootIdx) {
                    innerLast = i;
                    break;
                }
            }
        }
        if (innerLast < 0) {
            // 回退：最后一个非辶/廴的视觉笔画
            for (let i = strokes.length - 1; i >= 0; i--) {
                const rootIdx = strokeRootMap[i];
                if (rootIdx !== undefined && rootIdx !== walkIdx && rootIdx >= 0) {
                    innerLast = i;
                    break;
                }
            }
        }
        if (innerLast >= 0) actualEndStroke = innerLast;
    }

    // ========== swap 后补码定位修正 ==========
    // 当末字根有 swapLast 时，末两笔被交换，hardcode 取最后一笔会指错
    // 用 strokeRootMap 找到最后一个属于末字根的笔画
    // 例外：末字根为辶/廴时，补码应指向被包围部分末笔（已由上方逻辑处理），此处不覆盖
    if (strokeRootMap && strokeRootMap.length > 0 && (roots||[]).length > 0 && hasSup) {
        const lastRootIdx = roots.length - 1;
        const lastRootChar = roots[lastRootIdx];
        if (lastRootChar !== '辶' && lastRootChar !== '廴') {
            // 找到末字根的所有笔画
            let lastRootStrokes = [];
            for (let i = 0; i < strokes.length; i++) {
                if (strokeRootMap[i] === lastRootIdx) {
                    lastRootStrokes.push(i);
                }
            }
            
            // ===== 使用原始WUBI末字根做末两笔交换检测 =====
            // 展开后的roots中戈被拆成了一㇂丶丿等多个基本字根，
            // 丢了原始字根信息。用wubiData.r取原始末字根做检测
            const originalRoots = wubiDataForColor?.r || [];
            const lastOriginalRoot = originalRoots.length > 0
                ? originalRoots[originalRoots.length - 1] : lastRootChar;
            // 检查戈/戋钩后丶丿模式：同时检查原始末字根和展开后末字根
            // 戔→展开为[戈,戈]，原始末字根戔不匹配，但展开后末字根戈匹配
            const _checkGeHou = (rootName) => {
                const w = WUBI[rootName];
                return w && w.r && w.r.length >= 3
                    && (w.r.includes('㇂') || w.r.includes('乚'))
                    && w.r[w.r.length - 2] === '丶'
                    && w.r[w.r.length - 1] === '丿';
            };
            const hasGeHouPattern = currentChar !== '线' && (
                _checkGeHou(lastOriginalRoot) || _checkGeHou(lastRootChar)
            );
            
            if (hasGeHouPattern) {
                // 戈/戋类字根：末两笔为丶+丿，需确定丿的位置作为补码高亮
                // 不能用_getStrokeTypeFromPath判断，因为hanzi-writer数据中所有路径都以Z结尾
                // 改为检查swapLast是否已应用：swap后丿在末位(i2)，未swap则丿在倒数第二位(i1)
                if (lastRootStrokes.length >= 2) {
                    const i1 = lastRootStrokes[lastRootStrokes.length - 2]; // 倒数第二笔
                    const i2 = lastRootStrokes[lastRootStrokes.length - 1]; // 最后一笔
                    const lastRootCustom = CUSTOM_STROKE_ORDER[lastOriginalRoot];
                    const swapApplied = lastRootCustom && lastRootCustom.swapLast
                        && lastRootCustom.swapScope === 'roots'
                        && WUBI[lastOriginalRoot] && lastRootCustom.condition(WUBI[lastOriginalRoot], currentChar);
                    if (swapApplied) {
                        actualEndStroke = i2; // swap后丿在末位
                    } else {
                        actualEndStroke = i1; // 未swap，丿在倒数第二位（标准笔顺）
                    }
                } else {
                    actualEndStroke = strokes.length >= 2 ? strokes.length - 2 : strokes.length - 1;
                }
                console.log(`[补码DEBUG ${currentChar}] hasGeHouPattern=true, lastOriginalRoot=${lastOriginalRoot}, actualEndStroke=${actualEndStroke}, lastRootStrokes=${JSON.stringify(lastRootStrokes)}`);
                console.log(`[补码DEBUG2 ${currentChar}] roots=${JSON.stringify(roots)}, lastRootIdx=${lastRootIdx}, lastRootChar=${lastRootChar}, strokeRootMap=${JSON.stringify(strokeRootMap)}`);
            } else if (lastRootStrokes.length >= 2) {
                // 其他末字根取最后一笔
                actualEndStroke = lastRootStrokes[lastRootStrokes.length - 1];
            } else if (lastRootStrokes.length === 1) {
                actualEndStroke = lastRootStrokes[0];
            }
        }
    }

    // 彧：补码高亮取整个汉字的最后一笔（而不是末字根㇀的最后一笔）
    if (currentChar === '彧') {
        actualEndStroke = strokes.length - 1;
    }

    // 豖及含豖作为基字的字（啄、涿、琢、瘃、诼、冢、塚等）：
    // 豖的非连续映射使丶字根笔画在中间位置（第6笔），末字根丶的笔画不是最后一笔
    // 但识别码基于整字末笔，补码高亮应取最后一笔
    if (currentChar === '豖' ||
        (wubiDataForColor?.r || []).includes('豖') ||
        (wubiDataForColor?.r || []).includes('冢')) {
        actualEndStroke = strokes.length - 1;
    }

    // 龙及含龙作为末字根的字（珑、泷、咙、垅、宠、庞、拢、栊、眬、笼、胧、茏、陇等）：
    // 龙的补码V（匕末笔）对应倒数第三笔的乚（竖弯钩），而非末笔
    // 仅当龙是最后一个字根时才生效，聋(龙+耳)的末字根是耳，不应触发
    const _longRoots = wubiDataForColor?.r || [];
    const _longLastRoot = _longRoots.length > 0 ? _longRoots[_longRoots.length - 1] : '';
    if (currentChar === '龙' || _longLastRoot === '龙') {
        actualEndStroke = strokes.length - 3;
    }

    // 槤漣涟梿琏莲蓮链笾鏈等含连/連/边基字的字：
    // 补码高亮取整字最后一笔（辶的末笔），不取被辶包围部分的末笔
    if ((wubiDataForColor?.r || []).includes('连') ||
        (wubiDataForColor?.r || []).includes('連') ||
        (wubiDataForColor?.r || []).includes('边')) {
        actualEndStroke = strokes.length - 1;
    }

    // 调试输出：查看 actualEndStroke 的值
    console.log(`[补码小框DEBUG ${currentChar}] actualEndStroke=${actualEndStroke}, totalStrokes=${strokes.length}, hasSup=${hasSup}`);
    
    // 详细调试：输出末字根信息和末笔模式检测结果
    if (hasSup && strokeRootMap && strokeRootMap.length > 0 && (roots||[]).length > 0) {
        const _lrIdx = roots.length - 1;
        const _lrChar = roots[_lrIdx];
        const _lrStrokes = [];
        for (let _si = 0; _si < strokes.length; _si++) {
            if (strokeRootMap[_si] === _lrIdx) _lrStrokes.push(_si);
        }
        const _ow = WUBI[_lrChar];
        const _hasGHP = _ow && _ow.r && _ow.r.length >= 3
            && (_ow.r.includes('㇂') || _ow.r.includes('乚'))
            && _ow.r[_ow.r.length - 2] === '丶'
            && _ow.r[_ow.r.length - 1] === '丿';
        console.log(`[补码FULL ${currentChar}] roots=${JSON.stringify(roots)}, lastRootIdx=${_lrIdx}, lastRootChar="${_lrChar}", lastRootStrokes=${JSON.stringify(_lrStrokes)}, hasGeHouPattern=${_hasGHP}, strokesLen=${strokes.length}, strokeRootMap=${JSON.stringify(strokeRootMap)}`);
    }
    
    if (hasSup) {
        miniBox.style.display = 'block';
        miniSvg.innerHTML = '';
        
        // 白色背景
        const miniBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        miniBg.setAttribute('width', '1024');
        miniBg.setAttribute('height', '1024');
        miniBg.setAttribute('fill', '#fff');
        miniSvg.appendChild(miniBg);
        
        // 变换组
        const miniG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        miniG.setAttribute('transform', 'translate(0, 900) scale(1, -1)');
        miniSvg.appendChild(miniG);
        
        // 绘制笔画：末笔(补码)高亮，其他灰色
        strokes.forEach((d, i) => {
            if (currentChar === '战') console.log(`[战小框] stroke[${i}] i===actualEndStroke(${actualEndStroke})? ${i===actualEndStroke} d=${typeof d==='string' ? d.substring(0,50) : typeof d}`);
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', d);
            
            if (i === actualEndStroke) {
                // 末笔(补码)：青色高亮 + 加粗
                path.setAttribute('fill', '#00BCD4');  // Cyan500
                path.setAttribute('stroke', '#0097A7');  // Cyan700
                path.setAttribute('stroke-width', '10');
                path.setAttribute('stroke-linejoin', 'round');
                path.setAttribute('stroke-linecap', 'round');
            } else {
                // 非补码笔画：灰色
                path.setAttribute('fill', '#ccc');
                path.setAttribute('stroke', '#aaa');
                path.setAttribute('stroke-width', '0.5');
            }
            
            miniG.appendChild(path);
        });
    } else {
        miniBox.style.display = 'none';
    }

    // 更新笔画指示器
    document.getElementById('stroke-indicator').textContent =
        highlightStroke === -1
            ? `全部 ${strokes.length} 笔`
            : `第 ${highlightStroke + 1} / ${strokes.length} 笔`;
}

// ==================== 检查字根与编码一致性 ====================
function checkRootCodeConsistency() {
    if (!currentChar || !rootCode || rootCode === '—') return;
    
    const wubiData = WUBI[currentChar];
    if (!wubiData) return;
    
    const supIndices = wubiData.sup || [];
    const isSpecial = wubiData.special || false;
    const isKeyName = RADICAL_CHARS.has(currentChar);
    
    // 检查1：编码长度不能超过4
    const codeLen = rootCode.length;
    const rootsLen = roots.length;
    
    if (codeLen > 4) {
        console.error(`[错误] ${currentChar}: 编码长度${codeLen}>4，五笔最多4码`);
        console.error(`  编码: ${rootCode}`);
        console.error(`  修复建议: 取前3码+末1码: ${rootCode[0]}${rootCode[1]}${rootCode[2]}${rootCode[codeLen-1]}`);
    }
    
    // 检查2：字根数 > 4 时，编码应该只有4位
    if (rootsLen > 4 && codeLen !== 4) {
        console.error(`[错误] ${currentChar}: 字根数${rootsLen}>4，编码应该只有4位（前3+末1）`);
        console.error(`  编码: ${rootCode} (${codeLen}位)`);
        console.error(`  字根: ${JSON.stringify(roots)}`);
        console.error(`  修复建议: 编码改为 ${roots[0]}${roots[1]}${roots[2]}${roots[rootsLen-1]} 对应的编码`);
    }
    
    // 检查3：字根数 <= 4 时，编码长度应该等于字根数（或字根数+1，有补码时）
    // 键名字（如王GGGG）连按四下本键，codeLen=4 但 rootLen=1，跳过此检查
    if (!isKeyName && rootsLen <= 4 && codeLen !== rootsLen && codeLen !== rootsLen + 1) {
        console.warn(`[警告] ${currentChar}: 字根数${rootsLen}，编码长度${codeLen}，可能不匹配`);
        console.warn(`  编码: ${rootCode}`);
        console.warn(`  字根: ${JSON.stringify(roots)}`);
    }
    
    // 检查2：补码索引是否超出范围
    const maxSupIndex = Math.max(...supIndices, -1);
    if (maxSupIndex >= codeLen) {
        console.error(`[严重错误] ${currentChar}: 补码索引${maxSupIndex} 超出编码长度${codeLen}`);
        console.error(`  编码: ${rootCode} (索引0-${codeLen-1})`);
        console.error(`  补码索引: ${JSON.stringify(supIndices)}`);
        console.error(`  修复建议: 补码索引应该在 0-${codeLen-1} 范围内`);
        return;
    }
    
    // 检查3：编码区与字根区的数量是否对应
    // 编码区：非补码的编码数量
    let codeCount = 0;
    rootCode.split('').forEach((ch, i) => {
        const isSup = supIndices.includes(i);
        const isSpecialGray = isSpecial && i >= codeLen - 2;
        if (!isSup && !isSpecialGray) {
            codeCount++;
        }
    });
    
    // 字根区：非空字根、非补码的字根数量
    let rootCount = 0;
    roots.forEach((r, i) => {
        if (r !== '' && !supIndices.includes(i)) {
            rootCount++;
        }
    });
    
    // 报户口的字：第一个编码不计入字根
    if (isKeyName && codeCount > 0) {
        codeCount = codeCount - 1;
    }
    
    // 检查一致性（键名字四码同一键跳过；字根>4时取前3末1，编码数≠字根数是正常的）
    if (!isKeyName && codeCount !== rootCount && rootCount <= 4) {
        if (codeCount > rootCount && supIndices.length === 0) {
            // 编码数 > 字根数，但没有补码标记 → 自动检测会处理，仅debug级别提示
            // console.debug(`[补码提示] ${currentChar}: 编码${codeCount}个 > 字根${rootCount}个，补码将自动检测`);
        } else if (codeCount > rootCount) {
            // 有补码标记但数量仍不匹配
            console.warn(`[一致性警告] ${currentChar}: 编码区${codeCount}个 ≠ 字根区${rootCount}个 + 补码${supIndices.length}个`);
            console.warn(`  编码: ${rootCode}`);
            console.warn(`  字根: ${JSON.stringify(roots)}`);
            console.warn(`  补码: ${JSON.stringify(supIndices)}`);
        } else {
            // 编码数 < 字根数，可能是配置错误
            console.warn(`[一致性警告] ${currentChar}: 编码区${codeCount}个 < 字根区${rootCount}个`);
            console.warn(`  编码: ${rootCode}`);
            console.warn(`  字根: ${JSON.stringify(roots)}`);
            console.warn(`  补码: ${JSON.stringify(supIndices)}`);
        }
    }
}

// ==================== 信息渲染 ====================
function renderInfo() {
    // 补码索引
    const wubiData = WUBI[currentChar];
    const supIndices = wubiData?.sup || []; // 补码索引列表
    const isSpecial = wubiData?.special || false; // 特殊字（如乙NNLL）
    const isKeyName = RADICAL_CHARS.has(currentChar); // 成字字根
    
    // 构建颜色映射（供编码区、字根区使用）
    // 每个编码位置独立着色，补码用青色
    let colorIdx = 0;
    rootColorMap = {}; // 清空全局映射，重新构建
    const codeLen = rootCode ? rootCode.length : 0;
    if (rootCode && rootCode !== '—') {
        rootCode.split('').forEach((ch, i) => {
            const isSup = supIndices.includes(i);
            const isSpecialGray = isSpecial && i >= codeLen - 2;
            if (isSpecialGray) {
                rootColorMap[i] = '#999'; // 特殊字后两个用灰色
            } else if (isSup) {
                rootColorMap[i] = '#00BCD4';
            } else {
                rootColorMap[i] = ROOT_COLORS[colorIdx % ROOT_COLORS.length];
                colorIdx++;
            }
        });
    }

    // 构建字根索引→编码索引的映射（字根数 > 4 时：前3→前3，中间跳过，末→末）
    const rootToCodeIndex = [];
    
    // 每个编码位置按序号独立着色（1=红，2=蓝，3=绿，4=橙）
    // 注意：与rootToCodeIndex分开计算，互不干扰
    const colorIdxMap = rootCode.split('').map((_, i) => i);
    
    if (roots.length > 4) {
        // 检查 strokeRootMap 中是否有重复的字根索引（如㇂+丶+丿共享T键）
        const rootMapCounts = {};
        for (const ri of strokeRootMap) {
            rootMapCounts[ri] = (rootMapCounts[ri] || 0) + 1;
        }
        const hasRepeatedRoots = Object.values(rootMapCounts).some(c => c > 1);
        
        if (hasRepeatedRoots && roots.length <= codeLen) {
            // 有重复字根索引：按 strokeRootMap 中的实际映射来分配编码索引
            // 找出所有唯一的字根索引值，按顺序分配编码位置
            const uniqueRootIndices = Array.from(new Set(strokeRootMap.filter(r => r >= 0))).sort((a,b) => a-b);
            // 按字根索引升序排列，确保编码顺序与 roots 数组一致
            // 而不是按 strokeRootMap 的笔画顺序（swap后会扰乱）
            // uniqueRootIndices 是按笔画顺序出现的不重复字根索引
            // 例如 strokeRootMap=[0,0,1,2,4,4] → uniqueRootIndices=[0,1,2,4]
            // 编码索引分配：0→D(0), 1→N(1), 2→N(2), 4→T(3)
            const rootIndexToCodeIndex = {};
            let codePos = 0;
            for (const uri of uniqueRootIndices) {
                if (codePos < codeLen) {
                    rootIndexToCodeIndex[uri] = codePos;
                    codePos++;
                } else {
                    rootIndexToCodeIndex[uri] = -1;
                }
            }
            // 构建 rootToCodeIndex（按 roots 数组索引）
            for (let i = 0; i < roots.length; i++) {
                rootToCodeIndex.push(rootIndexToCodeIndex[i] !== undefined ? rootIndexToCodeIndex[i] : -1);
            }
        } else {
            // 无重复字根索引：原有逻辑
            for (let i = 0; i < 3; i++) rootToCodeIndex.push(colorIdxMap[i]);
            for (let i = 3; i < roots.length - 1; i++) rootToCodeIndex.push(-1);
            rootToCodeIndex.push(colorIdxMap[colorIdxMap.length - 1]);
        }
    } else {
        // roots.length <= 4：字根数等于或少于编码数
        // 当字根数少于编码数时（如歌=可+可+欠，3字根4键SKSW），
        // 最后一个字根对应末位编码（识别码），前面的字根按序对应

            if (roots.length === 1) {

            } else {
                // 字根数 < 编码数：按非补码编码位置映射
                // 战=HKAT, sup=[3]：非补码编码[H,K,A]，3字根→0,1,2
                // 歌=SKSW, sup=[]：非补码编码[S,K,S,W]，3字根→0,1,3(末位)
                const rootCodeIndices = [];
                for (let i = 0; i < codeLen; i++) {
                    if (!supIndices.includes(i)) rootCodeIndices.push(i);
                }
                for (let i = 0; i < roots.length - 1; i++) rootToCodeIndex.push(colorIdxMap[rootCodeIndices[i]]);
                rootToCodeIndex.push(colorIdxMap[rootCodeIndices[rootCodeIndices.length - 1]]);
            }
        } else {
            for (let i = 0; i < roots.length; i++) rootToCodeIndex.push(colorIdxMap[i]);
        }
    }

    // expandedRootToCodeIndex 直接使用 rootToCodeIndex
    // 因为 roots 已经是展开后的基本字根数组，rootToCodeIndex 的"前3+末1"规则
    // 直接对展开后的字根分配编码位，无需再展开
    const expandedRootToCodeIndex = [...rootToCodeIndex];
    const KEY_NAMES_SET = new Set(Object.values(keyNamesDisplay));
    const _isKeyNameRootSelf = WUBI[currentChar]?.r?.[0] === currentChar && !KEY_NAMES_SET.has(currentChar);

    // 复合字检测路径（prefix+base）的 buildEmbeddedMap 会递归展开NC子字根
    // （如 成→厂+㇆+㇂+丶+丿），产生超出 outer roots 展开范围的索引
    // 需要扩展 expandedRootToCodeIndex 以覆盖 strokeRootMapForDisplay 中的所有索引
    if (strokeRootMapForDisplay.length > 0) {
        const maxRi = Math.max(...strokeRootMapForDisplay.filter(v => v >= 0));
        while (expandedRootToCodeIndex.length <= maxRi) {
            // 溢出索引属于复合路径内部展开的根，使用最后一个编码索引
            expandedRootToCodeIndex.push(rootToCodeIndex[rootToCodeIndex.length - 1] || 0);

    // 建立 strokeRootMapForDisplay 值到 roots 数组索引的映射
    // （buildEmbeddedMap 可能使用与展开后 roots 不同的内部索引）
    const uniqueRiValues = [...new Set(strokeRootMapForDisplay.filter(v => v >= 0))].sort((a, b) => a - b);
    const riRemap = {};
    let _rootArrayIdx = 0;
    for (const _ri of uniqueRiValues) {
        riRemap[_ri] = _rootArrayIdx++;
    }
    strokeColorMap = strokes.map((_, strokeIdx) => {
        const ri = strokeRootMapForDisplay[strokeIdx];
        if (ri === undefined || ri < 0) return '#555'; // 非编码笔画灰色
        // 报户口字：ri 值对应 expandedRootToCodeIndex 中的根索引（跳过报户口根0）
        // 非报户口字：riRemap 将非连续的值压缩到从0开始的索引
        const ri2 = _isKeyNameRootSelf ? ri : (riRemap[ri] !== undefined ? riRemap[ri] : ri);
        const codeIdx = expandedRootToCodeIndex[ri2];
        if (codeIdx === undefined || codeIdx < 0) return '#555'; // 跳过的字根灰色
        // 直接从rootColorMap取颜色字符串，避免存索引导致0值falsy问题
        return rootColorMap[codeIdx] || '#555';
    });
    if (currentChar === '哥' || currentChar === '奇' || currentChar === '孚' || currentChar === '酉' || currentChar === '戊' || currentChar === '戳' || currentChar === '靠' || currentChar === '摁' || currentChar === '鹵' || currentChar === '県' || currentChar === '歌' || currentChar === '战' || currentChar === '麥' || currentChar === '蘩' || currentChar === '繁' || currentChar === '海' || currentChar === '每' || currentChar === '嗨' || currentChar === '酶' || currentChar === '鳘' || currentChar === '毓' || currentChar === '敏' || currentChar === '蔬' || currentChar === '疏' || currentChar === '止' || currentChar === '嗇' || currentChar === '牆' || currentChar === '薔' || currentChar === '穡' || currentChar === '闈' || currentChar === '偉' || currentChar === '圍' || currentChar === '韓' || currentChar === '媲') {

        console.log('[DEBUG' + currentChar + '] expandedRootToCodeIndex=' + JSON.stringify(expandedRootToCodeIndex));
        console.log('[DEBUG' + currentChar + '] strokeColorMap=' + JSON.stringify(strokeColorMap));
        console.log('[DEBUG' + currentChar + '] roots=' + JSON.stringify(roots));
        console.log('[DEBUG' + currentChar + '] rootCode=' + rootCode);
        console.log('[DEBUG' + currentChar + '] strokes.length=' + strokes.length);
        console.log('[DEBUG' + currentChar + '] rootColorMap=' + JSON.stringify(rootColorMap));
        console.log('[DEBUG' + currentChar + '] rootToCodeIndex=' + JSON.stringify(rootToCodeIndex));
        console.log('[DEBUG' + currentChar + '] riRemap=' + JSON.stringify(riRemap));
        console.log('[DEBUG' + currentChar + '] _isKeyNameRootSelf=' + _isKeyNameRootSelf);
        console.log('[DEBUG' + currentChar + '] supIndices=' + JSON.stringify(supIndices));
                if (currentChar === '麥') {

            for (let _si = 0; _si < strokes.length; _si++) {

        const realRoots = roots.filter(r => r !== '').length;

        const supSource = wubiData?._supAuto ? '<span style="color:#FF9800;font-size:11px">（自动判断）</span>' : (supIndices.length > 0 ? '<span style="color:#4CAF50;font-size:11px">（已校对）</span>' : '');

            if (actualSupCode && actualSupCode !== autoCalc.code) {
                // 不一致：显示自动计算的识别码

    } else {

        `;
    }

    // 字根图例
    const legend = document.getElementById('root-legend');
    const nonRoots = wubiData?.nr || []; // 非编码部首列表
    
    if (roots.length > 0) {
        
        // 计算字根→编码的映射关系（与笔画颜色逻辑完全一致）
        const rootToCodeIndex = [];
        if (roots.length > 4) {
            // 检查 strokeRootMap 中是否有重复的字根索引（如㇂+丶+丿共享T键）
            const rootMapCounts = {};
            for (const ri of strokeRootMap) {
                rootMapCounts[ri] = (rootMapCounts[ri] || 0) + 1;
            }
            const hasRepeatedRoots = Object.values(rootMapCounts).some(c => c > 1);
            if (hasRepeatedRoots && roots.length <= codeLen) {
                // 有重复字根索引：按 strokeRootMap 中的实际映射来分配编码索引
                const uniqueRootIndices = Array.from(new Set(strokeRootMap.filter(r => r >= 0))).sort((a,b) => a-b);
                const rootIndexToCodeIndex = {};
                let codePos = 0;
                for (const uri of uniqueRootIndices) {
                    if (codePos < codeLen) {
                        rootIndexToCodeIndex[uri] = codePos;
                        codePos++;
                    } else {
                        rootIndexToCodeIndex[uri] = -1;
                    }
                }
                for (let i = 0; i < roots.length; i++) {
                    rootToCodeIndex.push(rootIndexToCodeIndex[i] !== undefined ? rootIndexToCodeIndex[i] : -1);
                }
            } else {
                // 无重复字根索引：前3+末1规则
                for (let i = 0; i < 3; i++) rootToCodeIndex.push(colorIdxMap[i]);
                for (let i = 3; i < roots.length - 1; i++) rootToCodeIndex.push(-1);
                rootToCodeIndex.push(colorIdxMap[colorIdxMap.length - 1]);
            }
        } else if (roots.length < codeLen) {
            // 字根数 < 编码数：按非补码编码位置映射，末字根对应末位编码
            // 单字根字符（如王=GGGG、一=GGLL、乙=NNLL）：无论编码是否全相同，都映射到位0
            if (roots.length === 1) {
                rootToCodeIndex.push(colorIdxMap[0]);
            } else {
                const rootCodeIndices = [];
                for (let i = 0; i < codeLen; i++) {
                    if (!supIndices.includes(i)) rootCodeIndices.push(i);
                }
                for (let i = 0; i < roots.length - 1; i++) rootToCodeIndex.push(colorIdxMap[rootCodeIndices[i]]);
                rootToCodeIndex.push(colorIdxMap[rootCodeIndices[rootCodeIndices.length - 1]]);
            }
        } else {
            // 字根数 === 编码数：直接对应
            for (let i = 0; i < roots.length; i++) rootToCodeIndex.push(colorIdxMap[i]);
        }
        
        // swapLast 字：交换字根区末两笔的显示顺序，同时同步 rootToCodeIndex 保颜色对齐
        // 乃/刀 例外：笔画需要交换，但字根着色区的字根列表不交换
        // 注：力/方/分/切/戋等字的 swap 是否生效由 CUSTOM_STROKE_ORDER.condition 控制，
        //     该 condition 已按版本（86/98/06）区分，此处不再额外拦截
        const rootCustom = CUSTOM_STROKE_ORDER[currentChar];
        let displayRoots = [...roots];
        if (rootCustom && rootCustom.swapLast && currentChar !== '乃' && currentChar !== '刀' && currentChar !== '力' && wubiData && rootCustom.condition(wubiData, currentChar) && displayRoots.length > 2) {
            const n = displayRoots.length;
            [displayRoots[n-2], displayRoots[n-1]] = [displayRoots[n-1], displayRoots[n-2]];
            [rootToCodeIndex[n-2], rootToCodeIndex[n-1]] = [rootToCodeIndex[n-1], rootToCodeIndex[n-2]];
        }

        // roots 已经是展开后的基本字根数组，无需再展开
        // displayRoots 和 rootToCodeIndex 已在上面通过 swapLast 处理完毕

        // 显示参与编码的字根，不参与编码的不显示
        let html = displayRoots.map((r, i) => {
            // 跳过空字根（补码占位）
            if (r === '') return '';
            const codeIdx = rootToCodeIndex[i];
            const isSkipped = codeIdx === -1 || codeIdx >= (rootCode ? rootCode.length : 4);
            if (isSkipped) {
                // 不参与编码的字根：不在字根列表中显示
                return '';
            }
            const displayMap = strokeRootMapForDisplay || strokeRootMap || [];
            // 当字根数>笔画数时，超出stroke索引范围的字根显示1笔
            const count = RADICAL_STROKES[r] || 1;
            const isKeyNameFirst = (WUBI[currentChar]?.r?.[0] === currentChar) && i === 0;
            const countText = isKeyNameFirst ? '—' : count + '笔';
            // 使用编码索引对应的颜色，确保与编码区一致
            const bgColor = rootColorMap[codeIdx] || '#555';
            const keyLetter = rootCode[codeIdx] || '';
            const kouju = keyLetter ? WUBI_KOuju[keyLetter] || '' : '';
            const rootTable = keyLetter ? WUBI_ROOT_TABLE[keyLetter] || '' : '';
            return '<li style="background:' + bgColor + '22">' +
                '<span class="root-letter-big" style="color:' + bgColor + '">' + keyLetter + '</span>' +
                '<div class="root-content">' +
                '<div class="root-row">' +
                '<span class="root-name" style="color:' + bgColor + '">' + r + '</span>' +
                '<span class="root-kouju" style="color:#ccc;font-size:14px;font-weight:bold;margin-left:10px">' + kouju + '</span>' +
                '<span class="root-stroke-count">' + countText + '</span>' +
                '</div>' +
                (rootTable ? '<div class="root-table-line" style="color:' + bgColor + '">字根：' + rootTable + '</div>' : '') +
                '</div>' +
            '</li>';
        }).join('');

        // 补码单独一行（如果有）
        if (supIndices.length > 0) {
            const supCodeLetters = supIndices.map(i => rootCode[i] || '').filter(Boolean).join('');
            const lastSupCode = rootCode[supIndices[supIndices.length - 1]] || '';
            let supKouju = lastSupCode ? WUBI_KOuju[lastSupCode] || '' : '';
            let supRootTable = lastSupCode ? WUBI_ROOT_TABLE[lastSupCode] || '' : '';
            let supStrokeText = '—';

            // 辶/廴补码特殊处理：sup索引超出roots范围时，取框内末笔的字根信息
            const zouIdx = roots.indexOf('辶');
            const yanIdx = roots.indexOf('廴');
            const walkIdx = (zouIdx !== -1 ? zouIdx : (yanIdx !== -1 ? yanIdx : -1));
            const hasWalkRadical = walkIdx !== -1;
            const outOfBoundsSup = hasWalkRadical ? supIndices.filter(si => si >= roots.length) : [];

            if (outOfBoundsSup.length > 0 && strokeRootMapForDisplay.length > 0) {
                // 找框内（非辶/廴）最后一笔对应的字根
                let innerLastStrokeIdx = -1;
                for (let i = 0; i < strokeRootMapForDisplay.length; i++) {
                    if (strokeRootMapForDisplay[i] !== walkIdx && strokeRootMapForDisplay[i] >= 0) {
                        innerLastStrokeIdx = i;
                    }
                }
                if (innerLastStrokeIdx !== -1) {
                    const innerRootIdx = strokeRootMapForDisplay[innerLastStrokeIdx];
                    if (innerRootIdx >= 0 && innerRootIdx < roots.length) {
                        const innerRoot = roots[innerRootIdx];
                        // 用框内末笔所属字根的键位口诀替换
                        const innerCodeIdx = rootToCodeIndex[innerRootIdx];
                        const innerKeyLetter = rootCode[innerCodeIdx] || '';
                        supKouju = innerKeyLetter ? WUBI_KOuju[innerKeyLetter] || supKouju : supKouju;
                        supRootTable = innerKeyLetter ? WUBI_ROOT_TABLE[innerKeyLetter] || supRootTable : supRootTable;
                        // 笔画数：该字根在strokeRootMapForDisplay中的笔画数
                        const innerStrokeCount = strokeRootMapForDisplay.filter(x => x === innerRootIdx).length;
                        supStrokeText = innerStrokeCount > 0 ? (innerStrokeCount + '笔') : '—';
                    }
                }
            }

            html += '<li style="background:#00BCD455">' +
                '<span class="root-letter-big" style="color:#00BCD4">' + supCodeLetters + '</span>' +
                '<div class="root-content">' +

                (supRootTable ? '<div class="root-table-line" style="color:#00BCD4">字根：' + supRootTable + '</div>' : '') +
                '</div>' +
            '</li>';
        }

        // 非编码部首（灰色）
        if (nonRoots.length > 0) {
            const grayCount = strokeRootMap.filter(x => x < 0).length;
            html += nonRoots.map(nr => {
                return '<li style="background:rgba(80,80,80,0.25)">' +

        legend.innerHTML = html;
    } else {
        legend.innerHTML = strokes.map((_, i) => {
            const ri = i % ROOT_COLORS.length;
            return `<li style="background:${ROOT_COLORS[ri]}22;padding:2px 10px;font-size:12px">
                <span class="root-letter-big" style="color:${ROOT_COLORS[ri]};font-size:1rem">${i + 1}</span>

    }
}

// ==================== 键盘渲染 ====================
function renderKeyboard() {
    const wubiData = WUBI[currentChar];
    const supIndices = wubiData?.sup || [];
    const isSpecial = wubiData?.special || false; // 特殊字（如乙NNLL）
    
    // 构建位置→颜色映射（补码单独用青色）
    const positionColors = [];
    let colorIndex = 0;
    if (rootCode && rootCode !== '—') {
        const codeLen = rootCode.length;
        rootCode.split('').forEach((ch, i) => {
            const isSup = supIndices.includes(i);
            // 特殊字的后两个编码用灰色
            const isSpecialGray = isSpecial && i >= codeLen - 2;
            if (isSpecialGray) {
                positionColors[i] = { color: '#999', isActive: true, isSup: false, letter: ch, isSpecial: true };
            } else if (isSup) {
                // 补码始终用青色
                positionColors[i] = { color: '#00BCD4', isActive: true, isSup: true, letter: ch };
            } else {
                // 非补码：每个位置独立分配颜色（不再同一字母同色）
                positionColors[i] = { color: ROOT_COLORS[colorIndex % ROOT_COLORS.length], isActive: true, isSup: false, letter: ch };
                colorIndex++;
            }
        });
    }
    
    // 构建字母→颜色映射（用于键盘高亮，取该字母第一次非补码的颜色）
    const codeColors = {};
    positionColors.forEach((info, i) => {
        if (info && !info.isSup && !codeColors[info.letter]) {
            codeColors[info.letter] = info;
        }
    });

// ===== 字库搜索 =====
let libSearchQuery = '';       // 当前搜索关键字
let libSearchResults = null;   // 搜索结果数组（null=未搜索，显示全部）

function onLibSearch(val) {
    libSearchQuery = val.trim();
    // 同步两侧搜索框
    const left = document.getElementById('lib-search-left');
    const right = document.getElementById('lib-search-right');
    if (left && document.activeElement !== left) left.value = val;
    if (right && document.activeElement !== right) right.value = val;

    if (!libSearchQuery) {
        // 清空搜索：恢复完整字库
        libSearchResults = null;
        libPage = 0;
        libPageOverride = true;
        clearMultiCharCards();
        renderCharLibrary();
        return;
    }

    // 搜索：找出所有字根（原始或展开后）包含关键字的汉字
    // 去方括号匹配：用户输入"羊后"可匹配字根"羊后"
    const _normRoot = (s) => s.replace(/^\[|\]$/g, '');
    libSearchResults = ALL_CHARS.filter(ch => {
        if (ch === libSearchQuery) return true;
        const wubi = WUBI[ch];
        if (!wubi || !wubi.r) return false;
        // 精确匹配（兼容带方括号输入）
        if (wubi.r.includes(libSearchQuery)) return true;
        // 去方括号匹配
        if (wubi.r.some(r => _normRoot(r) === libSearchQuery)) return true;
        // 检查展开后的子字根
        try {
            const expanded = recursivelyExpandRoots(wubi.r);
            if (expanded.includes(libSearchQuery)) return true;
            if (expanded.some(r => _normRoot(r) === libSearchQuery)) return true;
        } catch (_) {}
        return false;
    });

    libPage = 0;
    libPageOverride = true;
    renderCharLibrary();

    // 大框显示搜索结果第一个字
    if (libSearchResults.length > 0) {
        selectChar(libSearchResults[0]);
    }
}

function renderCharLibrary() {
    const sourceArray = libSearchResults || ALL_CHARS;
    const totalCount = sourceArray.length;
    const totalPages = Math.ceil(totalCount / LIB_PAGE_SIZE);

    // 翻页边界检查
    if (libPage >= totalPages) libPage = totalPages - 1;
    if (libPage < 0) libPage = 0;

    // 如果不是翻页按钮触发，自动跳到当前字所在页
    if (!libPageOverride) {
        const currentIdx = sourceArray.indexOf(currentChar);
        if (currentIdx >= 0) {
            const charPage = Math.floor(currentIdx / LIB_PAGE_SIZE);
            if (charPage !== libPage) libPage = charPage;
        }
    }
    libPageOverride = false; // 重置

    const pageStart = libPage * LIB_PAGE_SIZE;
    const pageChars = sourceArray.slice(pageStart, pageStart + LIB_PAGE_SIZE);

    // 均分左右
    const mid = Math.ceil(pageChars.length / 2);
    const leftChars = pageChars.slice(0, mid);
    const rightChars = pageChars.slice(mid);

    document.getElementById('lib-count-left').textContent = leftChars.length + '字';
    document.getElementById('lib-count-right').textContent = rightChars.length + '字';
    const searchLabel = libSearchResults ? `搜索"${libSearchQuery}"` : '';
    document.getElementById('lib-total-count').textContent = searchLabel
        ? `${searchLabel}（${pageStart+1}-${pageStart+pageChars.length}/${totalCount}字）`
        : `（${pageStart+1}-${pageStart+pageChars.length}/${totalCount}字）`;
    // 右侧页码：可输入跳转
    const pageInput = document.getElementById('lib-page-input');
    if (pageInput) {
        pageInput.value = libPage + 1;
        pageInput.max = totalPages;
    }
    const pageTotalEl = document.getElementById('lib-page-total');
    if (pageTotalEl) {
        pageTotalEl.textContent = `/${totalPages}页`;
    }

    function makeCell(ch) {
        const wubiData = WUBI[ch];
        const code = wubiData ? wubiData.c : '';
        const isActive = ch === currentChar;
        const noData = !wubiData ? ' no-wubi' : '';
        return `<div class="char-cell ${isActive ? 'active' : ''}${noData}" onclick="selectChar('${ch}')">
            <span class="char-cell-char">${ch}</span>
            <span class="char-cell-code">${code}</span>
        </div>`;
    }

    document.getElementById('lib-grid-left').innerHTML = leftChars.map(makeCell).join('');
    document.getElementById('lib-grid-right').innerHTML = rightChars.map(makeCell).join('');

    // 自动滚动到当前选中的字（手机竖屏禁用，scale 缩放容器内 scrollIntoView 会导致页面跳动）
    const _isPhone = isPhonePortrait();
    if (!_isPhone) {
        requestAnimationFrame(() => {
            const activeCell = document.querySelector('.char-cell.active');
            if (activeCell) activeCell.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
        });
    }
}

// ==================== 笔画分配渲染 ====================
function renderAssignment() {
    const div = document.getElementById('stroke-assignment-side');
    const rootCount = Math.max(roots.length, 1);
    const wubiData = WUBI[currentChar];
    const supIndices = wubiData?.sup || [];

    // 按列排列：先左列从上到下，再右列从上到下
    const totalStrokes = strokes.length;
    const leftCount = Math.ceil(totalStrokes / 2);
    
    // 构建所有笔画项
    // 使用与 renderInfo 相同的 riRemap，确保索引一致
    const _uniqueRi = [...new Set(strokeRootMap.filter(v => v >= 0))].sort((a, b) => a - b);
    const _riRemap = {};
    let _rai = 0;
    for (const _ri of _uniqueRi) { _riRemap[_ri] = _rai++; }
    const items = strokes.map((_, i) => {
        const rawIdx = strokeRootMap[i];
        const idx = _riRemap[rawIdx] !== undefined ? _riRemap[rawIdx] : rawIdx;
        const isGray = idx < 0;
        const color = isGray ? '#555' : ROOT_COLORS[idx % ROOT_COLORS.length];
        return `<div class="assign-item">
            <span style="background:${color};width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;font-size:12px;">${i+1}</span>
            <select onchange="onAssignChange(${i}, this.value)">
                ${Array.from({length: rootCount}, (_, r) => {
                    const isSup = supIndices.includes(r);
                    const rawLabel = roots.length > 0 ? roots[r] : '组'+(r+1);
                    const label = rawLabel === '' ? '补码' : rawLabel;
                    return '<option value="' + r + '" ' + (r === idx ? 'selected' : '') + '>' + label + '</option>';
                }).join('')}
                <option value="-1" ${isGray ? 'selected' : ''}>灰色</option>
            </select>
        </div>`;
    });
    
    // 按列重排：左列(0,3,6...) + 右列(1,4,7...)
    // Grid两列按行填充，要让左列先满，需要交错排列
    const reordered = [];
    for (let i = 0; i < leftCount; i++) {
        reordered.push(items[i]); // 左列
        const rightIdx = leftCount + i;
        if (rightIdx < totalStrokes) {
            reordered.push(items[rightIdx]); // 右列
        }
    }
    
    if (div) div.innerHTML = reordered.join('');
}
