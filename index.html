// =================== 统一输入处理 ====================
function handleCharInput(val) {
    if (!val) return;
    // 提取所有汉字字符（含扩展区）
    const _chars = [];
    for (const _ch of val) {
        const _cp = _ch.codePointAt(0);
        if ((_cp >= 0x4E00 && _cp <= 0x9FFF) ||
            (_cp >= 0x3400 && _cp <= 0x4DBF) ||
            (_cp >= 0x20000 && _cp <= 0x2A6DF)) {
            _chars.push(_ch);
        }
    }
    if (_chars.length === 0) return;

    // 多字模式：输入多个汉字时显示拆分卡片，大框显示第一个字
    if (_chars.length > 1) {
        renderMultiCharCards(_chars);
        // 设置多字循环模式
        multiCharList = [..._chars];
        multiCharIndex = 0;
        // 大框显示第一个字
        const first = _chars[0];
        if (CHAR_LIST.includes(first)) {
            charIndex = CHAR_LIST.indexOf(first);
        }
        appReady = true;
        loadAndRender(first);
        charInput.value = '';
        return;
    }

    const single = _chars[0];
    // 单字输入时清除多字循环模式和卡片显示
    multiCharList = [];
    multiCharIndex = -1;
    clearMultiCharCards();
    if (!CHAR_LIST.includes(single)) {
        showFeedback('⏳ 「' + single + '」暂未录入字库，敬请期待版本更新，谢谢您！', 'wrong');
        charInput.value = '';
        setTimeout(() => clearFeedback(), 2500);
        return;
    }
    // 直接跳转到输入的汉字，保持输入框空白
    const idx = CHAR_LIST.indexOf(single);
    if (idx !== -1) charIndex = idx;
    appReady = true;
    
    if (single === currentChar) {
        // 文章模式：记录正确输入，启动计时
        if (articleIndex !== -1 && articleChars.length > 0) {
            if (!articleStartTime) {
                articleStartTime = Date.now();
                // 启动定时刷新计时器
                if (articleTimerInterval) clearInterval(articleTimerInterval);
                articleTimerInterval = setInterval(updateArticleProgress, 1000);
            }
            articleTypedCount++;
            updateArticleProgress();
        }
        // 输入的是当前汉字，显示烟花并跳转到下一个
        if (fireworksEnabled) {
            showFireworks();
            setTimeout(() => nextChar(), 1600);
        } else {
            nextChar();
        }
    } else {
        // 输入的是其他汉字，直接跳转
        loadAndRender(single);
    }
    // 立即清空输入框
    charInput.value = '';
    // 保持输入框聚焦，系统键盘不收起，用户可连续输入
}

// IME 输入法：compositionend 时处理提交
charInput.addEventListener('compositionend', () => {
    const val = charInput.value.trim();
    if (!val) return;
    skipInputOnce = true;
    handleCharInput(val);
    charInput.value = '';
});

charInput.addEventListener('input', (e) => {
    if (e.isComposing) return;
    if (skipInputOnce) {
        skipInputOnce = false;
        if (!charInput.value.trim()) return;
    }
    const val = charInput.value.trim();
    if (!val) return;
    handleCharInput(val);
});

// 粘贴事件：提取粘贴文本中的所有汉字（支持多字模式）
charInput.addEventListener('paste', (e) => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text');
    // 提取所有 CJK 汉字（含扩展区字符）
    const chars = [];
    for (const ch of text) {
        const cp = ch.codePointAt(0);
        if ((cp >= 0x4E00 && cp <= 0x9FFF) ||
            (cp >= 0x3400 && cp <= 0x4DBF) ||
            (cp >= 0x20000 && cp <= 0x2A6DF)) {
            chars.push(ch);
        }
    }
    if (chars.length === 0) return;
    skipInputOnce = false; // 粘贴已 preventDefault，不会再触发原生重复 input
    const joined = chars.join('');
    charInput.value = joined;
    handleCharInput(joined);
});

});

// ==================== 烟花动画 ====================
function showFireworks() {
    const container = document.getElementById('fireworks-container');
    const canvas = document.getElementById('fireworks-canvas');
    const zhenbang = document.getElementById('zhenbang-text');
    
    container.classList.add('active');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    // 重置真棒文字动画
    zhenbang.classList.remove('show');
    void zhenbang.offsetWidth;
    zhenbang.classList.add('show');
    
    const ctx = canvas.getContext('2d');
    const particles = [];
    const rockets = [];
    const colors = ['#FF6B6B','#FFE66D','#4ECDC4','#45B7D1','#96E6A1','#DDA0DD','#FF9FF3','#54A0FF','#5F27CD','#FF9F43'];
    
    function randomRange(min, max) { return Math.random() * (max - min) + min; }
    
    function createRocket() {
        const x = randomRange(canvas.width * 0.15, canvas.width * 0.85);
        const targetY = randomRange(canvas.height * 0.15, canvas.height * 0.45);
        return { x, y: canvas.height, targetY, speed: randomRange(6, 10), color: colors[Math.floor(Math.random() * colors.length)], trail: [] };
    }
    
    function createExplosion(x, y, color) {
        const count = Math.floor(randomRange(50, 90));
        for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 * i) / count + randomRange(-0.2, 0.2);
            const speed = randomRange(1.5, 6);
            const size = randomRange(1.5, 3.5);
            const life = randomRange(40, 80);
            particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, color, size, life, maxLife: life, gravity: 0.04 });
        }
        for (let i = 0; i < 15; i++) {
            const angle = randomRange(0, Math.PI * 2);
            const speed = randomRange(1, 3);
            particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, color: '#FFD700', size: randomRange(1, 2), life: randomRange(20, 40), maxLife: 40, gravity: 0.03 });
        }
    }
    
    rockets.push(createRocket());
    setTimeout(() => { if (container.classList.contains('active')) rockets.push(createRocket()); }, 200);
    setTimeout(() => { if (container.classList.contains('active')) rockets.push(createRocket()); }, 450);
    setTimeout(() => { if (container.classList.contains('active')) rockets.push(createRocket()); }, 700);
    setTimeout(() => { if (container.classList.contains('active')) rockets.push(createRocket()); }, 950);
    
    let animId;
    function animate() {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalCompositeOperation = 'lighter';
        
        for (let i = rockets.length - 1; i >= 0; i--) {
            const r = rockets[i];
            r.trail.push({ x: r.x, y: r.y });
            if (r.trail.length > 8) r.trail.shift();
            r.y -= r.speed;
            for (let j = 0; j < r.trail.length; j++) {
                const alpha = j / r.trail.length * 0.6;
                ctx.beginPath();
                ctx.arc(r.trail[j].x, r.trail[j].y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,200,100,${alpha})`;
                ctx.fill();
            }
            if (r.y <= r.targetY) {
                createExplosion(r.x, r.y, r.color);
                rockets.splice(i, 1);
            }
        }
        
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx; p.y += p.vy; p.vy += p.gravity;
            p.vx *= 0.985; p.vy *= 0.985; p.life--;
            if (p.life <= 0) { particles.splice(i, 1); continue; }
            const alpha = p.life / p.maxLife;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = alpha;
            ctx.fill();
            ctx.globalAlpha = 1;
        }
        
        if (rockets.length > 0 || particles.length > 0) {
            animId = requestAnimationFrame(animate);
        } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            container.classList.remove('active');
            zhenbang.classList.remove('show');
        }
    }
    
    animate();
    setTimeout(() => {
        cancelAnimationFrame(animId);
        ctx.globalCompositeOperation = 'source-over';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        container.classList.remove('active');
        zhenbang.classList.remove('show');
    }, 3500);
}

// ==================== 统一字库数组 ====================
// 键名字按横竖撇捺折区排列，一级简码按五个区域排列，顺序固定不变

const KEY_NAME_ORDER = '王土大木工目日口田山禾白月人金言立水火之已子女又纟'.split('');
const FIRST_LEVEL_ORDER = [...new Set('一地在要工上是中国同和地有人我主产不为这民了发以经'.split(''))];

function buildAllChars() {
    const keyNameSet = new Set(KEY_NAME_ORDER);
    const firstLevelSet = new Set(FIRST_LEVEL_ORDER);
    const seen = new Set();
    const result = [];

    function add(ch) {
        if (seen.has(ch)) return;
        seen.add(ch);
        result.push(ch);
    }

    // ① 键名字25个（顺序固定）
    KEY_NAME_ORDER.forEach(add);
    // ② 非键名的一级简码（顺序固定）
    FIRST_LEVEL_ORDER.filter(c => !keyNameSet.has(c)).forEach(add);
    // ③ 其余五笔字（按拼音排序）
    // 排除部分特殊字根（无法输入，不应在字库显示）
    Object.keys(WUBI).sort().filter(c => c && !keyNameSet.has(c) && !firstLevelSet.has(c) && c !== '𫩠' && c !== '𠦝' && c !== '龺' && c !== '𣬉' && c !== '龶').forEach(add);
    // ④ 其余hanzi-writer-data支持的汉字（无五笔数据，仅显示笔画）
    for (const ch of HANZI_ALL_CHARS) {
        if (!seen.has(ch)) add(ch);
    }

    return result;
}
const ALL_CHARS = buildAllChars();

function buildCharList() {
    // 均分左右
    const mid = Math.ceil(ALL_CHARS.length / 2);
    return [
        ...ALL_CHARS.slice(0, mid),
        ...ALL_CHARS.slice(mid)
    ];
}
const CHAR_LIST = buildCharList();
let charIndex = CHAR_LIST.indexOf('王'); // 默认从第一个键名字"王"开始

// ==================== 文章模式 ====================
let articleChars = [];       // 从文章提取的汉字序列（去重或保留）
let articleIndex = -1;       // 当前在文章序列中的位置（-1=未激活）
let articleStartTime = null;  // 文章练习开始时间（首次输入正确字时记录）
let articleTypedCount = 0;    // 已正确输入的字数
let articleTimerInterval = null; // 计时器引用

/** 提取文本中的汉字（仅CJK，保留所有重复）*/
function extractHanzi(text) {
    const result = [];
    for (const ch of text) {
        const cp = ch.codePointAt(0);
        if ((cp >= 0x4E00 && cp <= 0x9FFF) ||
            (cp >= 0x3400 && cp <= 0x4DBF) ||
            (cp >= 0x20000 && cp <= 0x2A6DF)) {
            result.push(ch);
        }
    }
    return result;
}

function loadArticle() {
    const text = document.getElementById('article-textarea').value.trim();
    if (!text) { showToast('请先输入文章内容'); return; }
    applyArticleChars(text);
}

function loadArticleFile(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const text = e.target.result;
        document.getElementById('article-textarea').value = text.slice(0, 500); // 仅预览前500字
        applyArticleChars(text);
    };
    reader.readAsText(file, 'utf-8');
}

function applyArticleChars(text) {
    const chars = extractHanzi(text);
    if (chars.length === 0) { showToast('未找到汉字'); return; }
    // 清除多字循环模式，避免文章导航被拦截
    multiCharList = [];
    multiCharIndex = -1;
    clearMultiCharCards();
    articleChars = chars;
    articleIndex = 0;
    // 重置进度与速度统计
    articleStartTime = null;
    articleTypedCount = 0;
    if (articleTimerInterval) { clearInterval(articleTimerInterval); articleTimerInterval = null; }
    renderArticlePreview();
    // 显示进度条并初始化
    const progBar = document.getElementById('article-progress-bar');
    if (progBar) {
        progBar.style.display = 'flex';
        updateArticleProgress();
    }
    // 自动保存到本地，下次直接点击标题即可加载
    saveCurrentArticle();
    // 跳转到第一个字
    jumpToArticleChar(0);
}

function clearArticleMode() {
    articleChars = [];
    articleIndex = -1;
    articleStartTime = null;
    articleTypedCount = 0;
    if (articleTimerInterval) { clearInterval(articleTimerInterval); articleTimerInterval = null; }
    document.getElementById('article-textarea').value = '';
    document.getElementById('article-title-input').value = '';
    document.getElementById('article-chars-preview').style.display = 'none';
    document.getElementById('article-chars-preview').innerHTML = '';
    document.getElementById('article-char-counter').style.display = 'none';
    document.getElementById('article-clear-btn').style.display = 'none';
    document.getElementById('article-add-btn').style.display = 'none';
    document.getElementById('article-input-area').style.display = 'flex';
    const progBar = document.getElementById('article-progress-bar');
    if (progBar) progBar.style.display = 'none';
    renderSavedArticles();
}

/** 在练习过程中重新显示文章输入区，方便添加新文章 */
function showArticleInput() {
    document.getElementById('article-input-area').style.display = 'flex';
    document.getElementById('article-textarea').value = '';
    document.getElementById('article-title-input').value = '';
    document.getElementById('article-chars-preview').style.display = 'none';
    document.getElementById('article-chars-preview').innerHTML = '';
    document.getElementById('article-add-btn').style.display = 'none';
    document.getElementById('article-clear-btn').style.display = 'none';
    document.getElementById('article-char-counter').style.display = 'none';
    const progBar = document.getElementById('article-progress-bar');
    if (progBar) progBar.style.display = 'none';
    // 不清除 articleChars，用户仍然可以通过 navigation 浏览原文章
}

/** 更新文章练习进度与速度显示 */
function updateArticleProgress() {
    if (articleChars.length === 0) return;
    const total = articleChars.length;
    const done = articleTypedCount;
    const pct = Math.round((done / total) * 100);
    const fill = document.getElementById('progress-fill');
    const pctEl = document.getElementById('progress-pct');
    const speedEl = document.getElementById('speed-display');
    const timerEl = document.getElementById('article-timer');
    if (fill) fill.style.width = pct + '%';
    if (pctEl) pctEl.textContent = pct + '%';

    // 速度计算
    if (articleStartTime && articleTypedCount > 0) {
        const elapsedSec = (Date.now() - articleStartTime) / 1000;
        const speed = Math.round((articleTypedCount / elapsedSec) * 60);
        if (speedEl) speedEl.textContent = speed + ' 字/分';
        // 计时器
        const mm = Math.floor(elapsedSec / 60).toString().padStart(2, '0');
        const ss = Math.floor(elapsedSec % 60).toString().padStart(2, '0');
        if (timerEl) timerEl.textContent = mm + ':' + ss;
    } else {
        if (speedEl) speedEl.textContent = '— 字/分';
        if (timerEl) timerEl.textContent = '00:00';
    }
}

function jumpToArticleChar(idx) {
    if (idx < 0 || idx >= articleChars.length) return;
    articleIndex = idx;
    const ch = articleChars[idx];
    // 同步 charIndex 到全局列表（方便补码等功能正常工作）
    const globalIdx = CHAR_LIST.indexOf(ch);
    if (globalIdx !== -1) charIndex = globalIdx;
    currentChar = ch;
    appReady = true;
    loadAndRender(ch);
    // 更新预览高亮
    updateArticleChipsHighlight();
    // 更新计数
    const counter = document.getElementById('article-char-counter');
    counter.textContent = (idx + 1) + ' / ' + articleChars.length;
    counter.style.display = 'inline';
}

function renderArticlePreview() {
    const preview = document.getElementById('article-chars-preview');
    preview.innerHTML = '';
    articleChars.forEach((ch, i) => {
        const chip = document.createElement('span');
        chip.className = 'article-char-chip' + (WUBI[ch] ? '' : ' no-wubi');
        chip.textContent = ch;
        chip.title = WUBI[ch] ? (ch + '：' + WUBI[ch].c) : (ch + '（无五笔数据）');
        chip.onclick = () => jumpToArticleChar(i);
        chip.dataset.idx = i;
        preview.appendChild(chip);
    });
    preview.style.display = 'flex';
    // 折叠输入区，显示添加按钮
    document.getElementById('article-input-area').style.display = 'none';
    document.getElementById('article-clear-btn').style.display = 'inline';
    document.getElementById('article-add-btn').style.display = 'inline';
    updateArticleChipsHighlight();
}

function updateArticleChipsHighlight() {
    const chips = document.querySelectorAll('.article-char-chip');
    chips.forEach(chip => {
        const idx = parseInt(chip.dataset.idx);
        chip.classList.toggle('active', idx === articleIndex);
    });
    // 滚动到当前chip（手机竖屏禁用，避免 scale 容器内跳动）
    const activeChip = document.querySelector('.article-char-chip.active');
    if (activeChip && !isPhonePortrait()) {
        activeChip.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }
}

// ==================== 文章持久化存储 ====================
const STORAGE_KEY = 'wubi_saved_articles';

function getSavedArticles() {
    try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch(e) { return []; }
}

function saveArticleList(articles) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(articles));
}

function saveCurrentArticle() {
    if (articleChars.length === 0) return;
    const titleInput = document.getElementById('article-title-input');
    let title = titleInput.value.trim();
    if (!title) {
        // 自动生成标题：取前10个字符+"…"
        title = articleChars.slice(0, 10).join('') + (articleChars.length > 10 ? '…' : '');
    }
    const articles = getSavedArticles();
    // 检查标题是否已存在
    const existing = articles.findIndex(a => a.title === title);
    const entry = {
        title: title,
        text: articleChars.join(''),  // 保存完整的汉字序列（而非被截断的textarea内容）
        chars: articleChars.join(''),
        count: articleChars.length,
        timestamp: Date.now()
    };
    if (existing !== -1) {
        articles[existing] = entry; // 覆盖
        showToast('已更新文章：' + title);
    } else {
        articles.push(entry);
        showToast('已保存文章：' + title);
    }
    saveArticleList(articles);
    renderSavedArticles();
}

function deleteSavedArticle(title) {
    let articles = getSavedArticles();
    articles = articles.filter(a => a.title !== title);
    saveArticleList(articles);
    renderSavedArticles();
}

function loadSavedArticle(entry) {
    document.getElementById('article-textarea').value = entry.text;
    // 设置标题（不触发自动保存）
    const titleInput = document.getElementById('article-title-input');
    titleInput.value = entry.title;
    // 恢复预览区文字（自动保存会跳过，因为标题匹配已有条目）
    applyArticleChars(entry.text || entry.chars);
    renderSavedArticles();
}

/** 进入编辑模式：将已保存文章内容回填到输入框，修改后重新保存 */
function editSavedArticle(entry) {
    document.getElementById('article-textarea').value = entry.text;
    document.getElementById('article-title-input').value = entry.title;
    // 显示输入区，隐藏预览区
    document.getElementById('article-input-area').style.display = 'flex';
    document.getElementById('article-chars-preview').style.display = 'none';
    document.getElementById('article-chars-preview').innerHTML = '';
    document.getElementById('article-clear-btn').style.display = 'none';
    document.getElementById('article-add-btn').style.display = 'none';
    document.getElementById('article-char-counter').style.display = 'none';
    renderSavedArticles();
    showToast('请在输入区修改内容后，点击「载入文章」重新保存');
}

function renderSavedArticles() {
    const list = document.getElementById('article-saved-list');
    const articles = getSavedArticles();
    if (articles.length === 0) {
        list.style.display = 'none';
        return;
    }
    list.style.display = 'flex';
    list.innerHTML = '<div style="font-size:12px;color:#88aaff;margin-bottom:2px;">📚 已保存文章</div>';
    for (let i = 0; i < articles.length; i++) {
        const a = articles[i];
        const item = document.createElement('div');
        item.className = 'article-saved-item';
        item.dataset.idx = i;
        const titleSpan = document.createElement('span');
        titleSpan.className = 'article-saved-item-title';
        titleSpan.textContent = a.title;
        const countSpan = document.createElement('span');
        countSpan.className = 'article-saved-item-count';
        countSpan.textContent = a.count + '字';
        const delBtn = document.createElement('button');
        delBtn.className = 'article-saved-item-del';
        delBtn.textContent = '✕';
        delBtn.onclick = function(e) {
            e.stopPropagation();
            deleteSavedArticle(a.title);
        };
        const editBtn = document.createElement('button');
        editBtn.className = 'article-saved-item-del';
        editBtn.textContent = '✎';
        editBtn.style.marginRight = '4px';
        editBtn.style.color = '#88aaff';
        editBtn.onclick = function(e) {
            e.stopPropagation();
            editSavedArticle(a);
        };
        item.appendChild(editBtn);
        item.appendChild(titleSpan);
        item.appendChild(countSpan);
        item.appendChild(delBtn);
        item.onclick = function() { loadSavedArticle(a); };
        list.appendChild(item);
    }
}

// 页面加载时渲染已保存文章列表
renderSavedArticles();

/** 覆盖 prevChar / nextChar：文章模式时在文章序列中导航 */
function prevChar() {
    // 多字循环模式
    if (multiCharList.length > 0 && multiCharIndex >= 0) {
        multiCharIndex = (multiCharIndex - 1 + multiCharList.length) % multiCharList.length;
        const ch = multiCharList[multiCharIndex];
        if (CHAR_LIST.includes(ch)) charIndex = CHAR_LIST.indexOf(ch);
        appReady = true;
        loadAndRender(ch);
        return;
    }
    if (articleIndex !== -1 && articleChars.length > 0) {
        jumpToArticleChar((articleIndex - 1 + articleChars.length) % articleChars.length);
        return;
    }
    // 搜索模式：在搜索结果中导航
    if (libSearchResults && libSearchResults.length > 0) {
        let idx = libSearchResults.indexOf(currentChar);
        if (idx < 0) idx = 0;
        idx = (idx - 1 + libSearchResults.length) % libSearchResults.length;
        const ch = libSearchResults[idx];
        charIndex = CHAR_LIST.indexOf(ch);
        if (charIndex < 0) charIndex = 0;
        currentChar = ch;
        appReady = true;
        loadAndRender(ch);
        return;
    }
    charIndex = (charIndex - 1 + CHAR_LIST.length) % CHAR_LIST.length;
    const ch = CHAR_LIST[charIndex];
    currentChar = ch;
    appReady = true;
    loadAndRender(ch);
}

function nextChar() {
    // 多字循环模式
    if (multiCharList.length > 0 && multiCharIndex >= 0) {
        multiCharIndex = (multiCharIndex + 1) % multiCharList.length;
        const ch = multiCharList[multiCharIndex];
        if (CHAR_LIST.includes(ch)) charIndex = CHAR_LIST.indexOf(ch);
        appReady = true;
        loadAndRender(ch);
        return;
    }
    if (articleIndex !== -1 && articleChars.length > 0) {
        jumpToArticleChar((articleIndex + 1) % articleChars.length);
        return;
    }
    // 搜索模式：在搜索结果中导航
    if (libSearchResults && libSearchResults.length > 0) {
        let idx = libSearchResults.indexOf(currentChar);
        if (idx < 0) idx = -1;
        idx = (idx + 1) % libSearchResults.length;
        const ch = libSearchResults[idx];
        charIndex = CHAR_LIST.indexOf(ch);
        if (charIndex < 0) charIndex = 0;
        currentChar = ch;
        appReady = true;
        loadAndRender(ch);
        return;
    }
    charIndex = (charIndex + 1) % CHAR_LIST.length;
    const ch = CHAR_LIST[charIndex];
    currentChar = ch;
    appReady = true;
    loadAndRender(ch);
}

// ==================== 键盘上下滚动 ====================
document.addEventListener('keydown', function(e) {
    var tag = document.activeElement.tagName;
    // 左右方向键：切换上一个/下一个字（全局生效，包括焦点在输入框时）
    if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevChar();
        return;
    }
    if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextChar();
        return;
    }
    // 上下方向键：在侧边栏中按行跳转（每行5个字）
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        var step = 5; // 每行5个字
        // 搜索模式：在搜索结果中按行跳转
        if (libSearchResults && libSearchResults.length > 0) {
            let idx = libSearchResults.indexOf(currentChar);
            if (idx < 0) idx = 0;
            if (e.key === 'ArrowDown') {
                idx = (idx + step) % libSearchResults.length;
            } else {
                idx = (idx - step + libSearchResults.length) % libSearchResults.length;
            }
            var ch = libSearchResults[idx];
            charIndex = CHAR_LIST.indexOf(ch);
            if (charIndex < 0) charIndex = 0;
            currentChar = ch;
            appReady = true;
            loadAndRender(ch);
            return;
        }
        if (e.key === 'ArrowDown') {
            charIndex = (charIndex + step) % CHAR_LIST.length;
        } else {
            charIndex = (charIndex - step + CHAR_LIST.length) % CHAR_LIST.length;
        }
        var ch = CHAR_LIST[charIndex];
        currentChar = ch;
        appReady = true;
        loadAndRender(ch);
    }
});

// ==================== 跨屏幕自适应缩放 ====================
(function() {
    const wrapper = document.getElementById('scale-wrapper');
    let resizeTimer = null;

    // 设计基准尺寸：在此分辨率下以 1:1 原始尺寸显示
    const DESIGN_W = 1400;
    const DESIGN_H = 900;
    // body padding: top=10 right=20 bottom=20 left=20
    const BODY_PAD_W = 40;  // 左右 padding 之和
    const BODY_PAD_H = 30;  // 上下 padding 之和

    function applyScale() {
        // ===== 打赏按钮位置：与 isPhoneLayout() 对齐 =====
        const donateBtn = document.querySelector('.donate-btn');
        const keyboard = document.getElementById('wubi-keyboard');
        const donateMobile = isPhoneLayout();
        if (donateMobile && donateBtn && keyboard) {
            if (donateBtn.parentNode !== keyboard.parentNode) {
                keyboard.parentNode.insertBefore(donateBtn, keyboard.nextSibling);
            }
            donateBtn.style.position = 'static';
            donateBtn.style.top = 'auto';
            donateBtn.style.right = 'auto';
            // 手机端恢复橙色样式（覆盖桌面端灰色）
            donateBtn.style.color = '#fff';
            donateBtn.style.background = 'linear-gradient(135deg, #ff9a56, #ff6a3d)';
            donateBtn.style.border = 'none';
            donateBtn.style.boxShadow = '0 4px 16px rgba(255, 106, 61, 0.45)';
        } else if (!donateMobile && donateBtn) {
            if (donateBtn.parentNode !== document.body) {
                document.body.appendChild(donateBtn);
            }
            donateBtn.style.position = 'fixed';
            donateBtn.style.top = '24px';
            donateBtn.style.right = '76px';
            // 桌面端灰色低调样式
            donateBtn.style.color = '#aaa';
            donateBtn.style.background = 'rgba(255,255,255,0.08)';
            donateBtn.style.border = '1px solid rgba(255,255,255,0.15)';
            donateBtn.style.boxShadow = 'none';
        }

        // ===== 手机端（竖屏/横屏）：不用 transform scale，由 CSS 媒体查询处理布局 =====
        if (isPhoneLayout()) {
            // 清空所有桌面端设置的 inline style，让 CSS 媒体查询接管
            wrapper.style.transform = '';
            wrapper.style.transformOrigin = '';
            wrapper.style.width = '';
            wrapper.style.height = '';
            wrapper.style.marginTop = '';

            const container = document.querySelector('.container');
            container.style.minHeight = '';
            container.style.display = '';
            container.style.flexDirection = '';
            container.style.justifyContent = '';
            container.style.paddingTop = '';

            if (keyboard) keyboard.style.marginTop = '';

            // 标题：CSS 媒体查询已改为 static，清空 inline style
            const tc = document.querySelector('.title-container');
            if (tc) { tc.style.transform = ''; tc.style.left = ''; tc.style.top = ''; }

            // toggle：清空 inline scale，由 CSS 媒体查询处理
            const toggle = document.getElementById('lib-toggle');
            if (toggle) { toggle.style.transform = ''; toggle.style.right = ''; toggle.style.top = ''; }

            // input：CSS 已设 font-size:16px，清空 inline style
            const ci = document.getElementById('char-input');
            if (ci) { ci.style.fontSize = ''; }

            // 面板：清空 inline style
            const leftPanel = document.getElementById('lib-panel-left');
            const rightPanel = document.getElementById('lib-panel-right');
            if (leftPanel) { leftPanel.style.top = ''; leftPanel.style.maxHeight = ''; leftPanel.style.height = ''; }
            if (rightPanel) { rightPanel.style.top = ''; rightPanel.style.maxHeight = ''; rightPanel.style.height = ''; }

            // 强制重排，确保旋转后布局立即生效
            wrapper.offsetHeight;
            return; // 不执行任何 scale
        }

        // ===== 桌面端：用 transform scale 缩放 =====
        const availW = window.innerWidth - BODY_PAD_W;
        const availH = window.innerHeight - BODY_PAD_H;
        const ratio = Math.min(availW / DESIGN_W, availH / DESIGN_H);
        const contentOffsetY = 0;

        const container = document.querySelector('.container');
        wrapper.style.transformOrigin = 'top left';
        wrapper.style.transform = 'scale(' + ratio + ')';
        wrapper.style.marginTop = contentOffsetY + 'px';
        wrapper.style.width = (availW / ratio) + 'px';
        wrapper.style.height = (availH / ratio) + 'px';
        container.style.minHeight = '';
        container.style.display = '';
        container.style.flexDirection = '';
        container.style.justifyContent = '';
        if (keyboard) keyboard.style.marginTop = '';

        // 标记缩放完成，显示内容
        wrapper.classList.add('ready');

        // 面板：清空手机端 inline style
        const leftPanel = document.getElementById('lib-panel-left');
        const rightPanel = document.getElementById('lib-panel-right');
        if (leftPanel) { leftPanel.style.top = ''; leftPanel.style.maxHeight = ''; leftPanel.style.height = ''; }
        if (rightPanel) { rightPanel.style.top = ''; rightPanel.style.maxHeight = ''; rightPanel.style.height = ''; }

        // 标题缩放
        const tc = document.querySelector('.title-container');
        if (tc) {
            tc.style.transform = 'scale(' + ratio + ')';
            tc.style.transformOrigin = 'top left';
            tc.style.left = (20 * ratio) + 'px';
            tc.style.top = (20 * ratio) + 'px';
        }

        // lib-toggle 缩放
        const toggle = document.getElementById('lib-toggle');
        if (toggle) {

            toggle.style.transformOrigin = 'top right';

        }

        // input：清空手机端 inline style
        const ci = document.getElementById('char-input');

        // 大框上边线与字库面板上边线对齐

        const lp = document.getElementById('lib-panel-left');
        const mainDisplay = document.querySelector('.main-display');
        if (lp && mainDisplay && !lp.classList.contains('collapsed')) {
            const wrapperH = wrapper.clientHeight || (availH / ratio);
            const panelH = lp.offsetHeight || 765;
            const panelTopDesign = 0.55 * wrapperH - panelH / 2;
            // 标题固定在左上角，大框居中不与其水平重叠，因此可直接对齐面板顶部
            container.style.paddingTop = Math.max(panelTopDesign, 8) + 'px';

        wrapper.offsetHeight; // force reflow
    }

    if (isPhoneLayout() && typeof libExpanded !== 'undefined' && libExpanded) {
        libExpanded = false;
        const _lp = document.getElementById('lib-panel-left');
        const _rp = document.getElementById('lib-panel-right');

    function adjustMobileLayout() {
        const multiCards = document.getElementById('multi-char-cards');
        const keyboard = document.getElementById('wubi-keyboard');

        // 始终保持多汉字拆分在键盘上方
        if (multiCards.nextElementSibling !== keyboard) {

    }
    adjustMobileLayout();
    window.addEventListener('load', function() { adjustMobileLayout(); });

    // 页面完全加载后兜底重算一次
    window.addEventListener('load', function() {
        setTimeout(applyScale, 100);
    });

    // 窗口大小变化时自适应缩放（含手机横竖屏旋转）
    // 使用 requestAnimationFrame 延迟读取尺寸，避开 iOS 旋转瞬间 resize 返回旧值的 bug
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
            requestAnimationFrame(applyScale);

    // 旋转事件：优先使用现代 screen.orientation API，回退到废弃的 orientationchange
    if (window.screen && screen.orientation && typeof screen.orientation.addEventListener === 'function') {
        screen.orientation.addEventListener('change', function() {
            clearTimeout(resizeTimer);
            // 旋转后等待布局稳定再重算，300ms 避开 iOS 尺寸更新延迟
            resizeTimer = setTimeout(function() {
                requestAnimationFrame(applyScale);
            }, 300);
        });
    } else {

        window.addEventListener('orientationchange', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                requestAnimationFrame(applyScale);

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                requestAnimationFrame(applyScale);
            }, 150);
        });

// ==================== 多汉字拆分卡片（V20 新增） ====================
// 所有函数/变量均加 multi 前缀，避免与现有逻辑冲突。
// 卡片使用独立的 SVG 元素，不复用 #char-svg。

// 计算字根笔画数（支持复合字根递归展开）
function multiRootStrokeCount(root) {
    if (RADICAL_STROKES[root] !== undefined) return RADICAL_STROKES[root];
    const w = WUBI[root];
    if (w && w.r && w.r.length >= 2 && w.r[0] !== root) {
        const expanded = recursivelyExpandRoots([...w.r], root);
        return expanded.reduce((s, r) => s + (RADICAL_STROKES[r] || 1), 0);
    }
    return 1;
}

// 计算编码与字根的颜色（简化版：字根>4时前3+末，补码用青色）
// 返回 { rootColors: 按字根索引, codeColors: 按编码索引 }
function multiComputeColors(wubiData) {
    const roots = wubiData.r || [];
    const code = wubiData.c || '';
    const sup = wubiData.sup || [];
    const codeLen = code.length;
    const rootColors = [];
    const codeColors = [];

    // 字根索引 -> 编码索引（与主显示规则一致：>4字根取前3+末）
    const rootToCode = [];
    if (roots.length > 4) {
        for (let i = 0; i < 3; i++) rootToCode.push(i);
        for (let i = 3; i < roots.length - 1; i++) rootToCode.push(-1);
        rootToCode.push(codeLen - 1);
    } else {
        for (let i = 0; i < roots.length; i++) rootToCode.push(i < codeLen ? i : -1);
        // 字根数 < 编码数：末字根对应末位编码（识别码），前面的字根按序对应
        if (roots.length < codeLen && roots.length > 0) {
            rootToCode[roots.length - 1] = codeLen - 1;
        }
    }

    // 非补码编码位置的颜色索引（从0递增）
    function nonSupColorIdx(ci) {
        let n = 0;
        for (let k = 0; k < ci; k++) if (!sup.includes(k)) n++;
        return n;
    }

    for (let ri = 0; ri < roots.length; ri++) {
        const ci = rootToCode[ri];
        if (ci === -1) {
            rootColors.push('#888'); // 中间跳过的字根（>4字根时）
        } else if (sup.includes(ci)) {
            rootColors.push('#00BCD4');
        } else {
            rootColors.push(ROOT_COLORS[nonSupColorIdx(ci) % ROOT_COLORS.length]);
        }
    }
    for (let ci = 0; ci < codeLen; ci++) {
        if (sup.includes(ci)) {
            codeColors.push('#00BCD4');
        } else {
            codeColors.push(ROOT_COLORS[nonSupColorIdx(ci) % ROOT_COLORS.length]);
        }
    }
    return { rootColors, codeColors };
}

// 简化版 strokeRootMap（回退用）：按字根顺序和笔画数依次分配笔画颜色
function multiBuildStrokeColors(strokeList, wubiData) {
    if (!wubiData || !wubiData.r || wubiData.r.length === 0) {
        return strokeList.map(() => '#555');
    }
    const { rootColors } = multiComputeColors(wubiData);
    const roots = wubiData.r;
    const colors = [];
    let strokeIdx = 0;
    for (let ri = 0; ri < roots.length; ri++) {
        const n = multiRootStrokeCount(roots[ri]);
        const color = rootColors[ri] || '#555';
        for (let k = 0; k < n && strokeIdx < strokeList.length; k++) {
            colors.push(color);
            strokeIdx++;
        }
    }
    while (colors.length < strokeList.length) colors.push('#555');
    return colors;
}

// 获取笔画数据（含特殊字符替换，委托给 getStrokeData）
async function fetchMultiCardStrokes(ch) {
    const data = await getStrokeData(ch);
    return data.strokes;
}

// 计算卡片字根列表和对应颜色（在全局变量仍为卡片字数据时调用）
// 返回 [{ root, color, keyLetter }] 数组
function computeMultiCardRootsInfo(ch) {
    const wubiData = WUBI[ch];
    if (!wubiData || !roots || roots.length === 0) return [];

    const supIndices = wubiData.sup || [];
    const codeLen = rootCode ? rootCode.length : 0;
    const colorIdxMap = rootCode ? rootCode.split('').map((_, i) => i) : [];

    // 字根→编码索引映射（与 renderInfo 逻辑完全一致）
    const rootToCodeIndex = [];
    if (roots.length > 4) {
        // 检查重复字根索引
        const rootMapCounts = {};
        for (const ri of strokeRootMap) {
            rootMapCounts[ri] = (rootMapCounts[ri] || 0) + 1;
        }
        const hasRepeatedRoots = Object.values(rootMapCounts).some(c => c > 1);
        if (hasRepeatedRoots && roots.length <= codeLen) {
            const uniqueRootIndices = Array.from(new Set(strokeRootMap.filter(r => r >= 0))).sort((a, b) => a - b);
            const rootIndexToCodeIndex = {};
            let codePos = 0;
            for (const uri of uniqueRootIndices) {
                rootIndexToCodeIndex[uri] = codePos < codeLen ? codePos : -1;
                codePos++;
            }
            for (let i = 0; i < roots.length; i++) {
                rootToCodeIndex.push(rootIndexToCodeIndex[i] !== undefined ? rootIndexToCodeIndex[i] : -1);
            }
        } else {
            for (let i = 0; i < 3; i++) rootToCodeIndex.push(colorIdxMap[i]);
            for (let i = 3; i < roots.length - 1; i++) rootToCodeIndex.push(-1);
            rootToCodeIndex.push(colorIdxMap[colorIdxMap.length - 1]);
        }
    } else if (roots.length < codeLen) {
        // 字根数 < 编码数：按非补码编码位置映射，末字根对应末位编码
        // 单字根字符（如王=GGGG、一=GGLL、乙=NNLL）：无论编码是否全相同，都映射到位0
        if (roots.length === 1) {
            rootToCodeIndex.push(colorIdxMap[0]);
        } else {
            const rootCodeIndices = [];
            for (let i = 0; i < codeLen; i++) {
                if (!supIndices.includes(i)) rootCodeIndices.push(i);
            }
            for (let i = 0; i < roots.length - 1; i++) rootToCodeIndex.push(colorIdxMap[rootCodeIndices[i]]);
            rootToCodeIndex.push(colorIdxMap[rootCodeIndices[rootCodeIndices.length - 1]]);
        }
    } else {
        for (let i = 0; i < roots.length; i++) rootToCodeIndex.push(colorIdxMap[i]);
    }

    // swapLast 字根顺序调整
    const rootCustom = CUSTOM_STROKE_ORDER[ch];
    let displayRoots = [...roots];
    let displayCodeIdx = [...rootToCodeIndex];
    if (rootCustom && rootCustom.swapLast && ch !== '乃' && ch !== '刀' && ch !== '力' && wubiData && rootCustom.condition(wubiData, ch) && displayRoots.length > 2) {
        const n = displayRoots.length;
        [displayRoots[n-2], displayRoots[n-1]] = [displayRoots[n-1], displayRoots[n-2]];
        [displayCodeIdx[n-2], displayCodeIdx[n-1]] = [displayCodeIdx[n-1], displayCodeIdx[n-2]];
    }

    // roots 已经是展开后的基本字根数组，无需再展开
    // displayRoots 和 displayCodeIdx 已在上面通过 swapLast 处理完毕

    // 构建结果：跳过不参与编码的字根
    const result = [];
    for (let i = 0; i < displayRoots.length; i++) {
        const r = displayRoots[i];
        if (r === '') continue;
        const codeIdx = displayCodeIdx[i];
        if (codeIdx === -1 || codeIdx >= codeLen) continue;
        const color = rootColorMap[codeIdx] || '#555';
        const keyLetter = rootCode[codeIdx] || '';
        result.push({ root: r, color, keyLetter });
    }
    return result;
}

// 计算补码小框信息（在全局变量仍为卡片字数据时调用）
// 返回 { hasSup, supStrokeIdx } 或 null
function computeMultiCardSupInfo(ch, strokeList) {
    const wubiData = WUBI[ch];
    if (!wubiData) return null;
    const supIndices = wubiData.sup || [];
    const hasSup = supIndices.length > 0;
    if (!hasSup) return { hasSup: false, supStrokeIdx: -1 };

    // 与 renderSVG 中的补码定位逻辑保持一致
    const endStrokeIdx = wubiData.endStroke;
    let actualEndStroke = strokes.length - 1;

    if (endStrokeIdx !== undefined) {
        actualEndStroke = endStrokeIdx;
    } else if (wubiData.r && Array.isArray(wubiData.r)) {
        const charRoots = wubiData.r;
        // 囗结构
        if (charRoots.includes('囗')) {
            const weiIdx = charRoots.indexOf('囗');
            for (let i = strokes.length - 1; i >= 0; i--) {
                if (strokeRootMap[i] !== undefined && strokeRootMap[i] !== weiIdx && strokeRootMap[i] >= 0) {
                    actualEndStroke = i;
                    break;
                }
            }
        }
        // 匚结构
        if ((roots || []).includes('匚')) {
            const fuIdx = roots.indexOf('匚');
            for (let i = strokes.length - 1; i >= 0; i--) {
                if (strokeRootMap[i] !== undefined && strokeRootMap[i] !== fuIdx && strokeRootMap[i] >= 0) {
                    actualEndStroke = i;
                    break;
                }
            }
        }
    }

    // 辶/廴 半包围结构
    const walkRoots = (roots || []);
    const walkIdx = walkRoots.indexOf('辶') !== -1 ? walkRoots.indexOf('辶') :
                    (walkRoots.indexOf('廴') !== -1 ? walkRoots.indexOf('廴') : -1);
    if (walkIdx !== -1 && strokeRootMap && strokeRootMap.length > 0) {
        // 非连续字根：取最后一个字根（最大rootIdx）的末笔
        let maxInnerRootIdx = -1;
        for (let i = 0; i < strokes.length; i++) {
            const rootIdx = strokeRootMap[i];
            if (rootIdx !== undefined && rootIdx !== walkIdx && rootIdx >= 0) {
                if (rootIdx > maxInnerRootIdx) maxInnerRootIdx = rootIdx;
            }
        }
        let innerLast = -1;
        if (maxInnerRootIdx >= 0) {
            for (let i = strokes.length - 1; i >= 0; i--) {
                if (strokeRootMap[i] === maxInnerRootIdx) {
                    innerLast = i;
                    break;
                }
            }
        }
        if (innerLast < 0) {
            for (let i = strokes.length - 1; i >= 0; i--) {
                if (strokeRootMap[i] !== undefined && strokeRootMap[i] !== walkIdx && strokeRootMap[i] >= 0) {
                    innerLast = i;
                    break;
                }
            }
        }
        if (innerLast >= 0) actualEndStroke = innerLast;
    }

    // swap 后补码定位修正
    if (strokeRootMap && strokeRootMap.length > 0 && (roots || []).length > 0) {
        const lastRootIdx = roots.length - 1;
        const lastRootChar = roots[lastRootIdx];
        if (lastRootChar !== '辶' && lastRootChar !== '廴') {
            let lastRootStrokes = [];
            for (let i = 0; i < strokes.length; i++) {
                if (strokeRootMap[i] === lastRootIdx) lastRootStrokes.push(i);
            }
            const originalRoots = wubiData.r || [];
            const lastOriginalRoot = originalRoots.length > 0 ? originalRoots[originalRoots.length - 1] : lastRootChar;
            // 检查戈/戋钩后丶丿模式：同时检查原始末字根和展开后末字根
            // 戔→展开为[戈,戈]，原始末字根戔不匹配，但展开后末字根戈匹配
            const _checkGeHouMC = (rootName) => {
                const w = WUBI[rootName];
                return w && w.r && w.r.length >= 3
                    && (w.r.includes('㇂') || w.r.includes('乚'))
                    && w.r[w.r.length - 2] === '丶'
                    && w.r[w.r.length - 1] === '丿';
            };
            const hasGeHouPattern = ch !== '线' && (
                _checkGeHouMC(lastOriginalRoot) || _checkGeHouMC(lastRootChar)
            );
            if (hasGeHouPattern) {
                if (lastRootStrokes.length >= 2) {
                    actualEndStroke = lastRootStrokes[lastRootStrokes.length - 2];
                }
            } else if (lastRootStrokes.length >= 2) {
                actualEndStroke = lastRootStrokes[lastRootStrokes.length - 1];
            } else if (lastRootStrokes.length === 1) {
                actualEndStroke = lastRootStrokes[0];
            }
        }
    }

    // 彧：补码高亮取整个汉字的最后一笔
    if (ch === '彧') {
        actualEndStroke = strokes.length - 1;
    }

    // 豖及含豖作为基字的字：补码高亮取整字末笔
    if (ch === '豖' ||
        (wubiData?.r || []).includes('豖') ||
        (wubiData?.r || []).includes('冢')) {
        actualEndStroke = strokes.length - 1;
    }

    // 龙及含龙作为末字根的字：补码高亮取倒数第三笔（乚）
    // 仅当龙是最后一个字根时才生效（如龙本身），聋(龙+耳)的末字根是耳，不应触发
    if (ch === '龙' ||
        ((wubiData?.r || []).length > 0 && (wubiData?.r || [])[(wubiData?.r || []).length - 1] === '龙')) {
        actualEndStroke = strokes.length - 3;
    }

    // 槤漣涟梿琏莲蓮链笾鏈等含连/連/边基字的字：
    // 补码高亮取整字最后一笔（辶的末笔），不取被辶包围部分的末笔
    if ((wubiData?.r || []).includes('连') ||
        (wubiData?.r || []).includes('連') ||
        (wubiData?.r || []).includes('边')) {
        actualEndStroke = strokes.length - 1;
    }

    return { hasSup: true, supStrokeIdx: actualEndStroke };
}

                const _origWubi = WUBI[_origRoot];
                if (_origWubi && _origWubi.r && _origWubi.r.length >= 2
                    && _origWubi.r[0] !== _origRoot
                    && !_KEY_NAMES_SET_SWAP.has(_origRoot)
                    && !RADICAL_CHARS.has(_origRoot)
                    && _origRoot !== currentChar) {
                    const _expanded = recursivelyExpandRoots([_origRoot], currentChar);
                    const _indices = [];
                    for (let _k = 0; _k < _expanded.length; _k++) {
                        _indices.push(_expIdxCounter++);
                    }
                    _origToExpIndices[_ori] = _indices;
                } else {
                    _origToExpIndices[_ori] = [_expIdxCounter++];
                }
            }

            let strokeOffset = 0;
            for (let ri = 0; ri < wubi.r.length; ri++) {
                const rootChar = wubi.r[ri];
                let rootStrokeCount = RADICAL_STROKES[rootChar] || 1;
                const rootWubi = WUBI[rootChar];
                if (rootWubi && rootWubi.r && !RADICAL_CHARS.has(rootChar) &&
                    rootWubi.r[0] !== rootChar && rootChar !== currentChar) {
                    const supSet = new Set(rootWubi.sup || []);
                    const expandedSubRoots = rootWubi.r.filter((_, idx) => !supSet.has(idx));
                    rootStrokeCount = 0;
                    for (const sr of expandedSubRoots) {
                        rootStrokeCount += RADICAL_STROKES[sr] || 1;
                    }
                }
                // 检查该字根是否有 swapLast（排除分/切，避免双重交换）
                const rootCustomOrder = CUSTOM_STROKE_ORDER[rootChar];
                let needsSwap = false;
                if (rootCustomOrder && rootCustomOrder.swapLast && rootWubi &&
                    rootCustomOrder.condition(rootWubi, currentChar) && rootChar !== currentChar
                    && rootChar !== '分' && rootChar !== '切') {
                    needsSwap = true;
                }
                if (needsSwap && rootStrokeCount >= 2) {
                    const i1 = strokeOffset + rootStrokeCount - 2;
                    const i2 = strokeOffset + rootStrokeCount - 1;
                    // 用展开索引映射验证两笔都属于当前字根
                    const _expIdxForRi = _origToExpIndices[ri] || [ri];
                    if (_expIdxForRi.includes(strokeRootMap[i1]) && _expIdxForRi.includes(strokeRootMap[i2])) {
                        [strokes[i1], strokes[i2]] = [strokes[i2], strokes[i1]];
                        [strokeRootMap[i1], strokeRootMap[i2]] = [strokeRootMap[i2], strokeRootMap[i1]];
                        strokeRootMapForDisplay = [...strokeRootMap];
                    }
                }
                // 递归检查子字根是否有 swapLast（如励=[厉,力]，力需交换）
                if (rootWubi && rootWubi.r && !RADICAL_CHARS.has(rootChar) &&
                    rootWubi.r[0] !== rootChar && rootChar !== currentChar
                    && !NON_CONTINUOUS_CHARS.has(rootChar)) {
                    const supSet2 = new Set(rootWubi.sup || []);
                    const subRoots = rootWubi.r.filter((_, idx) => !supSet2.has(idx));
                    let subOffset = strokeOffset;
                    for (const sr of subRoots) {
                        const srWubi = WUBI[sr];
                        let srStrokeCount = RADICAL_STROKES[sr];
                        if (srStrokeCount === undefined && srWubi && srWubi.r && !RADICAL_CHARS.has(sr)) {
                            srStrokeCount = 0;
                            for (const subSr of srWubi.r) {
                                srStrokeCount += RADICAL_STROKES[subSr] || 1;
                            }
                        }
                        srStrokeCount = srStrokeCount || 1;
                        const srCustom = CUSTOM_STROKE_ORDER[sr];
                        let srNeedsSwap = false;
                        if (srCustom && srCustom.swapLast && srWubi && srCustom.condition(srWubi, currentChar) && sr !== currentChar) {
                            srNeedsSwap = true;
                        }
                        if (srNeedsSwap && srStrokeCount >= 2) {
                            const i1 = subOffset + srStrokeCount - 2;
                            const i2 = subOffset + srStrokeCount - 1;
                            [strokes[i1], strokes[i2]] = [strokes[i2], strokes[i1]];
                            [strokeRootMap[i1], strokeRootMap[i2]] = [strokeRootMap[i2], strokeRootMap[i1]];
                            strokeRootMapForDisplay = [...strokeRootMap];
                        }
                        subOffset += srStrokeCount;
                    }
                }
                strokeOffset += rootStrokeCount;
            }
        }

        // 通过 renderInfo 构建颜色映射（同时更新DOM，稍后恢复）
        renderInfo();

        // 捕获笔画颜色和swap后的笔画路径（颜色与strokes一一对应）
        const colors = [...strokeColorMap];
        const swappedStrokes = [...strokes];

        // 捕获字根列表和对应颜色（与主显示字根图例逻辑一致）
        const cardRootsInfo = computeMultiCardRootsInfo(ch);

        // 捕获补码小框信息
        const supInfo = computeMultiCardSupInfo(ch, strokeList);

        // 恢复全局状态
        currentChar = _saved.currentChar;
        strokes = _saved.strokes;
        roots = _saved.roots;
        rootCode = _saved.rootCode;
        strokeRootMap = _saved.strokeRootMap;
        strokeRootMapForDisplay = _saved.strokeRootMapForDisplay;
        highlightStroke = _saved.highlightStroke;
        rootColorMap = _saved.rootColorMap;
        strokeColorMap = _saved.strokeColorMap;
        radStrokes = _saved.radStrokes;

        // 重新渲染主显示以恢复DOM
        if (!suppressMainRender) {
            renderInfo();
            renderSVG();
            renderKeyboard();
        }

        return { colors, swappedStrokes, cardRootsInfo, supInfo };
    } catch (e) {
        // 出错时恢复
        currentChar = _saved.currentChar;
        strokes = _saved.strokes;
        roots = _saved.roots;
        rootCode = _saved.rootCode;
        strokeRootMap = _saved.strokeRootMap;
        strokeRootMapForDisplay = _saved.strokeRootMapForDisplay;
        highlightStroke = _saved.highlightStroke;
        rootColorMap = _saved.rootColorMap;
        strokeColorMap = _saved.strokeColorMap;
        radStrokes = _saved.radStrokes;
        if (!suppressMainRender) {
            renderInfo();
            renderSVG();
            renderKeyboard();
        }
        return null;
    }
}

// 在卡片的小 SVG 上渲染着色笔画
function renderMultiCardSVG(svg, strokeList, colors) {
    svg.innerHTML = '';
    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('width', '1024');
    bg.setAttribute('height', '1024');
    bg.setAttribute('fill', '#fff');
    svg.appendChild(bg);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', 'translate(0, 900) scale(1, -1)');
    svg.appendChild(g);
    strokeList.forEach((d, i) => {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', colors[i] || '#555');
        path.setAttribute('stroke', '#333');
        path.setAttribute('stroke-width', '0.5');
        g.appendChild(path);
    });
}

// 在卡片的小 SVG 上渲染补码小框（末笔高亮，其余灰色）
function renderMultiCardSupSVG(svg, strokeList, supStrokeIdx) {
    svg.innerHTML = '';
    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('width', '1024');
    bg.setAttribute('height', '1024');
    bg.setAttribute('fill', '#fff');
    svg.appendChild(bg);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', 'translate(0, 900) scale(1, -1)');
    svg.appendChild(g);
    strokeList.forEach((d, i) => {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        if (i === supStrokeIdx) {
            path.setAttribute('fill', '#00BCD4');
            path.setAttribute('stroke', '#0097A7');
            path.setAttribute('stroke-width', '10');
            path.setAttribute('stroke-linejoin', 'round');
            path.setAttribute('stroke-linecap', 'round');
        } else {
            path.setAttribute('fill', '#ccc');
            path.setAttribute('stroke', '#aaa');
            path.setAttribute('stroke-width', '0.5');
        }
        g.appendChild(path);
    });
}

// 创建单张卡片占位元素
function createMultiCardElement(ch) {
    const card = document.createElement('div');
    card.className = 'multi-card';
    card.dataset.char = ch;
    card.innerHTML =
        '<div class="multi-card-svg-wrap">' +
            '<svg class="multi-card-svg" viewBox="0 0 1024 1024"></svg>' +
            '<div class="multi-card-loading">加载中…</div>' +
            '<div class="multi-card-sup-box" style="display:none;position:absolute;top:1px;right:1px;background:rgba(0,0,0,0.75);border-radius:2px;padding:1px;">' +
                '<svg class="multi-card-sup-svg" viewBox="0 0 1024 1024" style="width:18px;height:18px;display:block;"></svg>' +
            '</div>' +
        '</div>' +
        '<div class="multi-card-code"></div>' +
        '<div class="multi-card-roots"></div>';
    card.addEventListener('click', () => {
        const c = card.dataset.char;
        // 对比模式卡片：只切换方案，大框跟随切换，不重复跳转
        if (card.dataset.compareVer) {
            setWubiVersion(card.dataset.compareVer);
            const target = document.querySelector('.char-display');
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            return;
        }
        // 更新多字循环模式的索引，使"下一个"从当前点击的字继续
        if (multiCharList.length > 0 && multiCharList.includes(c)) {
            multiCharIndex = multiCharList.indexOf(c);
        }
        // 跳转到该字的主显示
        if (CHAR_LIST.includes(c)) {
            charIndex = CHAR_LIST.indexOf(c);
        }
        appReady = true;
        loadAndRender(c);
        const target = document.querySelector('.char-display');
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    return card;
}

// 异步填充单张卡片（编码/字根同步，SVG 异步获取笔画数据+同步计算颜色）
async function fillMultiCard(card, ch) {
    const wubiData = WUBI[ch];
    const codeDiv = card.querySelector('.multi-card-code');
    const rootsDiv = card.querySelector('.multi-card-roots');
    const svg = card.querySelector('.multi-card-svg');
    const loading = card.querySelector('.multi-card-loading');

    // 编码着色（同步，不需要笔画数据）
    if (!wubiData || !wubiData.c) {
        codeDiv.innerHTML = '<span style="color:#e67e22;font-size:13px">未收录</span>';
        rootsDiv.innerHTML = '<span style="color:#888">—</span>';
    } else {
        const { codeColors } = multiComputeColors(wubiData);
        codeDiv.innerHTML = wubiData.c.split('').map((c, i) =>
            '<span style="color:' + (codeColors[i] || '#ddd') + ';font-weight:bold">' + c + '</span>'
        ).join('');
    }

    // SVG 着色：异步获取笔画数据 → 同步用完整拆分逻辑计算颜色
    try {
        const strokeList = await fetchMultiCardStrokes(ch);
        const supBox = card.querySelector('.multi-card-sup-box');
        const supSvg = card.querySelector('.multi-card-sup-svg');
        // 优先使用完整拆分逻辑，失败时回退到简化版
        const result = computeMultiCardColors(ch, strokeList);
        if (result && result.colors && result.colors.length === strokeList.length) {
            // 使用swap后的笔画路径，确保颜色与路径一一对应
            const renderStrokes = result.swappedStrokes || strokeList;
            renderMultiCardSVG(svg, renderStrokes, result.colors);
            // 渲染补码小框（也用swap后的笔画）
            if (result.supInfo && result.supInfo.hasSup && supBox && supSvg) {
                renderMultiCardSupSVG(supSvg, renderStrokes, result.supInfo.supStrokeIdx);
                supBox.style.display = 'block';
            } else if (supBox) {
                supBox.style.display = 'none';
            }
            // 渲染字根列表（用展开后的字根和对应颜色）
            if (result.cardRootsInfo && result.cardRootsInfo.length > 0) {
                rootsDiv.innerHTML = result.cardRootsInfo.map(info =>
                    '<span class="multi-root-tag" style="color:' + info.color +
                    ';border-color:' + info.color + '">' + info.root + '</span>'
                ).join('');
            }
        } else {
            const fallbackColors = multiBuildStrokeColors(strokeList, wubiData);
            renderMultiCardSVG(svg, strokeList, fallbackColors);
            if (supBox) supBox.style.display = 'none';
            // 回退字根显示
            if (wubiData && wubiData.r) {
                const { rootColors } = multiComputeColors(wubiData);
                rootsDiv.innerHTML = wubiData.r.map((r, ri) =>
                    '<span class="multi-root-tag" style="color:' + (rootColors[ri] || '#888') +
                    ';border-color:' + (rootColors[ri] || '#888') + '">' + r + '</span>'
                ).join('');
            }
        }
        if (loading) loading.style.display = 'none';
    } catch (err) {
        if (loading) { loading.textContent = '无笔画数据'; loading.style.color = '#888'; }
        svg.innerHTML = '';
    }
}

// 清除多汉字卡片区域
function clearMultiCharCards() {
    const container = document.getElementById('multi-char-cards');
    if (container) {
        container.style.display = 'none';
        container.innerHTML = '';
    }
    // 清除多字循环模式
    multiCharList = [];
    multiCharIndex = -1;
}

// 渲染多汉字拆分卡片
function renderMultiCharCards(chars) {
    const container = document.getElementById('multi-char-cards');
    if (!container) return;
    container.style.display = 'flex';
    container.innerHTML = '';

    // 标题栏
    const header = document.createElement('div');
    header.className = 'multi-cards-header';
    const title = document.createElement('span');
    title.textContent = '多汉字拆分（共 ' + chars.length + ' 字）· 点击卡片可跳转到大框';
    header.appendChild(title);
    const clearBtn = document.createElement('button');
    clearBtn.className = 'multi-clear-btn';
    clearBtn.textContent = '✕ 清除';
    clearBtn.addEventListener('click', clearMultiCharCards);
    header.appendChild(clearBtn);
    container.appendChild(header);

    // 创建所有卡片占位
    const cards = chars.map(ch => {
        const card = createMultiCardElement(ch);
        container.appendChild(card);
        return card;
    });

    // 顺序异步填充每张卡片（避免全局变量竞争）
    (async () => {
        for (let i = 0; i < chars.length; i++) {
            await fillMultiCard(cards[i], chars[i]);
        }
    })();

    // 滚动到卡片区域
    setTimeout(() => {
        container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
}

// ==================== 三版对比模式 ====================
let compareModeActive = false;
let suppressMainRender = false;
let compareRenderBusy = false;
const COMPARE_VERSIONS = [
    { ver: '86', bodyId: 'compare-body-86', getWubi: () => WUBI_86, getKouju: () => WUBI_KOuju_86, getRootTable: () => WUBI_ROOT_TABLE_86, getKeyNames: () => KEY_NAMES, getRadicalChars: () => RADICAL_CHARS_86 },
    { ver: '98', bodyId: 'compare-body-98', getWubi: () => WUBI_98, getKouju: () => WUBI_KOuju_98, getRootTable: () => WUBI_ROOT_TABLE_98, getKeyNames: () => KEY_NAMES_98, getRadicalChars: () => RADICAL_CHARS_98 },
    { ver: '06', bodyId: 'compare-body-06', getWubi: () => WUBI_06, getKouju: () => WUBI_KOuju_06, getRootTable: () => WUBI_ROOT_TABLE_06, getKeyNames: () => KEY_NAMES_06, getRadicalChars: () => RADICAL_CHARS_06 }
];

function toggleCompareMode() {
    compareModeActive = !compareModeActive;
    const btn = document.getElementById('compare-toggle');
    const panel = document.getElementById('compare-panel');
    if (compareModeActive) {
        if (btn) { btn.classList.add('active'); }
        if (panel) panel.style.display = 'block';
        renderCompareMode();
    } else {
        if (btn) { btn.classList.remove('active'); }
        if (panel) panel.style.display = 'none';
    }
}

async function renderCompareMode() {
    const panel = document.getElementById('compare-panel');
    if (!panel) return;
    // 防重入：若已有渲染在进行，跳过本次（进行中的渲染会读取最新版本/字）
    if (compareRenderBusy) return;
    compareRenderBusy = true;
    try {
    // 清空三列
    COMPARE_VERSIONS.forEach(v => {
        const body = document.getElementById(v.bodyId);
        if (body) body.innerHTML = '<div style="font-size:12px;color:#888">加载中…</div>';
    });
    const ch = currentChar || (document.getElementById('char-input') ? document.getElementById('char-input').value.trim()[0] : '');
    if (!ch) return;

    // 保存当前活动版本
    const activeVersion = currentWubiVersion;

    // 渲染卡片期间抑制主显示重新渲染，避免卡片临时切换 WUBI 干扰大框
    suppressMainRender = true;

    // 依次渲染三个版本（临时切换全局，fillMultiCard 内部会保存/恢复渲染全局）
    for (const v of COMPARE_VERSIONS) {
        // 临时切换全局字典
        WUBI = v.getWubi();
        WUBI_KOuju = v.getKouju();
        WUBI_ROOT_TABLE = v.getRootTable();
        keyNamesDisplay = v.getKeyNames();
        RADICAL_CHARS = v.getRadicalChars();
        currentWubiVersion = v.ver;
        const body = document.getElementById(v.bodyId);
        if (!body) continue;
        body.innerHTML = '';
        try {
            const card = createMultiCardElement(ch);
            card.classList.add('compare-mode-card');
            // 标记对比卡片：点击时切方案，大框跟随，由 createMultiCardElement 内置 handler 处理
            card.dataset.compareVer = v.ver;
            body.appendChild(card);
            await fillMultiCard(card, ch);
        } catch (e) {
            body.innerHTML = '<div style="font-size:12px;color:#e74c3c">渲染失败：' + (e && e.message ? e.message : e) + '</div>';
        }
    }

    // 恢复活动版本全局
    WUBI = activeVersion === '98' ? WUBI_98 : activeVersion === '06' ? WUBI_06 : WUBI_86;
    WUBI_KOuju = activeVersion === '98' ? WUBI_KOuju_98 : activeVersion === '06' ? WUBI_KOuju_06 : WUBI_KOuju_86;
    WUBI_ROOT_TABLE = activeVersion === '98' ? WUBI_ROOT_TABLE_98 : activeVersion === '06' ? WUBI_ROOT_TABLE_06 : WUBI_ROOT_TABLE_86;
    keyNamesDisplay = activeVersion === '98' ? KEY_NAMES_98 : activeVersion === '06' ? KEY_NAMES_06 : KEY_NAMES;
    RADICAL_CHARS = activeVersion === '98' ? RADICAL_CHARS_98 : activeVersion === '06' ? RADICAL_CHARS_06 : RADICAL_CHARS_86;
    currentWubiVersion = activeVersion;
    suppressMainRender = false;
    // 用当前活动版本重渲染主显示
    if (currentChar) {
        renderInfo();
        renderSVG();
        renderKeyboard();
    }
    } finally {
        compareRenderBusy = false;
    }
}

// 初始化默认版本为新世纪
(function initDefaultVersion() {
    if (typeof setWubiVersion === 'function') {
        setWubiVersion(currentWubiVersion);
    }
})();

// 默认开启三版对比
(function initCompareDefault() {
    compareModeActive = true;
    const btn = document.getElementById('compare-toggle');
    if (btn) btn.classList.add('active');
    const panel = document.getElementById('compare-panel');
    if (panel) panel.style.display = 'block';
    const loadAndRefresh = () => {
        if (typeof renderCompareMode === 'function') renderCompareMode();
    };
    if (document.readyState === 'complete') {
        setTimeout(loadAndRefresh, 150);
    } else {
        window.addEventListener('load', function() { setTimeout(loadAndRefresh, 150); });
    }
})();


// ==================== 打赏弹窗 ====================
function openDonateModal() {
    document.getElementById('donate-overlay').classList.add('show');
}
function closeDonateModal(event) {
    if (event && event.stopPropagation) event.stopPropagation();
    document.getElementById('donate-overlay').classList.remove('show');
}
