        result[1] = 0;   // 第2笔 → 氺侧
        result[2] = 0;   // 第3笔 → 氺侧
        result[3] = 1;   // 第4笔 → 儿
        result[4] = 0;   // 第5笔 → 氺侧
        result[5] = 0;   // 第6笔 → 氺侧
        return result;
    }

    // 乘字模式：r=['禾','北'] 展开后=['禾','丬','匕']，r=3,n=10
    // 禾的笔画分布在首尾，中间被北展开的丬和匕填充
    // 映射: [0,0,0,1,1,1,2,2,0,0]
    else if (roots[0] === '禾' && roots[1] === '丬' && roots[2] === '匕' && n === 10) {
        result[0] = 0;   // 笔1 → 禾
        result[1] = 0;   // 笔2 → 禾
        result[2] = 0;   // 笔3 → 禾
        result[3] = 1;   // 笔4 → 丬
        result[4] = 1;   // 笔5 → 丬
        result[5] = 1;   // 笔6 → 丬
        result[6] = 2;   // 笔7 → 匕
        result[7] = 2;   // 笔8 → 匕
        result[8] = 0;   // 笔9 → 禾
        result[9] = 0;   // 笔10 → 禾
        return result;
    }

    // 奭字模式：r=['大','皕'] 展开后=['大','丆','日','丆','日']，r=5,n=15
    // 大(3笔)的第1笔(横)在开头，第2、3笔(撇、捺)在末尾，中间填充皕的展开字根
    // 映射: [0, 1,1, 2,2,2,2, 3,3, 4,4,2,2, 0,0]
    else if (currentChar === '奭' && roots[0] === '大' && roots.length === 5 && n === 15) {
        result[0]  = firstRootIdx + 0;  // 笔1 → 大
        result[1]  = firstRootIdx + 1;  // 笔2 → 丆
        result[2]  = firstRootIdx + 1;  // 笔3 → 丆
        result[3]  = firstRootIdx + 2;  // 笔4 → 日
        result[4]  = firstRootIdx + 2;  // 笔5 → 日
        result[5]  = firstRootIdx + 2;  // 笔6 → 日
        result[6]  = firstRootIdx + 2;  // 笔7 → 日
        result[7]  = firstRootIdx + 3;  // 笔8 → 丆
        result[8]  = firstRootIdx + 3;  // 笔9 → 丆
        result[9]  = firstRootIdx + 4;  // 笔10 → 日
        result[10] = firstRootIdx + 4;  // 笔11 → 日
        result[11] = firstRootIdx + 4;  // 笔12 → 日
        result[12] = firstRootIdx + 4;  // 笔13 → 日
        result[13] = firstRootIdx + 0;  // 笔14 → 大
        result[14] = firstRootIdx + 0;  // 笔15 → 大
        return result;
    }

    // 官字模式：r=['宀','コ','丨','コ']，r=4,n=8
    // 第1-3笔→宀，第4笔→丨，第5-6笔→第二个コ，第7-8笔→第四个コ
    // 映射: [0,0,0, 2, 1,1, 3,3]
    else if (currentChar === '官' && roots[0] === '宀' && roots.length === 4 && n === 8) {
        result[0] = firstRootIdx + 0;  // 笔1 → 宀
        result[1] = firstRootIdx + 0;  // 笔2 → 宀
        result[2] = firstRootIdx + 0;  // 笔3 → 宀
        result[3] = firstRootIdx + 2;  // 笔4 → 丨
        result[4] = firstRootIdx + 1;  // 笔5 → コ
        result[5] = firstRootIdx + 1;  // 笔6 → コ
        result[6] = firstRootIdx + 3;  // 笔7 → コ
        result[7] = firstRootIdx + 3;  // 笔8 → コ
        return result;
    }

    // 可字模式：展开后 r=['一','口','亅']，5笔首尾包裹 [0,1,1,1,0]
    // 丁(一+亅)包裹口：一(第1笔)和亅(第5笔)同属丁
    if (currentChar === '可' && roots[0] === '一' && roots[1] === '口' && roots[2] === '亅' && n === 5) {

        result[1] = firstRootIdx + 1; // 第2笔(丨) → 口(索引1)
        result[2] = firstRootIdx + 1; // 第3笔(𠃍) → 口(索引1)
        result[3] = firstRootIdx + 1; // 第4笔(一) → 口(索引1)
        result[4] = firstRootIdx;   // 第5笔(亅) → 丁(索引0)
        return result;
    }
    // 可字原始模式（未展开的丁+口），保留防止其他代码路径调用
    if (currentChar === '可' && roots[0] === '丁' && roots[1] === '口' && n === 5) {
        result[0] = firstRootIdx;
        result[1] = firstRootIdx + 1;
        result[2] = firstRootIdx + 1;
        result[3] = firstRootIdx + 1;
        result[4] = firstRootIdx;
        return result;
    }

    // 衰字模式：r=['亠','口','一','𧘇']，10笔 [0,0,1,1,2,1,3,3,3,3]
    // 亠=2笔(第1,2笔)；口=3笔(第3,4,6笔，非连续)；一=1笔(第5笔)；𧘇=4笔(第7-10笔)
    if (currentChar === '衰' && roots[0] === '亠' && roots[1] === '口' && roots[2] === '一' && roots[3] === '𧘇' && n === 10) {
        result[0] = firstRootIdx;       // 第1笔 → 亠(索引0)
        result[1] = firstRootIdx;       // 第2笔 → 亠(索引0)
        result[2] = firstRootIdx + 1;   // 第3笔 → 口(索引1)
        result[3] = firstRootIdx + 1;   // 第4笔 → 口(索引1)
        result[4] = firstRootIdx + 2;   // 第5笔 → 一(索引2)
        result[5] = firstRootIdx + 1;   // 第6笔 → 口(索引1)
        result[6] = firstRootIdx + 3;   // 第7笔 → 𧘇(索引3)
        result[7] = firstRootIdx + 3;   // 第8笔 → 𧘇(索引3)
        result[8] = firstRootIdx + 3;   // 第9笔 → 𧘇(索引3)
        result[9] = firstRootIdx + 3;   // 第10笔 → 𧘇(索引3)
        return result;
    }

    // 爽字模式：r=['大','㐅','㐅','㐅','㐅']，11笔 [0,1,1,2,2,3,3,4,4,0,0]
    // 大=3笔(第1,10,11笔，非连续)；4个㐅各2笔(第2-3,4-5,6-7,8-9笔)
    if (currentChar === '爽' && roots[0] === '大' && n === 11) {
        result[0] = firstRootIdx;       // 第1笔 → 大(索引0)
        result[1] = firstRootIdx + 1;   // 第2笔 → 㐅(索引1)
        result[2] = firstRootIdx + 1;   // 第3笔 → 㐅(索引1)

                result2[pos++] = strokeOffset + r - 2;
            }
            // 末字根剩余笔画
            for (let j = 0; j < lastSc - 1; j++) {
                result2[pos++] = strokeOffset + r - 1;
            }
            if (pos === n && result2.every(v => v !== undefined)) {
                return result2;
            }
        }
    }

    // ===== 酉字非连续修正（复合字中的酉部件）=====
    // 酉展开为[西,一]，7笔：西(0-4,6) + 一(5)
    // 连续分配会错误地将前6笔给西、末笔给一，需要交换第6和第7笔的字根归属
    if (currentChar !== '酉' && _origRoots.includes('酉')) {
        let youRootStart = -1;
        let cursor = 0;
        for (const origRoot of _origRoots) {
            if (origRoot === '酉') { youRootStart = cursor; break; }
            const expanded = recursivelyExpandRoots([origRoot], currentChar);
            cursor += expanded.length;
        }
        if (youRootStart >= 0 && youRootStart + 1 < r
            && roots[youRootStart] === '西' && roots[youRootStart + 1] === '一') {
            let youStrokeStart = 0;
            for (let ri = 0; ri < youRootStart; ri++) {
                youStrokeStart += (RADICAL_STROKES[roots[ri]] || 1);
            }
            if (youStrokeStart + 6 < n) {
                result[youStrokeStart + 5] = strokeOffset + youRootStart + 1;  // 一
                result[youStrokeStart + 6] = strokeOffset + youRootStart;      // 西
            }
        }
    }

    // 验证结果
    if (result.length === n && result.every(v => v !== undefined)) {
        return result;
    }
    return null;
}

/**
 * 自动生成成字字根（RADICAL_CHARS）的笔画映射
 * 
 * 适用范围：仅限 RADICAL_CHARS 中的「成字字根」，即该字本身就是一个可作为键名字的字根。
 * 规则：第一个编码是键名本身（报户口），从第二个编码开始依次对应笔画。
 * 
 * 示例：
 * - 了(BNH): B是报户口(了自身)，N→第1笔(乛)，H→第2笔(亅)
 * - 七(AGN): A是报户口(七自身)，G→第1笔(一)，N→第2笔(乚)
 * - 上(HHGG): H是报户口(上自身)，H→第1笔(丨)，G→第2笔(一)，G→第3笔(一)
 * 
 * 注意：对于不在 RADICAL_CHARS 中的独体字（如「而」），不应使用此规则，
 *       应在硬编码中显式定义笔画映射（如 '而': [0,1,1,2,2,2]）
 * 
 * @param {string} char - 汉字
 * @param {string} code - 全码（如 'RTGH'）
 * @param {number} totalStrokes - 总笔画数
 * @returns {array} 笔画映射数组
 */
function autoGenerateSingleRootMap(char, code, totalStrokes, rootCount) {
    const map = [];
    const r = rootCount || totalStrokes;
    
    // 成字字根编码规则：报户口(字根0) + 第1笔(字根1) + 第2笔(字根2) + 末笔(字根r-1)
    // 报户口不占笔画，笔画从字根1开始分配
    // 当笔画数 > (字根数-1) 时，中间笔画标灰（跳过）
    
    const strokeRootCount = r - 1; // 扣掉报户口，实际对应笔画的字根数
    
    if (totalStrokes <= strokeRootCount) {
        // 笔画数 ≤ 字根数-1：顺序映射，末笔不超过最后一个字根
        for (let i = 0; i < totalStrokes; i++) {
            map.push(Math.min(i + 1, r - 1));
        }
    } else {
        // 笔画数 > 字根数-1：第1笔→字根1，第2笔→字根2，末笔→字根r-1，中间灰色
        for (let i = 0; i < totalStrokes; i++) {
            if (i === 0) {
                map.push(1); // 第1笔 → 字根1
            } else if (i === 1) {
                map.push(2); // 第2笔 → 字根2
            } else if (i === totalStrokes - 1) {
                map.push(r - 1); // 末笔 → 最后一个字根
            } else {
                map.push(-1); // 中间笔画跳过，灰色
            }
        }
    }
    
    return map;
}

/**
 * 批量生成所有独体字根字的笔画映射
 */
function generateAllSingleRootMaps() {
    const results = {};
    
    for (const char in WUBI) {
        const wubi = WUBI[char];
        
        // 只处理成字字根（RADICAL_CHARS）
        if (!RADICAL_CHARS.has(char)) continue;
        
        const code = wubi.c;
        const strokeCount = STROKE_COUNT[char] || 0;
        
        if (strokeCount === 0) {
            console.warn(`[跳过] ${char}: 缺少笔画数`);
            continue;
        }
        
        const map = autoGenerateSingleRootMap(char, code, strokeCount);
        results[char] = map;
    }
    
    return results;
}

// ==================== 统一颜色获取 ====================
// 获取编码位置对应的颜色（确保编码区、字根区、大框颜色一致）
function getCodeColor(codeIndex) {
    return ROOT_COLORS[codeIndex % ROOT_COLORS.length];
}

// 获取字根索引对应的颜色（与编码位置同步）
function getRootColor(rootIndex) {
    return ROOT_COLORS[rootIndex % ROOT_COLORS.length];
}

// 获取笔画对应的颜色（使用strokeColorMap，确保与编码区一致）
function getStrokeColor(strokeIndex) {
    // 优先使用strokeColorMap（由renderInfo构建）
    if (strokeColorMap.length > 0 && strokeColorMap[strokeIndex]) {
        return strokeColorMap[strokeIndex];
    }
    // 回退到原始逻辑
    const ri = strokeRootMapForDisplay[strokeIndex];
    if (ri === undefined || ri < 0) return '#555'; // 非编码笔画灰色
    return getRootColor(ri);
}

// ==================== NC字根编码索引计算 ====================
// 计算NC字符自身的rootToCodeIndex（前3+末1规则）
// 用于复合字中NC子字根展开时，让各子字根获得不同颜色
function computeNcRootToCodeIndex(ncChar) {
    const ncWubi = WUBI[ncChar];
    if (!ncWubi || !ncWubi.r) return [];
    const ncRoots = ncWubi.r;
    const ncCode = ncWubi.c || '';
    const ncCodeLen = ncCode.length;
    const ncSupIndices = ncWubi.sup || [];
    const result = [];
    // 韋特殊处理：r=['コ','丨','口','匸','丨']，5子字根4编码位(NHKH)
    // 前3+末1规则：コ→N(0), 丨→H(1), 口→K(2), 匸跳过(-1), 丨→H(3)
    if (ncChar === '韋' && ncRoots.length === 5 && ncCodeLen === 4) {
        return [0, 1, 2, -1, 3];
    }
    if (ncRoots.length > 4) {
        for (let i = 0; i < 3; i++) result.push(i);
        for (let i = 3; i < ncRoots.length - 1; i++) result.push(-1);
        result.push(ncCodeLen - 1);
    } else if (ncRoots.length < ncCodeLen) {
        const ncRootCodeIndices = [];
        for (let i = 0; i < ncCodeLen; i++) {
            if (!ncSupIndices.includes(i)) ncRootCodeIndices.push(i);
        }
        for (let i = 0; i < ncRoots.length - 1; i++) result.push(ncRootCodeIndices[i]);
        result.push(ncRootCodeIndices[ncRootCodeIndices.length - 1]);
    } else {
        for (let i = 0; i < ncRoots.length; i++) result.push(i < ncCodeLen ? i : -1);
    }
    return result;
}

// ==================== 自定义笔画顺序 ====================
// 当五笔拆分与标准笔顺冲突时，按条件重映射笔画顺序
// 使用方式：修改 WUBI 字典中 r 数组的顺序（如 ['丿','扌','乚','丶','丿']）
// 条件自动检测并应用重映射，不满足条件时使用原数据
const CUSTOM_STROKE_ORDER = {
    '方': {
        // 方：标准笔顺 丶一㇆㇒，五笔需要 丶一㇒㇆（交换最后两笔）
        condition: (wubi) => {
            const r = wubi.r;
            return r.length >= 2 && r[r.length-2] === '一' && r[r.length-1] === '㇆';
        },
        swapLast: true,
        swapScope: 'roots'  // 只交换方字根部分的末两笔，不交换整体字的末两笔
    },
    '力': {
        // 力：86 字典 r=[力,丿,㇆]，需把笔画从 bundle 原始 [s0,s1] 调为 [s1,s0]（先撇后钩）
        // 仅 86 版需要交换笔画（98/新世纪 键位/笔顺已自然一致，无需交换）
        condition: (wubi, currentChar) => {
            const r = wubi.r;
            if (typeof currentWubiVersion !== 'undefined' && currentWubiVersion !== '86') return false;
            return r.length >= 2 && r[r.length-2] === '丿' && r[r.length-1] === '㇆';
        },
        swapLast: true,
        swapScope: 'roots'  // 只交换力字根部分的末两笔，不交换整体字的末两笔
    },
    '刀': {
        // 刀：与力同理，报户口(刀)+第1笔(㇆)+第2笔(丿)，交换最后两笔
        // 仅 86 版需要交换（98/新世纪 键位/笔顺已自然一致），且用版本判断防止误匹配力等含[㇆,丿]的字
        condition: (wubi, currentChar) => {
            const r = wubi.r;
            if (typeof currentWubiVersion !== 'undefined' && currentWubiVersion !== '86') return false;
            return r.length >= 2 && r[r.length-2] === '㇆' && r[r.length-1] === '丿';
        },
        swapLast: true,
        swapScope: 'roots'  // 只交换刀字根部分的末两笔
    },
    '分': {
        // 分=[八,刀]：末字根为刀，需交换刀字根的末两笔
        // condition严格匹配r=['八','刀']（length===2），防止展开roots检测误匹配含分的复合字
        condition: (wubi, currentChar) => {
            const r = wubi.r;
            return r.length === 2 && r[0] === '八' && r[1] === '刀';
        },
        swapLast: true,
        swapScope: 'roots'  // 只交换分字根部分（即刀）的末两笔
    },
    '切': {
        // 切=[七,刀]：末字根为刀，需交换刀字根的末两笔
        condition: (wubi, currentChar) => {
            const r = wubi.r;
            return r.length === 2 && r[0] === '七' && r[1] === '刀';
        },
        swapLast: true,
        swapScope: 'roots'  // 只交换切字根部分（即刀）的末两笔
    },
    '乃': {
        // 乃：标准笔顺 𠄎(横折折折钩)→丿(撇)，五笔拆分 报户口(乃)+丿(T)+𠄎(N识别码)，交换最后两笔
        condition: (wubi, currentChar) => {
            const r = wubi.r;
            return r.length >= 2 && r[r.length-2] === '丿' && r[r.length-1] === '𠄎';
        },
        swapLast: true,
        swapScope: 'roots'  // 只交换乃字根部分的末两笔，不交换整体字的末两笔
    },
    '弋': {
        // 弋：末位两笔交换（标准笔顺 一㇟丶，与五笔顺序一致，但作为部首时统一处理）
        condition: (wubi) => {
            const r = wubi.r;
            return r.length >= 2 && r[r.length-2] === '㇟' && r[r.length-1] === '丶';
        },
        swapLast: true
    },
    '夜': {
        // 夜：标准笔顺 亠(点横)亻(撇竖)夂(撇横撇)丶(点)夂(捺)
        // 连续分配 [0,0,1,1,2,2,2,3] 把第7笔(夂捺)分给root2、第8笔(丶)分给root3
        // 但标准笔顺第7笔是丶(点)，第8笔是夂(捺)→ 需交换末两位root索引
        strokeRootMap: [0,0,1,1,2,2,3,2],
        condition: (wubi) => wubi.c === 'YWTY'
    },
    '鹵': {
        // 鹵：⺊ + 囗 + 乂 + 灬
        // 囗不是整字外框，不能走通用囗包围检测；但其底横仍属于囗，需与前两笔同色。
        // 标准笔顺中底横在鹵部件最后：⺊(0,1) 囗前两笔(2,3) 乂(4,5) 灬(6-9) 囗底横(10)
        strokeRootMap: [0,0,1,1,2,2,3,3,3,3,1],
        condition: (wubi) => wubi.c === 'HLQO'
    },
    '戋': {
        // 戋：标准笔顺 一→一→乚→丿→丶，五笔编码GGGT末笔为T(丿)
        // WUBI分解：r=['戋','一','一','乚','丶','丿']，末两子根为丶+丿，需交换使丿变为末笔
        // 与戈字末两笔交换规则一致（含钩笔画+末两子根丶丿）
        condition: (wubi) => {
            const r = wubi.r;
            return r.length >= 2 && r[0] === '戋' && r[r.length-2] === '丶' && r[r.length-1] === '丿';
        },
        swapLast: true,
        swapScope: 'roots'  // 只交换戋字根部分的末两笔，不交换整字末两笔
    },
    '乶': {
        // 乶：r=['甫','乙']，展开后['一','冃','丨','丶','乙']，8笔
        // 标准笔顺第7笔=丶(3), 第8笔=乙(4)，需交换末两笔
        // swapLast交换strokes路径，strokeRootMap指定交换后的字根映射
        condition: (wubi) => wubi.c === 'GEHN',
        swapLast: true,
        strokeRootMap: [0,1,1,1,1,2,4,3]  // 一(0),冃(1)x4,丨(2),乙(4),丶(3)
    },
    '瓦': {
        // 瓦：标准笔顺 一→𠄌→乙(横折弯钩)→丶(点)
        // WUBI分解：r=['一','𠄌','丶','乙']，末两子根为丶+乙，需交换使乙(横折弯钩)在前丶(点)在后
        condition: (wubi) => {
            const r = wubi.r;
            return r.length >= 2 && r[r.length-2] === '丶' && r[r.length-1] === '乙';
        },
        swapLast: true,
        swapScope: 'roots'  // 只交换瓦字根部分的末两笔，不交换整字末两笔
    },
};

// ==================== 加载笔画数据 ====================
// 调整SVG路径中所有X坐标（用于多段拼接时水平对齐）
function shiftPathX(pathStr, dx) {
    return pathStr.replace(/([MLCQHVSmlcqhvs])([^MLCQHVSZmlcqhvsz]*)/g, (match, cmd, params) => {
        const isRelative = cmd === cmd.toLowerCase() && cmd !== cmd.toUpperCase();
        if (isRelative) return match;
        const nums = params.trim().split(/[\s,]+/).filter(s => s.length > 0).map(Number);
        if (nums.length === 0) return match;
        const cmdUpper = cmd.toUpperCase();
        if (cmdUpper === 'V') return match;
        if (cmdUpper === 'H') {
            nums[0] += dx;
            return cmd + ' ' + nums.map(n => n.toFixed(2)).join(' ');
        }
        for (let i = 0; i < nums.length; i += 2) {
            nums[i] += dx;
        }
        return cmd + ' ' + nums.map(n => n.toFixed(2)).join(' ');
    });
}

// 调整SVG路径中所有Y坐标（用于多段拼接时对齐高度）
function shiftPathY(pathStr, dy) {
    return pathStr.replace(/([MLCQHVSmlcqhvs])([^MLCQHVSZmlcqhvsz]*)/g, (match, cmd, params) => {
        const isRelative = cmd === cmd.toLowerCase() && cmd !== cmd.toUpperCase();
        if (isRelative) return match; // 相对坐标不偏移
        const nums = params.trim().split(/[\s,]+/).filter(s => s.length > 0).map(Number);
        if (nums.length === 0) return match;
        const cmdUpper = cmd.toUpperCase();
        // H/V 只有一个坐标
        if (cmdUpper === 'H') return match; // 只有X，不偏移
        if (cmdUpper === 'V') {
            nums[0] += dy;
            return cmd + ' ' + nums.map(n => n.toFixed(2)).join(' ');
        }
        // M/L/C/Q：每对(x,y)中的y偏移
        for (let i = 1; i < nums.length; i += 2) {
            nums[i] += dy;
        }
        return cmd + ' ' + nums.map(n => n.toFixed(2)).join(' ');
    });
}

// 缩放SVG路径坐标（用于将部件缩小后放入外框内）
function scalePath(pathStr, scale, offsetX, offsetY) {
    return pathStr.replace(/([MLCQHVSmlcqhvs])([^MLCQHVSZmlcqhvsz]*)/g, (match, cmd, params) => {
        const isRelative = cmd === cmd.toLowerCase() && cmd !== cmd.toUpperCase();
        if (isRelative) return match;
        const nums = params.trim().split(/[\s,]+/).filter(s => s.length > 0).map(Number);
        if (nums.length === 0) return match;
        const cmdUpper = cmd.toUpperCase();
        // M/L/C/Q/H/V：所有坐标都缩放并偏移
        for (let i = 0; i < nums.length; i++) {
            nums[i] = nums[i] * scale + (i % 2 === 0 ? offsetX : offsetY);
        }
        return cmd + ' ' + nums.map(n => n.toFixed(2)).join(' ');
    });
}

// 独立缩放X和Y的SVG路径坐标（用于宽高不同比例缩放）
function scalePathXY(pathStr, scaleX, scaleY, offsetX, offsetY) {
    return pathStr.replace(/([MLCQHVSmlcqhvs])([^MLCQHVSZmlcqhvsz]*)/g, (match, cmd, params) => {
        const isRelative = cmd === cmd.toLowerCase() && cmd !== cmd.toUpperCase();
        if (isRelative) return match;
        const nums = params.trim().split(/[\s,]+/).filter(s => s.length > 0).map(Number);
        if (nums.length === 0) return match;
        const cmdUpper = cmd.toUpperCase();
        for (let i = 0; i < nums.length; i += 2) {
            nums[i] = nums[i] * scaleX + offsetX;       // X坐标
            if (i + 1 < nums.length) nums[i + 1] = nums[i + 1] * scaleY + offsetY; // Y坐标
        }
        return cmd + ' ' + nums.map(n => n.toFixed(2)).join(' ');
    });
}

// 围绕笔画数据的X中心做缩放（Y不变），用于"上下不变、左右变窄"
function scalePathXCenter(strokesArray, scaleX) {
    let minX = Infinity, maxX = -Infinity;
    for (const s of strokesArray) {
        s.replace(/([MLCQHVS])([^MLCQHVSZ]*)/g, (m, cmd, params) => {
            const nums = params.trim().split(/[\s,]+/).filter(x => x.length > 0).map(Number);
            for (let i = 0; i < nums.length; i += 2) {
                if (nums[i] < minX) minX = nums[i];
                if (nums[i] > maxX) maxX = nums[i];
            }
            return m;
        });
    }
    const centerX = (minX + maxX) / 2;
    const offsetX = centerX * (1 - scaleX);
    return strokesArray.map(s => scalePathXY(s, scaleX, 1, offsetX, 0));
}

function getStrokesBBox(strokesArray) {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const s of strokesArray || []) {
        s.replace(/([MLCQHVS])([^MLCQHVSZ]*)/g, (m, cmd, params) => {
            const nums = params.trim().split(/[\s,]+/).filter(x => x.length > 0).map(Number);
            const cmdUpper = cmd.toUpperCase();
            if (cmdUpper === 'H') {
                for (const x of nums) {
                    if (!Number.isFinite(x)) continue;
                    minX = Math.min(minX, x);
                    maxX = Math.max(maxX, x);
                }
                return;
            }
            if (cmdUpper === 'V') {
                for (const y of nums) {
                    if (!Number.isFinite(y)) continue;
                    minY = Math.min(minY, y);
                    maxY = Math.max(maxY, y);
                }
                return;
            }
            for (let i = 0; i < nums.length; i += 2) {
                const x = nums[i], y = nums[i + 1];
                if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
                minX = Math.min(minX, x);
                maxX = Math.max(maxX, x);
                minY = Math.min(minY, y);
                maxY = Math.max(maxY, y);
            }
        });
    }
    if (!Number.isFinite(minX) || !Number.isFinite(minY)) return null;
    return { minX, maxX, minY, maxY, width: maxX - minX, height: maxY - minY };
}

function fitStrokesToTargetBBox(sourceStrokes, targetStrokes) {
    const src = getStrokesBBox(sourceStrokes);
    const dst = getStrokesBBox(targetStrokes);
    if (!src || !dst || src.width <= 0 || src.height <= 0 || dst.width <= 0 || dst.height <= 0) {
        return sourceStrokes;
    }
    const scaleX = dst.width / src.width;
    const scaleY = dst.height / src.height;
    const offsetX = dst.minX - src.minX * scaleX;
    const offsetY = dst.minY - src.minY * scaleY;
    return sourceStrokes.map(s => scalePathXY(s, scaleX, scaleY, offsetX, offsetY));
}

const dataSource = {}; // 'bundle' 或 'cdn'
async function fetchCharData(char) {
    if (cachedData[char]) return cachedData[char];
    // 1. 优先从bundle（仅在 bundle 加载完成后才检查）
    if (window._bundleReady && window.STROKE_DATA && window.STROKE_DATA[char]) {
        cachedData[char] = window.STROKE_DATA[char];
        dataSource[char] = 'bundle';
        return cachedData[char];
    }
    // 2. 回退到CDN
    const url = `https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/${encodeURIComponent(char)}.json`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`未找到"${char}"的笔画数据`);
    const data = await resp.json();
    cachedData[char] = data;
    dataSource[char] = 'cdn';
    return data;
}

function isCdnData(char) {
    return dataSource[char] === 'cdn' || dataSource[char] === undefined;
}

// 笔画来源映射：无CDN数据的CJK扩展字 → 从父字提取笔画
const STROKE_SOURCES = {
    '㝉': { parent: '伫', offset: 2, count: 4 },
    '𠃓': { parent: '汤', offset: 3, count: 3 },
    '𢀖': { parent: '经', offset: 3, count: 5 },
    '𠬤': { parent: '泽', offset: 3, count: 5 },
    '㣊': { parent: '修', offset: 3, count: 6 },
    '䏌': { parent: '佾', offset: 2, count: 6 },
    '𠬶': { parent: '浸', offset: 3 },
    '牜': { parent: '牧', offset: 0, count: 4 },
    '𧾷': { parent: '跑', offset: 0, count: 7 },
    '⻊': { parent: '跑', offset: 0, count: 7 },
    '': { parent: '卷', offset: 0, count: 6 },
    '': { parent: '跑', offset: 0, count: 7 },
    '龸': { parent: '学', offset: 0, count: 5 },
    '': { parent: '学', offset: 0, count: 5 },
    '龺': { parent: '朝', offset: 0, count: 8 },
    '𠦝': { parent: '朝', offset: 0, count: 8 },
    '': { parent: '朝', offset: 0, count: 8 },
    '蓺': { parent: '藝', offset: 0, count: 15 },
    '䂞': { parent: '橐', offset: 7 },
    '晞': { parts: [{ parent: '晒', offset: 0, count: 4 }, { parent: '稀', offset: 5, count: 7 }] },
    '焜': { parts: [{ parent: '烤', offset: 0, count: 4, yOffset: -30 }, { parent: '馄', offset: 3, count: 8, yOffset: 30 }] },
    '鬮': { parts: [{ parent: '鬥', offset: 0 }, { parent: '龜', offset: 0 }] },
    '浥': { parts: [{ parent: '洞', offset: 0, count: 3 }, { parent: '邑', offset: 0, xOffset: 80 }] },
    // 䜭=⺊(2)+冖(2)+一(1)+谷(7)=12笔，无CDN/bundle数据，从㕡(䜭+又=14笔)左半部分(前12笔)提取
    '䜭': { parent: '㕡', offset: 0, count: 12 },
};

// 获取笔画数据并应用所有特殊字符替换（溦/叀/鶻/髕/嘜/鯗）
// 大框渲染和多字卡片共享此函数
async function getStrokeData(char) {
    let data;
    try {
        data = await fetchCharData(char);
    } catch (e) {
        // CDN/local无此字笔画数据，尝试从父字提取
        const src = STROKE_SOURCES[char];
        if (!src) throw e;
        const radStrokes = [];
        if (src.parts) {
            const allStrokes = [];
            let accumOffset = 0;
            for (const part of src.parts) {
                const parentData = await fetchCharData(part.parent);
                const start = part.offset;
                const end = part.count ? start + part.count : parentData.strokes.length;
                let partStrokes = parentData.strokes.slice(start, end);
                if (part.yOffset) partStrokes = partStrokes.map(s => shiftPathY(s, part.yOffset));
                if (part.xOffset) partStrokes = partStrokes.map(s => shiftPathX(s, part.xOffset));
                const origRad = parentData.radStrokes || [];
                radStrokes.push(...origRad.filter(r => r >= start && r < end).map(r => r - start + accumOffset));
                allStrokes.push(...partStrokes);
                accumOffset += partStrokes.length;
            }
            console.log(`[Fallback] ${char} 多段拼接 ${allStrokes.length} 笔`);
            return { strokes: allStrokes, radStrokes };
        }
        const parentData = await fetchCharData(src.parent);
        const start = src.offset;
        const end = src.count ? start + src.count : parentData.strokes.length;
        const strokes = parentData.strokes.slice(start, end);
        const origRad = parentData.radStrokes || [];
        radStrokes.push(...origRad.filter(r => r >= start).map(r => r - start));
        console.log(`[Fallback] ${char} 从 ${src.parent}[${start}:${end}] 提取 ${strokes.length} 笔`);
        return { strokes, radStrokes };
    }
    let strokes = [...(data.strokes || [])];

    // 只有从CDN加载的数据才需运行时修正（本地已有修正JSON则跳过）
    if (isCdnData(char)) {
        if (char === '溦') {
            const weiData = await fetchCharData('微');
            strokes = [...strokes.slice(0, 3), ...weiData.strokes.slice(3)];
        }
        if (char === '叀') {
            const zhuanData = await fetchCharData('專');
            const xianData = await fetchCharData('县');
            strokes = [
                ...zhuanData.strokes.slice(0, 6).map(s => shiftPathY(s, -60)),
                ...xianData.strokes.slice(5).map(s => shiftPathY(s, 55))
            ];
        }
        if (char === '鶻') {
            const angData = await fetchCharData('骯');
            const yaData = await fetchCharData('鴨');
            strokes = [...angData.strokes.slice(0, 10), ...yaData.strokes.slice(5, 16)];
        }
        if (char === '髕') {
            const angData = await fetchCharData('骯');
            const pinData = await fetchCharData('嬪');
            strokes = [...angData.strokes.slice(0, 10), ...pinData.strokes.slice(3).map(s => shiftPathX(s, 60))];
        }
        if (char === '嘜') {
            const quData = await fetchCharData('麴');
            strokes = [...strokes.slice(0, 3), ...quData.strokes.slice(0, 11).map(s => shiftPathX(s, 200))];
        }
        if (char === '鯗') {
            const yangData = await fetchCharData('养');
            const topStrokes = yangData.strokes.slice(0, 7).map(s => shiftPathX(shiftPathY(s, 60), 15));
            const bottomStrokes = strokes.slice(8);
            strokes = [...topStrokes, ...bottomStrokes];
        }
        if (char === '鑽') {
            // 鑽CDN数据只有26笔（釒8+贊18），贊少1笔
            // 用讚字(言7+贊19)的贊部分替换，拼成正确的27笔(釒8+贊19)
            const zanData = await fetchCharData('讚');
            // 贊部分向右偏移，使其与釒部间距更合理
            const zanStrokes = zanData.strokes.slice(7).map(s => shiftPathX(s, 40));
            strokes = [...strokes.slice(0, 8), ...zanStrokes];
        }
        if (char === '鋩') {
            // 鋩右侧芒（笔画8-14）替换为铓右侧芒（笔画5-11）
            const mangData = await fetchCharData('铓');
            strokes = [...strokes.slice(0, 8), ...mangData.strokes.slice(5)];
        }
        if (char === '蠹') {
            // 蠹前7笔笔划数据有误，用囊的前7笔替换
            const nangData = await fetchCharData('囊');
            strokes = [...nangData.strokes.slice(0, 7), ...strokes.slice(7)];
        }
    }
    // 豱右侧昷字根笔划数据有误（10笔，多1笔），用腽字右侧昷的笔划数据（9笔）替换
    // 豱=豕(7笔)+昷(应9笔)，腽=月(4笔)+昷(9笔)
    // 昷右移让中间留些空间
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '豱') {
        const wenData = await fetchCharData('腽');
        strokes = [...strokes.slice(0, 7), ...wenData.strokes.slice(4).map(s => shiftPathX(s, 80))];
    }
    // 戶第一笔笔划数据有误，用向字第一笔替换
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '戶') {
        const xiangData = await fetchCharData('向');
        strokes = [xiangData.strokes[0], ...strokes.slice(1)];
    }
    // 極=木(4笔)+亟(8笔)，右侧亟部笔划数据有误
    // 用独立亟字的8笔贴合到極原右侧区域后替换
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '極') {
        const jiData = await fetchCharData('亟');
        const jiStrokes = fitStrokesToTargetBBox(jiData.strokes, strokes.slice(4));
        strokes = [...strokes.slice(0, 4), ...jiStrokes];
    }
    // 曠=日(4笔)+廣(15笔)，本地数据廣部缺少广的丶（仅14笔）
    // 用旷字(日4笔+广3笔)的前5笔(日4笔+丶)替换曠的前4笔(日4笔)
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '曠') {
        const kuangData = await fetchCharData('旷');
        strokes = [...kuangData.strokes.slice(0, 5), ...strokes.slice(4)];
    }
    // 簷擔膽譫贍中的詹字笔划数据有误，用赡字(贝4+詹13)右侧的詹(第5-17笔)替换
    // 赡詹部分通过fitStrokesToTargetBBox缩放对齐到各字原詹部分位置
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (['簷','擔','膽','譫','贍'].includes(char)) {
        const shanData = await fetchCharData('赡');
        const shanZhan = shanData.strokes.slice(4); // 赡的詹部分13笔
        const radCount = strokes.length - 13; // 各字偏旁笔画数
        const zhanStrokes = fitStrokesToTargetBBox(shanZhan, strokes.slice(radCount));
        strokes = [...strokes.slice(0, radCount), ...zhanStrokes];
    }
    // 巅巔癲稙中的直字笔划数据有误，用填字(土3+直8+八2)中的直(第4-11笔)替换
    // 填直部分通过fitStrokesToTargetBBox缩放对齐到各字原直部分位置
    // 稙=禾(5)+直(8)，直在strokes[5:13]
    // 巅=山(3)+真(10)+页(6)，真=直(8)+八(2)，直在strokes[3:11]
    // 巔=山(3)+真(10)+頁(9)，真=直(8)+八(2)，直在strokes[3:11]
    // 癲=疒(5)+真(10)+頁(9)，真=直(8)+八(2)，直在strokes[5:13]
    // 巅/巔的直部分右移40以对齐
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (['巅','巔','癲','稙'].includes(char)) {
        const tianData = await fetchCharData('填');
        const tianZhi = tianData.strokes.slice(3, 11); // 填的直部分8笔
        const zhiStart = (char === '稙' || char === '癲') ? 5 : 3; // 禾/疒后 vs 山后
        let zhiStrokes = fitStrokesToTargetBBox(tianZhi, strokes.slice(zhiStart, zhiStart + 8));
        if (char === '巅' || char === '巔') {
            zhiStrokes = zhiStrokes.map(s => shiftPathX(s, 40));
        }
        strokes = [...strokes.slice(0, zhiStart), ...zhiStrokes, ...strokes.slice(zhiStart + 8)];
    }
    // 坴夌巂璚矞冏畟攛邊中的八字根笔划数据有误，用突字(穴5+犬4)中的八(第4-5笔)替换
    // 突八部分通过fitStrokesToTargetBBox缩放对齐到各字原八部分位置
    // 坴=土(3)+八(2)+土(3)，八在[3:5]
    // 夌=土(3)+八(2)+夂(3)，八在[3:5]
    // 冏=冂(2)+八(2)+口(3)，八在[2:4]
    // 畟=田(5)+八(2)+夂(3)，八在[5:7]
    // 巂=崔(11)+冏(7)，冏八在[13:15]
    // 璚=王(4)+矞(12)，矞=矛(5)+冏(7)，冏八在[11:13]
    // 矞=矛(5)+冏(7)，冏八在[7:9]
    // 攛=扌(3)+竄(18)，竄=穴(5)+鼠(13)，穴八在[6:8]
    // 邊=臱(15)+辶(3)，臱=自(6)+穴(5)+方(4)，穴八在[9:11]
    // 藭=艹(4)+窮(15)，窮=穴(5)+躬(10)，穴=宀(3)+八(2)，八在[7:9]
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    const baStartMap = {'坴':3,'夌':3,'冏':2,'畟':5,'巂':13,'璚':11,'矞':7,'攛':6,'邊':9,'焢':7,'躥':10};
    if (char in baStartMap) {
        const tuData = await fetchCharData('突');
        const tuBa = tuData.strokes.slice(3, 5); // 突的八部分2笔
        const baStart = baStartMap[char];
        const baStrokes = fitStrokesToTargetBBox(tuBa, strokes.slice(baStart, baStart + 2)).map(s => shiftPathX(s, -30));
        strokes = [...strokes.slice(0, baStart), ...baStrokes, ...strokes.slice(baStart + 2)];
    }
    // 藭=艹(4)+窮(15)，窮=穴(5)+躬(10)，穴=宀(3)+八(2)，八在[7:9]
    // 藭字第8、9笔（八）用突字八字根替换，不应用baStartMap的-30 X偏移
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '藭') {
        const tuData = await fetchCharData('突');
        const tuBa = tuData.strokes.slice(3, 5); // 突的八部分2笔
        const baStrokes = fitStrokesToTargetBBox(tuBa, strokes.slice(7, 9));
        strokes = [...strokes.slice(0, 7), ...baStrokes, ...strokes.slice(9)];
    }
    // 圙=囗(2)+八(2)+面(10)，八在[2:4]（囗在笔划数据中为2笔：丨+𠃍），用突字的八字根笔划替换
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '圙') {
        const tuData = await fetchCharData('突');
        const tuBa = tuData.strokes.slice(3, 5); // 突的八部分2笔
        const baStrokes = fitStrokesToTargetBBox(tuBa, strokes.slice(2, 4));
        strokes = [...strokes.slice(0, 2), ...baStrokes, ...strokes.slice(4)];
    }
    // 癢養中的丷+羊后+丶字根（前7笔）笔划数据有误，用鯗字的前7笔替换
    // 鯗字的前7笔本身来自养字（见上方鯗替换逻辑），这里复用养字作为数据源
    // 養=丷(2)+羊后(4)+丶(1)+良(8)，丷+羊后+丶在[0:7]
    // 癢=疒(5)+養(15)，丷+羊后+丶在[5:12]
    // 通过fitStrokesToTargetBBox缩放对齐到各字原位置
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '養' || char === '癢') {
        const yangData = await fetchCharData('养');
        const topStrokes = yangData.strokes.slice(0, 7);
        const targetStart = char === '養' ? 0 : 5;
        const fittedStrokes = fitStrokesToTargetBBox(topStrokes, strokes.slice(targetStart, targetStart + 7));
        strokes = [...strokes.slice(0, targetStart), ...fittedStrokes, ...strokes.slice(targetStart + 7)];
    }
    // 稅兌悅脫蛻說銳閱中的八字根笔划数据有误，用父字(八2+乂2)中的八(前2笔)替换
    // 父八部分通过fitStrokesToTargetBBox缩放对齐到各字原八部分位置
    // 兌=八(2)+兄(5)，八在[0:2]
    // 稅=禾(5)+兌(7)，八在[5:7]
    // 悅=忄(3)+兌(7)，八在[3:5]
    // 脫=月(4)+兌(7)，八在[4:6]
    // 蛻=虫(6)+兌(7)，八在[6:8]
    // 說=言(7)+兌(7)，八在[7:9]
    // 銳=金(8)+兌(7)，八在[8:10]
    // 閱=門(8)+兌(7)，八在[8:10]
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    const baStartMap2 = {'兌':0,'稅':5,'悅':3,'脫':4,'蛻':6,'說':7,'銳':8,'閱':8};
    if (char in baStartMap2) {
        const fuData = await fetchCharData('父');
        const fuBa = fuData.strokes.slice(0, 2); // 父的八部分2笔
        const baStart = baStartMap2[char];
        const baStrokes = fitStrokesToTargetBBox(fuBa, strokes.slice(baStart, baStart + 2)).map(s => shiftPathX(shiftPathY(s, -20), -25));
        strokes = [...strokes.slice(0, baStart), ...baStrokes, ...strokes.slice(baStart + 2)];
    }
    // 笑=⺮(6笔)+天(4笔)，⺮下面的天笔划数据有误，用夭字(丿1+大3=4笔)替换
    // 通过fitStrokesToTargetBBox缩放对齐到原天部分位置
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '笑') {
        const yaoData = await fetchCharData('夭');
        const yaoStrokes = fitStrokesToTargetBBox(yaoData.strokes, strokes.slice(6));
        strokes = [...strokes.slice(0, 6), ...yaoStrokes];
    }
    // 笫=⺮(6笔)+丿㇉丨丿(5笔)，右侧笔划数据有误，用秭字(禾5+丿㇉丨丿5)右侧(第6-10笔)替换
    // 通过fitStrokesToTargetBBox缩放对齐到原右侧位置
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '笫') {
        const ziData = await fetchCharData('秭');
        const rightStrokes = fitStrokesToTargetBBox(ziData.strokes.slice(5), strokes.slice(6));
        strokes = [...strokes.slice(0, 6), ...rightStrokes];
    }
    // 箓=⺮(6笔)+录(8笔)，⺮下面的录笔划数据有误，用录字替换
    // 通过fitStrokesToTargetBBox缩放对齐到原录部分位置，再左移使录中心与⺮中心对齐
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '箓') {
        const luData = await fetchCharData('录');
        const luStrokes = fitStrokesToTargetBBox(luData.strokes, strokes.slice(6));
        // 计算⺮中心X和录中心X，将录左移对齐⺮中心
        const topBBox = getStrokesBBox(strokes.slice(0, 6));
        const luBBox = getStrokesBBox(luStrokes);
        if (topBBox && luBBox && topBBox.width > 0 && luBBox.width > 0) {
            const topCenterX = (topBBox.minX + topBBox.maxX) / 2;
            const luCenterX = (luBBox.minX + luBBox.maxX) / 2;
            const shiftX = topCenterX - luCenterX;
            const shiftedStrokes = luStrokes.map(s => shiftPathX(s, shiftX));
            strokes = [...strokes.slice(0, 6), ...shiftedStrokes];
        } else {
            strokes = [...strokes.slice(0, 6), ...luStrokes];
        }
    }
    // 録=金(8笔)+录(8笔)，录部分笔划数据有误，用录字替换
    // 通过fitStrokesToTargetBBox缩放对齐到原录部分位置
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '録') {
        const luData = await fetchCharData('录');
        const luStrokes = fitStrokesToTargetBBox(luData.strokes, strokes.slice(8));
        strokes = [...strokes.slice(0, 8), ...luStrokes];
    }
    // 籙=⺮(6笔)+録(16笔)，⺮下面的録部分笔划数据有误
    // 用替换后的録字笔划数据替换（先对録数据应用录替换，再缩放对齐）
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '籙') {
        const luData = await fetchCharData('録');
        const recordData = await fetchCharData('录');
        // 先对録字数据应用录替换
        const luStrokes = fitStrokesToTargetBBox(recordData.strokes, luData.strokes.slice(8));
        const modifiedLu = [...luData.strokes.slice(0, 8), ...luStrokes];
        // 再缩放对齐到籙的録部分位置
        const fittedStrokes = fitStrokesToTargetBBox(modifiedLu, strokes.slice(6));
        strokes = [...strokes.slice(0, 6), ...fittedStrokes];
    }
    // 綹=糹(6笔)+咎(8笔)，右侧咎笔划数据有误，用绺字(纟3+咎8)右侧咎(第4-11笔)替换
    // 通过fitStrokesToTargetBBox缩放对齐到原咎部分位置

    // 通过fitStrokesToTargetBBox缩放对齐到原晋部分位置

        const leftStrokes = hongData.strokes.slice(0, 4).map(s => shiftPathX(s, -20));

    // 螞=虫(6笔)+馬(10笔)，左右笔划数据均有误

    // 通过fitStrokesToTargetBBox缩放对齐到原各部分位置

    if (char === '螞') {

        const maData = await fetchCharData('媽');
        const leftStrokes = fitStrokesToTargetBBox(mingData.strokes.slice(0, 6), strokes.slice(0, 6));
        const rightStrokes = fitStrokesToTargetBBox(maData.strokes.slice(3), strokes.slice(6));

    // 蠹=一+口+丨+冖+石+虫+虫(24笔)，前12笔(一口丨冖石)笔划数据有误

    if (char === '蠹') {

    // 衙=彳(3笔)+吾(五4+口3=7笔)+亍(二2+亅1=3笔)=13笔

    if (char === '銜' && strokes.length === 14) {

        strokes = [s[0], s[1], s[2], s[6], s[3], s[8], s[9], s[10], s[11], s[12], s[13], s[7], s[4], s[5]];

    // 鋩=金(8笔)+艹(3笔)+亡(4笔)=15笔，笔划顺序有误

    if (char === '鋩' && strokes.length === 15) {

        strokes = [s[0], s[1], s[2], s[3], s[4], s[5], s[6], s[7], s[14], s[8], s[9], s[10], s[11], s[12], s[13]];

    if (char === '雈') {

    // 鋥=金(8笔)+呈(7笔)=15笔，右侧呈的笔划数据有误

    // 鈞=金(8笔)+匀(4笔)=12笔，右侧匀的笔划数据有误
    // 用钧字(钅5笔+匀4笔=9笔)的右侧匀(第6-9笔)替换鈞的右侧匀(第9-12笔)
    if (char === '鈞') {
        const junData = await fetchCharData('钧');
        const rightStrokes = fitStrokesToTargetBBox(junData.strokes.slice(5), strokes.slice(8));
        strokes = [...strokes.slice(0, 8), ...rightStrokes];

    // 觱=咸(8笔)+角(7笔)=15笔，但CDN数据有16笔（角部分多1笔）
    // CDN radStrokes=[9..15]表示角从第10笔开始(0-indexed=9)，共7笔(第10-16笔)
    // 用觜字(此6笔+角7笔=13笔)的下面角(第7-13笔，7笔)替换觱的角(第10-16笔，7笔)
    // 替换后保留第1-9笔(咸8笔+角首笔)和第17笔(如有)，保持16笔总数
    if (char === '觱') {
        const ziData = await fetchCharData('觜');
        const bottomStrokes = fitStrokesToTargetBBox(ziData.strokes.slice(6), strokes.slice(9, 16));
        strokes = [...strokes.slice(0, 9), ...bottomStrokes, ...strokes.slice(16)];
    }
    // 錚=金(8笔)+爭(8笔)=16笔，右侧争的笔划数据有误
    // 用铮字(钅5笔+争6笔=11笔)的右侧争(第6-11笔)替换錚的右侧争(第9-16笔)
    if (char === '錚') {
        const zhengData = await fetchCharData('铮');
        const rightStrokes = fitStrokesToTargetBBox(zhengData.strokes.slice(5), strokes.slice(8));
        strokes = [...strokes.slice(0, 8), ...rightStrokes];
    }
    if (char === '袤' && strokes.length === 11) {

        strokes = [s[0], s[1], s[6], s[7], s[8], s[4], s[2], s[10], s[3], s[9], s[5]];
    }
    // 覷=虚(11笔)+見(7笔)=18笔，左半部分虚的笔划数据有误
    // 用觑字(虚11笔+见4笔=15笔)的左半部分虚(前11笔)替换覷的左半部分
    // 通过fitStrokesToTargetBBox缩放对齐到原位置
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '覷') {
        const quData = await fetchCharData('觑');
        const leftStrokes = fitStrokesToTargetBBox(quData.strokes.slice(0, 11), strokes.slice(0, 11));
        strokes = [...leftStrokes, ...strokes.slice(11)];
    }
    // 詆=言(7笔)+氐(5笔)=12笔，右侧氐的笔划数据有误
    // 用诋字(讠2笔+氐5笔=7笔)的右侧氐(第3-7笔)替换詆的右侧氐(第8-12笔)
    // 通过fitStrokesToTargetBBox缩放对齐到原位置
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '詆') {
        const diData = await fetchCharData('诋');
        const rightStrokes = fitStrokesToTargetBBox(diData.strokes.slice(2), strokes.slice(7));
        strokes = [...strokes.slice(0, 7), ...rightStrokes];
    }
    // 誤=言(7笔)+吴(7笔)=14笔，右侧吴的笔划数据有误
    // 用误字(讠2笔+吴7笔=9笔)的右侧吴(第3-9笔)替换誤的右侧吴(第8-14笔)
    if (char === '誤') {
        const wuData = await fetchCharData('误');
        const rightStrokes = fitStrokesToTargetBBox(wuData.strokes.slice(2), strokes.slice(7));
        strokes = [...strokes.slice(0, 7), ...rightStrokes];
    }
    // 謔=言(7笔)+虐(9笔)=16笔，谑=讠(2笔)+虐(9笔)=11笔，最后两笔顺序有误
    if ((char === '謔' || char === '谑') && strokes.length >= 2) {
        const n = strokes.length;
        [strokes[n-2], strokes[n-1]] = [strokes[n-1], strokes[n-2]];
    }
    // 諶=言(7笔)+甚(9笔)=16笔，甚中八字根笔划数据有误
    // 甚=卄(3笔)+三(3笔)+八(2笔)+𠃊(1笔)，八是第7-8笔(整体第14-15笔)
    // 谌=讠(2笔)+甚(9笔)=11笔，八是第7-8笔(整体第9-10笔)
    // 用谌的八替换諶的八
    if (char === '諶') {
        const chenData = await fetchCharData('谌');
        const baStrokes = fitStrokesToTargetBBox(chenData.strokes.slice(8, 10), strokes.slice(13, 15));
        strokes = [...strokes.slice(0, 13), ...baStrokes, ...strokes.slice(15)];
    }
    // 纛=龶(4笔)+互框+十+具头(6笔)+小(3笔)+系(7笔)=25笔
    // 第5-9笔（互框+十）笔划数据有误，用貫字(毌4笔+貝7笔=11笔)的前4笔(毌=互框+十)替换
    if (char === '纛') {
        const guanData = await fetchCharData('貫');
        const midStrokes = fitStrokesToTargetBBox(guanData.strokes.slice(0, 4), strokes.slice(4, 9));
        strokes = [...strokes.slice(0, 4), ...midStrokes, ...strokes.slice(9)];
    }
    // 販=貝(7笔)+反(4笔)=11笔，右侧反的笔划数据有误
    // 用贩字(贝4笔+反4笔=8笔)的右侧反(第5-8笔)替换販的右侧反(第8-11笔)
    if (char === '販') {
        const fanData = await fetchCharData('贩');
        const rightStrokes = fitStrokesToTargetBBox(fanData.strokes.slice(4), strokes.slice(7));
        strokes = [...strokes.slice(0, 7), ...rightStrokes];
    }
    // 縣=具头(6笔)+小(3笔)+系(7笔)=16笔，笔划数据有误
    // 纛的底部包含縣的结构(具头+小+系=16笔)，用纛底部16笔放大替换縣的全部笔划
    if (char === '縣') {
        const daoData = await fetchCharData('纛');
        const daoStrokes = daoData.strokes;
        const offset = daoStrokes.length - 16;
        const bottomStrokes = daoStrokes.slice(offset);
        strokes = fitStrokesToTargetBBox(bottomStrokes, strokes);
    }
    // 櫱=凵+丿+亻+コ+コ+辛+木=20笔，前3笔(凵+丿)笔划数据有误
    // 用辥字(凵+丿+亻+コ+コ+辛=17笔)的前3笔替换櫱的前3笔
    if (char === '櫱') {
        const xueData = await fetchCharData('辥');
        const frontStrokes = fitStrokesToTargetBBox(xueData.strokes.slice(0, 3), strokes.slice(0, 3));
        strokes = [...frontStrokes, ...strokes.slice(3)];
    }
    // 遷=覀(6笔)+大(3笔)+巳(3笔)+辶(3笔)=15笔，但CDN数据只有14笔（辶少1笔）
    // CDN的radStrokes=[11,12,13]，辶从第12笔开始（0-indexed=11），辶只有3笔(11,12,13)
    // 实际字根笔画分配：覀(0-5)+大(6-8)+巳(9-10)+辶(11-13)=14笔，巳只有2笔
    // 用巷字(共6笔+巳3笔=9笔)中巳部分(第7-9笔，3笔)替换遷中巳的部分(第10-11笔，2笔)
    // 替换后总笔画从14变为15，与标准一致
    if (char === '遷') {
        const xiangData = await fetchCharData('巷');
        const siStrokes = fitStrokesToTargetBBox(xiangData.strokes.slice(6, 9), strokes.slice(9, 11));

    }
    // 遞=虒(10笔)+辶(3笔)=13笔，虒部分笔划数据有误

    if (char === '遞') {
        const siData = await fetchCharData('虒');
        const frontStrokes = fitStrokesToTargetBBox(siData.strokes, strokes.slice(0, 10));
        strokes = [...frontStrokes, ...strokes.slice(10)];
    }
    // 啫=口(3笔)+者(9笔)，右侧者字笔划数据有误
    // 用堵字(土3笔+者9笔)的右侧者部分(第4-12笔)替换
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '啫') {

        strokes = [...strokes.slice(0, 3), ...duData.strokes.slice(3)];
    }
    // 吶=口(3笔)+內(4笔)，內中入字根笔划数据有误
    // 用籴字(入2笔+米6笔)上面的入(前2笔)替换吶的入(第6-7笔)，X方向缩窄+下移
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '吶') {
        const diData = await fetchCharData('籴');
        const ruStrokes = scalePathXCenter(diData.strokes.slice(0, 2), 0.5).map(s => shiftPathX(shiftPathY(s, -140), 40));
        strokes = [...strokes.slice(0, 5), ...ruStrokes];
    }
    // 內=冂(2笔)+入(2笔)，入字根笔划数据有误
    // 用籴字(入2笔+米6笔)上面的入(前2笔)替换內的入(第3-4笔)，X方向缩窄+下移
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '內') {

        const ruStrokes = scalePathXCenter(diData.strokes.slice(0, 2), 0.5).map(s => shiftPathX(shiftPathY(s, -100), -40));
        strokes = [...strokes.slice(0, 2), ...ruStrokes];
        strokes._strokeWidthScale = {2: 3, 3: 3}; // 入字根X缩窄后加粗
    }
    // 喨=口(3笔)+亮(京头5笔+冖2笔+几2笔)，几字根笔划数据有误

    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '喨') {
        const huData = await fetchCharData('虎');
        const jiStrokes = huData.strokes.slice(6, 8).map(s => shiftPathX(s, 40));
        strokes = [...strokes.slice(0, 10), ...jiStrokes];
    }
    // 啟=启(7笔)+攵(4笔)，左侧启笔划数据有误，右侧攵笔划数据有误
    // 左侧用启字整体笔划数据替换(压缩宽度+左移40)，右侧用收字(丩2笔+攵4笔)的攵(第3-6笔)替换
    // 此替换在 isCdnData 判断之外，无论数据来源都执行
    if (char === '啟') {
        const qiData = await fetchCharData('启');
        const shouData = await fetchCharData('收');
        const qiStrokes = scalePathXCenter(qiData.strokes, 0.8).map(s => shiftPathX(s, -140));
        strokes = [...qiStrokes, ...shouData.strokes.slice(2, 6).map(s => shiftPathX(s, 60))];
    }
    // 象字及其复合字(像、橡、蟓、豫)的笔划修正：替换𫩏笔划数据，缩放各字根
    // prefix=前缀字根笔画数, dx=象部X偏移(相对独立象字)
    function applyXiangFix(strokes, linData, prefix, dx) {
        const prefixStrokes = strokes.slice(0, prefix);
        const qianStrokes = strokes.slice(prefix, prefix + 2).map(s => shiftPathY(s, 30));
        const linYanStrokes = linData.strokes.slice(5, 9).map(s => scalePathXY(s, 1.1, 0.75, -281 + dx, 378));
        const shiStrokes = strokes.slice(prefix + 5).map(s => scalePath(s, 0.85, Math.round((450 + dx) * 0.15), 0));
        return [...prefixStrokes, ...qianStrokes, ...linYanStrokes, ...shiStrokes];
    }
