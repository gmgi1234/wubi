[schema]
id = "wubi_union"
name = "五笔大一统2026"
icon_label = "统"
version = "1.0.0"
author = "社区"
description = "86/98/新世纪三版兼容统一输入方案"
category = "wubi"
min_app_version = "0.100.0"

[[schema.variants]]
id = "wubi_union"
name = "五笔大一统2026"
schema_file = "wubi_union.schema.toml"
default = true

[engine]
type = "codetable"

[engine.codetable]
max_code_length = 4
auto_commit_unique = false
top_code_commit = false
punct_commit = true
clear_on_empty_max = false
show_code_hint = true
single_code_input = false
candidate_sort_mode = "frequency"
z_key_repeat = true

[engine.chaizi]
enabled = true
db_path = "wubi06_chaizi_pua.txt"
font_path = "xin_shiji_zigen.ttf"
font_family = "新世纪字根"

[[dictionaries]]
id = "wubi_union_main"
label = "五笔大一统2026主词库"
description = "86/98/新世纪三版兼容统一词库"
path = "dicts/wubi_union.dict.yaml"
default = true

[encoder]
max_word_length = 10

[[encoder.rules]]
length_equal = 2
formula = "AaAbBaBb"

[[encoder.rules]]
length_equal = 3
formula = "AaBaCaCb"

[[encoder.rules]]
length_in_range = [4, 10]
formula = "AaBaCaZa"

[learning.auto_learn]
enabled = true

[learning.freq]
enabled = true
protect_top_n = 3
